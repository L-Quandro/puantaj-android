name: 4011 Model APK v0.6.2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v5

      - name: Android projesini oluştur
        shell: bash
        run: |
          set -e
          mkdir -p puantaj/app/src/main/java/com/furkan/puantaj
          mkdir -p puantaj/app/src/main/res/values
          mkdir -p puantaj/app/src/main/res/drawable-nodpi
          mkdir -p puantaj/app/src/main/res/drawable
          mkdir -p puantaj/app/src/main/res/mipmap-anydpi-v26

          test -s "$GITHUB_WORKSPACE/puantaj_app_icon.png" || touch "$GITHUB_WORKSPACE/puantaj_app_icon.png"
          cp "$GITHUB_WORKSPACE/puantaj_app_icon.png" puantaj/app/src/main/res/drawable-nodpi/puantaj_icon.png 2>/dev/null || true

          cat > puantaj/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PuantajAndroid"
          include(":app")
          EOF

          cat > puantaj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > puantaj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > puantaj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.furkan.puantaj'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.furkan.puantaj'
                  minSdk 26
                  targetSdk 35
                  versionCode 37
                  versionName '0.6.3'
              }
          }
          dependencies {
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > puantaj/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/Theme.Puantaj"
                  android:label="4011 Model"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > puantaj/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/puantaj_icon_background" />
              <foreground android:drawable="@drawable/puantaj_icon_foreground" />
          </adaptive-icon>
          EOF

          cat > puantaj/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/puantaj_icon_background" />
              <foreground android:drawable="@drawable/puantaj_icon_foreground" />
          </adaptive-icon>
          EOF

          cat > puantaj/app/src/main/res/drawable/puantaj_icon_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/puantaj_icon"
              android:gravity="fill" />
          EOF

          cat > puantaj/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="puantaj_icon_background">#0B0719</color>
          </resources>
          EOF

          cat > puantaj/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.Puantaj" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0B0719</item>
                  <item name="android:navigationBarColor">#0B0719</item>
                  <item name="colorPrimary">#9D00FF</item>
                  <item name="colorSecondary">#39FF14</item>
              </style>
          </resources>
          EOF

          cat > puantaj/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">4011 Model</string>
          </resources>
          EOF

          cat > puantaj/app/src/main/java/com/furkan/puantaj/MainActivity.java <<'EOF'
          package com.furkan.puantaj;

          import android.app.*;
          import android.os.Bundle;
          import android.content.*;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.*;
          import android.widget.*;
          import com.google.android.material.textfield.TextInputEditText;
          import com.google.android.material.textfield.TextInputLayout;
          import java.text.SimpleDateFormat;
          import java.util.*;

          public class MainActivity extends Activity {
              LinearLayout root;
              SharedPreferences prefs;
              ArrayList<String> records = new ArrayList<>();

              String selectedStart = "";
              String selectedStartDate = "";
              String selectedFinish = "";
              String selectedFinishDate = "";
              String currentPage = "home";

              static final String DEFAULT_PEOPLE = "Hazım|Ender|Yücel|Emirhan|Melike";

              int SPACE_BG = Color.parseColor("#0B0719");
              int CARD_BG = Color.parseColor("#120F22");
              int CARD_INNER = Color.parseColor("#18142D");
              int NEON_PURPLE = Color.parseColor("#9D00FF");
              int NEON_GREEN = Color.parseColor("#39FF14");
              int TEXT_PRIMARY = Color.parseColor("#FFFFFF");
              int TEXT_MUTED = Color.parseColor("#8A87A0");

              ArrayList<String> ownerList() {
                  String raw = prefs.getString("owner_list", DEFAULT_PEOPLE);
                  ArrayList<String> list = new ArrayList<>();
                  for (String x : raw.split("\\|", -1)) {
                      x = x.trim();
                      if (!x.isEmpty() && !list.contains(x)) list.add(x);
                  }
                  if (list.isEmpty()) {
                      for (String x : DEFAULT_PEOPLE.split("\\|", -1)) list.add(x);
                  }
                  return list;
              }

              void saveOwnerList(ArrayList<String> list) {
                  StringBuilder b = new StringBuilder();
                  for (String x : list) {
                      if (b.length() > 0) b.append("|");
                      b.append(x.replace("|", ""));
                  }
                  prefs.edit().putString("owner_list", b.toString()).apply();
              }

              boolean useOwnerList() { return prefs.getBoolean("use_owner_list", true); }
              boolean autoContinuePerson() { return prefs.getBoolean("auto_continue_person", true); }
              int getHotelNightsMax() { return prefs.getInt("hotel_nights_max", 4); }
              void setHotelNightsMax(int v) { prefs.edit().putInt("hotel_nights_max", v).apply(); }

              String defaultOwner() {
                  if (!useOwnerList()) return "";
                  String selected = prefs.getString("default_owner", "");
                  if (selected.isEmpty()) return "";
                  return ownerList().contains(selected) ? selected : "";
              }

              void rememberOwner(String owner) {
                  if (owner != null && !owner.trim().isEmpty()) {
                      prefs.edit().putString("last_owner", owner.trim()).apply();
                  }
              }

              class OwnerPicker {
                  final TextInputLayout input;
                  final CheckBox modeCheck;
                  final Button chooser;
                  final String label;
                  final boolean listFirst;
                  String selected = "";

                  OwnerPicker(LinearLayout parent, String label) {
                      this(parent, label, true);
                  }

                  OwnerPicker(LinearLayout parent, String label, boolean listFirst) {
                      this.label = label;
                      this.listFirst = listFirst;

                      chooser = choice(label + " • Seç");
                      parent.addView(chooser);

                      modeCheck = new CheckBox(MainActivity.this);
                      modeCheck.setText(listFirst ? "Manuel gir" : "Listeden seç");
                      modeCheck.setTextSize(12);
                      modeCheck.setTextColor(TEXT_MUTED);
                      modeCheck.setButtonTintList(android.content.res.ColorStateList.valueOf(NEON_PURPLE));
                      parent.addView(modeCheck);

                      input = field(label);
                      parent.addView(input);

                      if (listFirst) {
                          chooser.setVisibility(View.VISIBLE);
                          input.setVisibility(View.GONE);
                          modeCheck.setChecked(false);
                      } else {
                          chooser.setVisibility(View.GONE);
                          input.setVisibility(View.VISIBLE);
                          modeCheck.setChecked(false);
                      }

                      chooser.setOnClickListener(v -> showOwnerChoices());

                      modeCheck.setOnCheckedChangeListener((buttonView, checked) -> {
                          if (listFirst) {
                              input.setVisibility(checked ? View.VISIBLE : View.GONE);
                              chooser.setVisibility(checked ? View.GONE : View.VISIBLE);
                              if (checked) {
                                  selected = "";
                                  if (input.getEditText() != null) input.getEditText().setText("");
                              }
                          } else {
                              chooser.setVisibility(View.GONE);
                              input.setVisibility(View.VISIBLE);
                              if (checked) {
                                  selected = "";
                                  showOwnerChoices();
                              }
                          }
                      });
                  }

                  void showOwnerChoices() {
                      if (!useOwnerList()) {
                          Toast.makeText(MainActivity.this, "Hazır kişi listesi kapalı.", Toast.LENGTH_SHORT).show();
                          modeCheck.setChecked(false);
                          if (listFirst) input.setVisibility(View.GONE);
                          return;
                      }
                      ArrayList<String> list = ownerList();
                      if (list.isEmpty()) return;
                      String[] items = list.toArray(new String[0]);
                      int checked = list.indexOf(selected);
                      new AlertDialog.Builder(MainActivity.this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                              .setTitle(label)
                              .setSingleChoiceItems(items, checked, (d, which) -> {
                                  selected = items[which];
                                  chooser.setText(label + " • " + selected);
                                  if (listFirst) {
                                      modeCheck.setChecked(false);
                                  } else {
                                      input.setVisibility(View.VISIBLE);
                                      if (input.getEditText() != null) input.getEditText().setText(selected);
                                      chooser.setVisibility(View.GONE);
                                      modeCheck.setChecked(false);
                                  }
                                  d.dismiss();
                              }).show();
                  }

                  String value() {
                      if (listFirst) return modeCheck.isChecked() ? MainActivity.this.value(input) : (selected == null ? "" : selected);
                      return modeCheck.isChecked() ? (selected == null ? "" : selected) : MainActivity.this.value(input);
                  }

                  void setValue(String value) {
                      if (value == null) value = "";
                      value = value.trim();
                      if (useOwnerList() && ownerList().contains(value)) {
                          selected = value;
                          chooser.setText(label + " • " + selected);
                          if (listFirst) modeCheck.setChecked(false);
                          else {
                              input.setVisibility(View.VISIBLE);
                              if (input.getEditText() != null) input.getEditText().setText(selected);
                              chooser.setVisibility(View.GONE);
                              modeCheck.setChecked(false);
                          }
                      } else {
                          selected = "";
                          modeCheck.setChecked(listFirst);
                          if (input.getEditText() != null) input.getEditText().setText(value);
                      }
                  }
              }

              int dp(float v) { return (int)(v * getResources().getDisplayMetrics().density + 0.5f); }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("puantaj", MODE_PRIVATE);
                  load();
                  if (android.os.Build.VERSION.SDK_INT >= 33) {
                      getOnBackInvokedDispatcher().registerOnBackInvokedCallback(
                              android.window.OnBackInvokedDispatcher.PRIORITY_DEFAULT, this::navigateBack);
                  }
                  home();
              }

              @Override
              public void onBackPressed() { navigateBack(); }

              void navigateBack() {
                  if ("home".equals(currentPage)) super.onBackPressed();
                  else if ("complete".equals(currentPage) || "continue".equals(currentPage)) ongoing();
                  else home();
              }

              String formatTrainName(String tName) {
                  if (tName == null) return "";
                  String upper = tName.toUpperCase(new Locale("tr", "TR"));
                  if (upper.startsWith("İPTAL") || upper.contains("TATİL") || upper.contains("GÜN") || upper.contains("İZİN") || upper.startsWith("DESTEK")) return upper;
                  return "TREN " + tName;
              }

              boolean isSpecialLabel(String v) {
                  if (v == null || v.isEmpty()) return false;
                  return v.equals("Hafta Tatili") || v.equals("Boş Gün") || v.equals("Yıllık İzin") || v.startsWith("İptal") || v.startsWith("Destek");
              }

              GradientDrawable bg(int color, float radius, int strokeColor, int strokeWidth) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(radius));
                  if(strokeWidth > 0) g.setStroke(dp(strokeWidth), strokeColor);
                  return g;
              }

              TextView text(String s, float size, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setTypeface(Typeface.DEFAULT, bold ? Typeface.BOLD : Typeface.NORMAL);
                  return t;
              }

              TextView title(String s) {
                  TextView t = text(s, 24, TEXT_PRIMARY, true);
                  t.setPadding(0, 0, 0, dp(4));
                  return t;
              }

              TextView subtitle(String s) {
                  TextView t = text(s, 13, TEXT_MUTED, false);
                  t.setPadding(0, 0, 0, dp(12));
                  return t;
              }

              TextView section(String s) {
                  TextView t = text(s.toUpperCase(Locale.getDefault()), 11, NEON_PURPLE, true);
                  t.setLetterSpacing(.08f);
                  t.setPadding(dp(4), dp(8), dp(4), dp(6));
                  return t;
              }

              LinearLayout card() {
                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setPadding(dp(12), dp(10), dp(12), dp(10));
                  c.setBackground(bg(CARD_BG, 18, Color.parseColor("#251D3A"), 1));
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, -2);
                  p.setMargins(0, 0, 0, dp(8));
                  c.setLayoutParams(p);
                  return c;
              }

              TextInputLayout field(String hint) {
                  TextInputLayout box = new TextInputLayout(this);
                  box.setHint(hint);
                  box.setBoxBackgroundMode(TextInputLayout.BOX_BACKGROUND_OUTLINE);
                  box.setBoxCornerRadii(dp(12),dp(12),dp(12),dp(12));
                  box.setBoxStrokeColor(NEON_PURPLE);
                  box.setHintTextColor(android.content.res.ColorStateList.valueOf(TEXT_MUTED));
                  box.setPadding(0, 0, 0, dp(4));

                  TextInputEditText edit = new TextInputEditText(box.getContext());
                  edit.setSingleLine(true);
                  edit.setTextSize(15);
                  edit.setTextColor(TEXT_PRIMARY);
                  box.addView(edit, new LinearLayout.LayoutParams(-1, dp(46)));
                  return box;
              }

              String value(TextInputLayout box) {
                  TextInputEditText e = (TextInputEditText)box.getEditText();
                  return e == null || e.getText() == null ? "" : e.getText().toString().trim();
              }

              Button action(String label, boolean primary) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextSize(14);
                  b.setTextColor(primary ? Color.BLACK : TEXT_PRIMARY);
                  b.setAllCaps(false);
                  b.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  b.setMinHeight(dp(44));
                  b.setPadding(dp(10), 0, dp(10), 0);

                  if (primary) b.setBackground(bg(NEON_PURPLE, 14, 0, 0));
                  else b.setBackground(bg(CARD_INNER, 14, NEON_GREEN, 1));

                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, dp(46));
                  p.setMargins(0, dp(4), 0, dp(6));
                  b.setLayoutParams(p);
                  return b;
              }

              Button choice(String label) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextSize(13);
                  b.setTextColor(TEXT_PRIMARY);
                  b.setAllCaps(false);
                  b.setGravity(Gravity.CENTER);
                  b.setBackground(bg(CARD_INNER, 12, Color.parseColor("#3B3259"), 1));
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, dp(42));
                  p.setMargins(0, dp(2), 0, dp(4));
                  b.setLayoutParams(p);
                  return b;
              }

              void page(String heading, String desc) {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(16), dp(16), dp(16), dp(20));
                  root.setBackgroundColor(SPACE_BG);
                  scroll.addView(root);
                  setContentView(scroll);
                  root.addView(title(heading));
                  if (!desc.isEmpty()) root.addView(subtitle(desc));
              }

              LinearLayout hRow() {
                  LinearLayout r = new LinearLayout(this);
                  r.setOrientation(LinearLayout.HORIZONTAL);
                  r.setBaselineAligned(false);
                  return r;
              }

              void home() {
                  currentPage = "home";
                  page("4011 Model", "TCDD Taşımacılık Puantaj ve Görev Takip");

                  LinearLayout hero = card();
                  hero.setBackground(bg(Color.parseColor("#150030"), 20, NEON_PURPLE, 1));
                  hero.addView(text("GÜNCEL DURUM", 11, NEON_PURPLE, true));
                  hero.addView(text(new SimpleDateFormat("dd MMMM yyyy EEEE", new Locale("tr","TR")).format(new Date()), 18, TEXT_PRIMARY, true));

                  int openCount = 0;
                  for (String r : records) {
                      String[] a = r.split("\\|", -1);
                      if (a.length >= 7 && (a[6].equals("OPEN") || a[6].equals("HOTEL"))) openCount++;
                  }
                  hero.addView(text(openCount + " aktif görev / Toplam " + records.size() + " kayıt", 13, NEON_GREEN, false));
                  root.addView(hero);

                  Button n = action("Yeni Görev Başlat", true);
                  root.addView(n);
                  n.setOnClickListener(v -> newRecord());

                  LinearLayout rowBtns = hRow();
                  Button o = action("Devam Eden (" + openCount + ")", false);
                  Button m = action("Aylık Rapor", false);

                  LinearLayout.LayoutParams p1 = new LinearLayout.LayoutParams(0, dp(46), 1f); p1.setMargins(0, dp(4), dp(4), dp(6)); o.setLayoutParams(p1);
                  LinearLayout.LayoutParams p2 = new LinearLayout.LayoutParams(0, dp(46), 1f); p2.setMargins(dp(4), dp(4), 0, dp(6)); m.setLayoutParams(p2);

                  rowBtns.addView(o); rowBtns.addView(m); root.addView(rowBtns);

                  o.setOnClickListener(v -> ongoing());
                  m.setOnClickListener(v -> monthly());

                  Button settings = choice("⚙ Ayarlar");
                  root.addView(settings);
                  settings.setOnClickListener(v -> settings());
              }

              void newRecord() {
                  currentPage = "newRecord";
                  page("Yeni Görev", "Yeni çalışma verisi oluştur.");

                  selectedStartDate = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault()).format(new Date());
                  selectedStart = "";

                  LinearLayout c = card();
                  c.addView(section("Tarih ve Saat"));

                  LinearLayout timeRow = hRow();
                  Button dateButton = choice("Tarih: " + selectedStartDate);
                  Button startButton = choice("Saat: Seçilmedi");

                  LinearLayout.LayoutParams tp = new LinearLayout.LayoutParams(0, dp(42), 1f); tp.setMargins(0, 0, dp(4), dp(4)); dateButton.setLayoutParams(tp);
                  LinearLayout.LayoutParams tp2 = new LinearLayout.LayoutParams(0, dp(42), 1f); tp2.setMargins(dp(4), 0, 0, dp(4)); startButton.setLayoutParams(tp2);

                  timeRow.addView(dateButton); timeRow.addView(startButton); c.addView(timeRow);

                  dateButton.setOnClickListener(v -> chooseDate(dateButton, true));
                  startButton.setOnClickListener(v -> chooseTime(startButton, true));

                  c.addView(section("Görev Detayları"));
                  LinearLayout inputRow = hRow();
                  TextInputLayout train = field("Tren No");
                  TextInputLayout person = field("Kiminle");

                  LinearLayout.LayoutParams ip = new LinearLayout.LayoutParams(0, -2, 1f); ip.setMargins(0, 0, dp(4), 0); train.setLayoutParams(ip);
                  LinearLayout.LayoutParams ip2 = new LinearLayout.LayoutParams(0, -2, 1f); ip2.setMargins(dp(4), 0, 0, 0); person.setLayoutParams(ip2);

                  inputRow.addView(train); inputRow.addView(person); c.addView(inputRow);

                  LinearLayout trainButtons = hRow();
                  Button outbound = choice("Gidiş Trenleri");
                  Button returnTrain = choice("Dönüş Trenleri");

                  LinearLayout.LayoutParams bp1 = new LinearLayout.LayoutParams(0, dp(38), 1f); bp1.setMargins(0, dp(4), dp(4), dp(4)); outbound.setLayoutParams(bp1); outbound.setTextSize(12);
                  LinearLayout.LayoutParams bp2 = new LinearLayout.LayoutParams(0, dp(38), 1f); bp2.setMargins(dp(4), dp(4), 0, dp(4)); returnTrain.setLayoutParams(bp2); returnTrain.setTextSize(12);

                  trainButtons.addView(outbound); trainButtons.addView(returnTrain); c.addView(trainButtons);

                  outbound.setOnClickListener(v -> chooseTrain(train, new String[]{"23201", "23202", "23205", "23207"}, "Gidiş Treni Seç"));
                  returnTrain.setOnClickListener(v -> chooseTrain(train, new String[]{"13102", "13104", "13106", "13108", "53503"}, "Dönüş Treni Seç"));

                  c.addView(section("Teslim / Tesellüm"));
                  OwnerPicker ownerPicker = new OwnerPicker(c, "Teslim Eden / Tesellüm Eden");

                  Button specialBtn = choice("★ Özel Durum / İzin");
                  specialBtn.setTextColor(Color.parseColor("#FFD700"));
                  c.addView(specialBtn);
                  specialBtn.setOnClickListener(v -> {
                      String[] options = {"Hafta Tatili", "Boş Gün", "Yıllık İzin", "Tren İptali", "İptal Destek 1", "İptal Destek 2", "İptal Destek 3"};
                      new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert).setItems(options, (dialog, which) -> {
                          String sel = options[which];
                          if(train.getEditText()!=null) train.getEditText().setText(sel);
                          if(isSpecialLabel(sel)){
                              if(person.getEditText()!=null) person.getEditText().setText("-");
                              ownerPicker.setValue("-");
                          }
                      }).show();
                  });

                  root.addView(c);

                  Button save = action("Kaydet ve Başlat", true);
                  root.addView(save);
                  save.setOnClickListener(v -> {
                      String currentTrainVal = value(train);
                      boolean isSpecialCase = isSpecialLabel(currentTrainVal);
                      if (isSpecialCase) {
                          if (currentTrainVal.isEmpty()) { Toast.makeText(this, "Açıklama giriniz.", Toast.LENGTH_SHORT).show(); return; }
                          records.add(UUID.randomUUID().toString() + "|" + selectedStartDate + "|-|" + currentTrainVal + "|00:00|-|DONE|" + selectedStartDate + "|00:00|-|" + selectedStartDate + " 00:00");
                          persist(); home(); return;
                      }
                      if (value(person).isEmpty() || currentTrainVal.isEmpty() || ownerPicker.value().isEmpty() || selectedStart.isEmpty()) {
                          Toast.makeText(this, "Lütfen tüm bilgileri doldurun.", Toast.LENGTH_SHORT).show(); return;
                      }
                      records.add(UUID.randomUUID().toString() + "|" + selectedStartDate + "|" + value(person) + "|" + currentTrainVal + "|" + selectedStart + "|" + ownerPicker.value() + "|OPEN");
                      rememberOwner(ownerPicker.value()); persist(); home();
                  });

                  Button cancel = choice("İptal");
                  root.addView(cancel);
                  cancel.setOnClickListener(v -> home());
              }

              void chooseDate(Button target, boolean start) {
                  Calendar c = Calendar.getInstance();
                  new DatePickerDialog(this, android.R.style.Theme_DeviceDefault_Dialog_Alert, (view, year, month, day) -> {
                          String v = String.format(Locale.getDefault(), "%02d.%02d.%04d", day, month + 1, year);
                          if (start) { selectedStartDate = v; target.setText("Tarih: " + v); }
                          else { selectedFinishDate = v; target.setText("Bitiş Tarihi: " + v); }
                      }, c.get(Calendar.YEAR), c.get(Calendar.MONTH), c.get(Calendar.DAY_OF_MONTH)).show();
              }

              void chooseTime(Button target, boolean start) {
                  Calendar c = Calendar.getInstance();
                  new TimePickerDialog(this, android.R.style.Theme_DeviceDefault_Dialog_Alert, (view, hour, minute) -> {
                          String v = String.format(Locale.getDefault(), "%02d:%02d", hour, minute);
                          if (start) { selectedStart = v; target.setText("Saat: " + v); }
                          else { selectedFinish = v; target.setText("Bitiş Saati: " + v); }
                      }, c.get(Calendar.HOUR_OF_DAY), c.get(Calendar.MINUTE), true).show();
              }

              boolean finishBeforeStart(String sd, String st, String fd, String ft) {
                  try {
                      Date start = new SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault()).parse(sd + " " + st);
                      Date finish = new SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault()).parse(fd + " " + ft);
                      return start != null && finish != null && finish.before(start);
                  } catch (Exception e) { return true; }
              }

              void showTimeOrderWarning() { Toast.makeText(this, "Bitiş zamanı başlangıçtan önce olamaz!", Toast.LENGTH_LONG).show(); }

              void editCompletedRecord(String raw) {
                  currentPage = "editCompleted";
                  page("Kayıt Düzenle", "Tamamlanmış görevi güncelle.");
                  String[] a = raw.split("\\|", -1);
                  if (a.length < 11) return;

                  LinearLayout c = card();
                  c.addView(section("Temel Bilgiler"));
                  TextInputLayout train = field("Tren No"); train.getEditText().setText(a[3]); c.addView(train);
                  TextInputLayout person = field("Kiminle"); person.getEditText().setText(a[2]); c.addView(person);

                  c.addView(section("Başlangıç Zamanı"));
                  selectedStartDate = a[1]; selectedStart = a[4];
                  LinearLayout r1 = hRow();
                  Button dateBtn = choice("Başlangıç Tarihi: " + selectedStartDate);
                  Button startBtn = choice("Başlangıç Saati: " + selectedStart);
                  LinearLayout.LayoutParams p1 = new LinearLayout.LayoutParams(0, dp(42), 1f); p1.setMargins(0,0,dp(4),0); dateBtn.setLayoutParams(p1);
                  LinearLayout.LayoutParams p2 = new LinearLayout.LayoutParams(0, dp(42), 1f); p2.setMargins(dp(4),0,0,0); startBtn.setLayoutParams(p2);
                  r1.addView(dateBtn); r1.addView(startBtn); c.addView(r1);

                  dateBtn.setOnClickListener(v -> chooseDate(dateBtn, true));
                  startBtn.setOnClickListener(v -> chooseTime(startBtn, true));

                  c.addView(section("Tesellüm Veren"));
                  OwnerPicker owner1 = new OwnerPicker(c, "Teslim Eden / Tesellüm Eden");
                  owner1.setValue(a[5]);

                  c.addView(section("Bitiş Zamanı"));
                  selectedFinishDate = a[7]; selectedFinish = a[8];
                  LinearLayout r2 = hRow();
                  Button fDateBtn = choice("Bitiş Tarihi: " + selectedFinishDate);
                  Button fTimeBtn = choice("Bitiş Saati: " + selectedFinish);
                  LinearLayout.LayoutParams p3 = new LinearLayout.LayoutParams(0, dp(42), 1f); p3.setMargins(0,0,dp(4),0); fDateBtn.setLayoutParams(p3);
                  LinearLayout.LayoutParams p4 = new LinearLayout.LayoutParams(0, dp(42), 1f); p4.setMargins(dp(4),0,0,0); fTimeBtn.setLayoutParams(p4);
                  r2.addView(fDateBtn); r2.addView(fTimeBtn); c.addView(r2);

