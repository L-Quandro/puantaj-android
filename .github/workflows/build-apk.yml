name: Puantaj APK v0.5.22

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Android projesini oluştur
        shell: bash
        run: |
          set -e
          mkdir -p puantaj/app/src/main/java/com/furkan/puantaj
          mkdir -p puantaj/app/src/main/res/values
          mkdir -p puantaj/app/src/main/res/drawable-nodpi
          mkdir -p puantaj/app/src/main/res/drawable
          mkdir -p puantaj/app/src/main/res/mipmap-anydpi-v26

          # Uygulama simgesi: GitHub deposundaki puantaj_app_icon.png aynen kullanılır.
          # PNG yeniden kırpılmaz, yeniden boyutlandırılmaz ve başka bir görsel ile birleştirilmez.
          test -s "$GITHUB_WORKSPACE/puantaj_app_icon.png"
          cp "$GITHUB_WORKSPACE/puantaj_app_icon.png" puantaj/app/src/main/res/drawable-nodpi/puantaj_icon.png
          test -s puantaj/app/src/main/res/drawable-nodpi/puantaj_icon.png

          cat > puantaj/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PuantajAndroid"
          include(":app")
          EOF

          cat > puantaj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > puantaj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > puantaj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.furkan.puantaj'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.furkan.puantaj'
                  minSdk 26
                  targetSdk 35
                  versionCode 25
                  versionName '0.5.22'
              }
          }
          dependencies {
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > puantaj/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/Theme.Puantaj"
                  android:label="Puantaj"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > puantaj/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/puantaj_icon" />
              <foreground android:drawable="@drawable/puantaj_icon_transparent" />
          </adaptive-icon>
          EOF

          cat > puantaj/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/puantaj_icon" />
              <foreground android:drawable="@drawable/puantaj_icon_transparent" />
          </adaptive-icon>
          EOF

          cat > puantaj/app/src/main/res/drawable/puantaj_icon_transparent.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="@android:color/transparent" />
          </shape>
          EOF

          cat > puantaj/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.Puantaj" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0F0D13</item>
                  <item name="android:navigationBarColor">#0F0D13</item>
                  <item name="colorPrimary">#7053AA</item>
                  <item name="colorSecondary">#A98BD4</item>
              </style>
          </resources>
          EOF

          cat > puantaj/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Puantaj</string>
          </resources>
          EOF

          cat > puantaj/app/src/main/java/com/furkan/puantaj/MainActivity.java <<'EOF'
          package com.furkan.puantaj;
          
          import android.app.*;
          import android.os.Bundle;
          import android.content.*;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.*;
          import android.widget.*;
          import com.google.android.material.textfield.TextInputEditText;
          import com.google.android.material.textfield.TextInputLayout;
          import java.text.SimpleDateFormat;
          import java.util.*;
          
          public class MainActivity extends Activity {
              LinearLayout root;
              SharedPreferences prefs;
              ArrayList<String> records = new ArrayList<>();
          
              String selectedStart = "";
              String selectedStartDate = "";
              String selectedFinish = "";
              String selectedFinishDate = "";
              String currentPage = "home";

              static final String DEFAULT_PEOPLE = "Hazım|Ender|Yücel|Emirhan|Melike";

              ArrayList<String> ownerList() {
                  String raw = prefs.getString("owner_list", DEFAULT_PEOPLE);
                  ArrayList<String> list = new ArrayList<>();
                  for (String x : raw.split("\\|", -1)) {
                      x = x.trim();
                      if (!x.isEmpty() && !list.contains(x)) list.add(x);
                  }
                  if (list.isEmpty()) {
                      for (String x : DEFAULT_PEOPLE.split("\\|", -1)) list.add(x);
                  }
                  return list;
              }

              void saveOwnerList(ArrayList<String> list) {
                  StringBuilder b = new StringBuilder();
                  for (String x : list) {
                      if (b.length() > 0) b.append("|");
                      b.append(x.replace("|", ""));
                  }
                  prefs.edit().putString("owner_list", b.toString()).apply();
              }

              boolean useOwnerList() {
                  return prefs.getBoolean("use_owner_list", true);
              }

              boolean autoContinuePerson() {
                  return prefs.getBoolean("auto_continue_person", true);
              }

              String defaultOwner() {
                  if (!useOwnerList()) return "";
                  String selected = prefs.getString("default_owner", "");
                  if (selected.isEmpty()) return "";
                  return ownerList().contains(selected) ? selected : "";
              }

              void rememberOwner(String owner) {
                  if (owner != null && !owner.trim().isEmpty()) {
                      prefs.edit().putString("last_owner", owner.trim()).apply();
                  }
              }

              // v0.5.18: hazır isim otomatik seçimi yalnızca 1. aşama (görev başlatma) içindir;
              // 2. aşama (görev bitişi/otel) manuel giriş ile başlar, hazır liste yalnızca tik ile açılır.
              class OwnerPicker {
                  final TextInputLayout input;
                  final CheckBox modeCheck;
                  final Button chooser;
                  final String label;
                  final boolean listFirst;
                  String selected = "";

                  // listFirst=true: başlangıç/final kayıtta önce hazır kişi seçimi gösterilir.
                  // listFirst=false: ara teslim/tesellümde önce manuel giriş gösterilir;
                  // kullanıcı isterse tik ile hazır listeden seçim moduna geçer.
                  OwnerPicker(LinearLayout parent, String label) {
                      this(parent, label, true);
                  }

                  OwnerPicker(LinearLayout parent, String label, boolean listFirst) {
                      this.label = label;
                      this.listFirst = listFirst;

                      chooser = choice(label + "  •  Seç");
                      parent.addView(chooser);

                      modeCheck = new CheckBox(MainActivity.this);
                      modeCheck.setText(listFirst ? "Manuel farklı isim gireceğim" : "Hazır listeden seç");
                      modeCheck.setTextSize(14);
                      modeCheck.setTextColor(Color.rgb(225,220,232));
                      modeCheck.setButtonTintList(android.content.res.ColorStateList.valueOf(Color.rgb(169,139,212)));
                      parent.addView(modeCheck);

                      input = field(label);
                      parent.addView(input);

                      if (listFirst) {
                          // Başlangıç/final kaydında hiçbir isim otomatik yazılmaz.
                          // Kullanıcı önce seçim ekranından bir isim seçer.
                          chooser.setVisibility(View.VISIBLE);
                          input.setVisibility(View.GONE);
                          modeCheck.setChecked(false);
                      } else {
                          // Ara teslim/tesellüm alanı manuel giriş ile başlar.
                          chooser.setVisibility(View.GONE);
                          input.setVisibility(View.VISIBLE);
                          modeCheck.setChecked(false);
                      }

                      chooser.setOnClickListener(v -> showOwnerChoices());

                      modeCheck.setOnCheckedChangeListener((buttonView, checked) -> {
                          if (listFirst) {
                              input.setVisibility(checked ? View.VISIBLE : View.GONE);
                              chooser.setVisibility(checked ? View.GONE : View.VISIBLE);
                              if (checked) {
                                  selected = "";
                                  input.getEditText().setText("");
                              }
                          } else {
                              // Ara teslim/tesellüm: manuel alan her zaman görünür.
                              // Tik yalnızca hazır isim listesini açar; seçim sonrası
                              // isim manuel alana aktarılır ve tik kapanır.
                              chooser.setVisibility(View.GONE);
                              input.setVisibility(View.VISIBLE);
                              if (checked) {
                                  selected = "";
                                  showOwnerChoices();
                              }
                          }
                      });
                  }

                  void showOwnerChoices() {
                      if (!useOwnerList()) {
                          Toast.makeText(MainActivity.this, "Hazır kişi listesi Ayarlar'dan kapalı.", Toast.LENGTH_SHORT).show();
                          modeCheck.setChecked(false);
                          if (listFirst) input.setVisibility(View.GONE);
                          return;
                      }
                      ArrayList<String> list = ownerList();
                      if (list.isEmpty()) {
                          Toast.makeText(MainActivity.this, "Hazır kişi listesinde isim yok.", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      String[] items = list.toArray(new String[0]);
                      int checked = list.indexOf(selected);
                      new AlertDialog.Builder(MainActivity.this)
                              .setTitle(label)
                              .setSingleChoiceItems(items, checked, (d, which) -> {
                                  selected = items[which];
                                  chooser.setText(label + "  •  " + selected);
                                  if (listFirst) {
                                      modeCheck.setChecked(false);
                                  } else {
                                      input.setVisibility(View.VISIBLE);
                                      input.getEditText().setText(selected);
                                      chooser.setVisibility(View.GONE);
                                      modeCheck.setChecked(false);
                                  }
                                  d.dismiss();
                              })
                              .setNegativeButton("İptal", null)
                              .show();
                  }

                  String value() {
                      if (listFirst) {
                          return modeCheck.isChecked() ? MainActivity.this.value(input) :
                                  (selected == null ? "" : selected);
                      }
                      return modeCheck.isChecked() ? (selected == null ? "" : selected) :
                              MainActivity.this.value(input);
                  }

                  void setValue(String value) {
                      if (value == null) value = "";
                      value = value.trim();
                      if (useOwnerList() && ownerList().contains(value)) {
                          selected = value;
                          chooser.setText(label + "  •  " + selected);
                          if (listFirst) {
                              modeCheck.setChecked(false);
                          } else {
                              input.setVisibility(View.VISIBLE);
                              input.getEditText().setText(selected);
                              chooser.setVisibility(View.GONE);
                              modeCheck.setChecked(false);
                          }
                      } else {
                          selected = "";
                          modeCheck.setChecked(listFirst);
                          input.getEditText().setText(value);
                      }
                  }
              }
          
              int dp(float v) {
                  return (int)(v * getResources().getDisplayMetrics().density + 0.5f);
              }
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("puantaj", MODE_PRIVATE);
                  load();
                  if (android.os.Build.VERSION.SDK_INT >= 33) {
                      getOnBackInvokedDispatcher().registerOnBackInvokedCallback(
                              android.window.OnBackInvokedDispatcher.PRIORITY_DEFAULT,
                              this::navigateBack);
                  }
                  home();
              }

              @Override
              public void onBackPressed() {
                  navigateBack();
              }

              void navigateBack() {
                  if ("home".equals(currentPage)) {
                      super.onBackPressed();
                      return;
                  }
                  if ("complete".equals(currentPage) || "continue".equals(currentPage)) {
                      ongoing();
                  } else {
                      home();
                  }
              }
          
              GradientDrawable bg(int color, float radius) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(radius));
                  return g;
              }
          
              TextView text(String s, float size, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setTypeface(Typeface.DEFAULT, bold ? Typeface.BOLD : Typeface.NORMAL);
                  return t;
              }
          
              TextView title(String s) {
                  TextView t = text(s, 30, Color.rgb(245,243,250), true);
                  t.setPadding(0, 0, 0, dp(6));
                  return t;
              }
          
              TextView subtitle(String s) {
                  TextView t = text(s, 15, Color.rgb(170,165,180), false);
                  t.setPadding(0, 0, 0, dp(22));
                  return t;
              }
          
              TextView section(String s) {
                  TextView t = text(s.toUpperCase(Locale.getDefault()), 12, Color.rgb(185,178,205), true);
                  t.setLetterSpacing(.08f);
                  t.setPadding(dp(4), dp(16), dp(4), dp(8));
                  return t;
              }
          
              LinearLayout card() {
                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setPadding(dp(16), dp(14), dp(16), dp(14));
                  c.setBackground(bg(Color.rgb(29,26,35), 22));
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, -2);
                  p.setMargins(0, 0, 0, dp(12));
                  c.setLayoutParams(p);
                  return c;
              }
          
              TextInputLayout field(String hint) {
                  TextInputLayout box = new TextInputLayout(this);
                  box.setHint(hint);
                  box.setBoxBackgroundMode(TextInputLayout.BOX_BACKGROUND_OUTLINE);
                  box.setBoxCornerRadii(dp(14),dp(14),dp(14),dp(14));
                  box.setBoxStrokeColor(Color.rgb(115,100,150));
                  box.setHintTextColor(android.content.res.ColorStateList.valueOf(Color.rgb(170,165,180)));
                  box.setPadding(0, dp(4), 0, dp(8));
          
                  TextInputEditText edit = new TextInputEditText(box.getContext());
                  edit.setSingleLine(true);
                  edit.setTextSize(17);
                  edit.setTextColor(Color.rgb(245,243,250));
                  edit.setHintTextColor(Color.rgb(150,145,160));
                  box.addView(edit, new LinearLayout.LayoutParams(-1, dp(54)));
                  return box;
              }
          
              String value(TextInputLayout box) {
                  TextInputEditText e = (TextInputEditText)box.getEditText();
                  return e == null || e.getText() == null ? "" : e.getText().toString().trim();
              }
          
              Button action(String label, boolean primary) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextSize(15);
                  b.setTextColor(Color.rgb(248,246,252));
                  b.setAllCaps(false);
                  b.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  b.setMinHeight(dp(52));
                  b.setPadding(dp(10), 0, dp(10), 0);
                  b.setBackground(bg(primary ? Color.rgb(112,83,170) : Color.rgb(45,41,52), 18));
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, dp(54));
                  p.setMargins(0, dp(4), 0, dp(10));
                  b.setLayoutParams(p);
                  return b;
              }
          
              Button choice(String label) {
                  Button b = action(label, false);
                  b.setTextSize(15);
                  b.setGravity(Gravity.CENTER_VERTICAL);
                  return b;
              }
          
              void page(String heading, String desc) {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(20), dp(24), dp(20), dp(28));
                  root.setBackgroundColor(Color.rgb(15,13,19));
                  scroll.addView(root);
                  setContentView(scroll);
                  root.addView(title(heading));
                  if (!desc.isEmpty()) root.addView(subtitle(desc));
              }
          
              void home() {
                  currentPage = "home";
                  page("PUANTAJ", "Günlük görevlerini hızlıca kaydet. Hesaplamaları uygulamaya bırak.");
          
                  LinearLayout hero = card();
                  hero.setBackground(bg(Color.rgb(40,32,55), 24));
                  hero.addView(text("Bugünün görevi", 13, Color.rgb(194,180,220), true));
                  hero.addView(text(new SimpleDateFormat("EEEE, dd MMMM", new Locale("tr","TR")).format(new Date()), 22, Color.rgb(250,248,255), true));
                  java.util.HashSet<String> serviceChains = new java.util.HashSet<>();
                  for (String r : records) {
                      String[] a = r.split("\\|", -1);
                      if (a.length >= 1 && !a[0].trim().isEmpty()) serviceChains.add(a[0]);
                  }
                  hero.addView(text(serviceChains.size() + " servis kaydı telefonda güvenle saklanıyor", 14, Color.rgb(175,168,185), false));
                  root.addView(hero);
          
                  Button n = action("＋  Yeni Görev / Tren Al", true);
                  root.addView(n);
                  n.setOnClickListener(v -> newRecord());
          
                  Button o = action("↻  Devam Eden Kayıtlar", false);
                  root.addView(o);
                  o.setOnClickListener(v -> ongoing());
          
                  Button m = action("▦  Aylık Kayıtlar", false);
                  root.addView(m);
                  m.setOnClickListener(v -> monthly());

                  Button settings = action("⚙  Ayarlar", false);
                  root.addView(settings);
                  settings.setOnClickListener(v -> settings());
          
                  root.addView(section("Nasıl çalışır?"));
                  LinearLayout help = card();
                  help.addView(text("1  Görev alış / başlangıç saatini seç.", 14, Color.rgb(225,220,232), false));
                  help.addView(text("2  Uygulamayı kapat; görev telefonda kalır.", 14, Color.rgb(225,220,232), false));
                  help.addView(text("3  Bitiş saatini gir; eve giriş otomatik +30 dk.", 14, Color.rgb(225,220,232), false));
                  root.addView(help);
              }
          
              void newRecord() {
                  currentPage = "newRecord";
                  page("Yeni Görev", "Puantaj satırını oluşturmak için bilgileri gir.");
          
                  selectedStartDate = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault()).format(new Date());
                  selectedStart = "";
          
                  LinearLayout c = card();
                  c.addView(section("Görev bilgileri"));
          
                  Button dateButton = choice("Tarih  •  " + selectedStartDate);
                  c.addView(dateButton);
                  dateButton.setOnClickListener(v -> chooseDate(dateButton, true));
          
                  TextInputLayout person = field("Kiminle gittin?");
                  c.addView(person);
          
                  TextInputLayout train = field("Tren no");
                  c.addView(train);

                  c.addView(section("Hazır tren seçenekleri"));
                  LinearLayout trainButtons = new LinearLayout(this);
                  trainButtons.setOrientation(LinearLayout.HORIZONTAL);

                  Button outbound = choice("Gidiş trenleri");
                  Button returnTrain = choice("Dönüş trenleri");
                  outbound.setTextSize(13);
                  returnTrain.setTextSize(13);
                  LinearLayout.LayoutParams half = new LinearLayout.LayoutParams(0, dp(52), 1f);
                  half.setMargins(0, 0, dp(6), dp(8));
                  outbound.setLayoutParams(half);
                  LinearLayout.LayoutParams half2 = new LinearLayout.LayoutParams(0, dp(52), 1f);
                  half2.setMargins(dp(6), 0, 0, dp(8));
                  returnTrain.setLayoutParams(half2);
                  trainButtons.addView(outbound);
                  trainButtons.addView(returnTrain);
                  c.addView(trainButtons);

                  outbound.setOnClickListener(v -> chooseTrain(train, new String[]{
                          "23201", "23202", "23205", "23207"
                  }, "Gidiş trenini seç"));
                  returnTrain.setOnClickListener(v -> chooseTrain(train, new String[]{
                          "13102", "13104", "13106", "13108", "53503"
                  }, "Dönüş trenini seç"));

                  c.addView(text("İstersen hazır seçeneklerden seçebilir veya Tren no alanına manuel yazabilirsin.",
                          12, Color.rgb(155,148,165), false));
          
                  c.addView(section("Başlangıç"));

                  OwnerPicker ownerPicker = new OwnerPicker(c, "Teslim / tesellüm sahibi");

                  Button startButton = choice("Saat seç  •  Henüz seçilmedi");
                  c.addView(startButton);
                  startButton.setOnClickListener(v -> chooseTime(startButton, true));
          
                  root.addView(c);
          
                  Button save = action("Görevi Başlat ve Kaydet", true);
                  root.addView(save);
                  save.setOnClickListener(v -> {
                      if (value(person).isEmpty() || value(train).isEmpty() ||
                              ownerPicker.value().isEmpty() || selectedStart.isEmpty()) {
                          Toast.makeText(this, "Kiminle, tren no, teslim/tesellüm sahibi ve başlangıç saati gerekli.", Toast.LENGTH_LONG).show();
                          return;
                      }
                      String chainId = UUID.randomUUID().toString();
                      String record = chainId + "|" + selectedStartDate + "|" +
                              value(person) + "|" + value(train) + "|" + selectedStart + "|" +
                              ownerPicker.value() + "|OPEN";
                      records.add(record);
                      rememberOwner(ownerPicker.value());
                      persist();
                      Toast.makeText(this, "Kayıt oluşturuldu. Uygulamayı kapatabilirsin.", Toast.LENGTH_SHORT).show();
                      home();
                  });
          
                  Button cancel = action("Vazgeç", false);
                  root.addView(cancel);
                  cancel.setOnClickListener(v -> home());
              }
          
              void chooseDate(Button target, boolean start) {
                  Calendar c = Calendar.getInstance();
                  String base = start ? selectedStartDate : selectedFinishDate;
                  if (base != null && !base.isEmpty()) {
                      try {
                          Date d = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault()).parse(base);
                          if (d != null) c.setTime(d);
                      } catch (Exception ignored) {}
                  }
          
                  DatePickerDialog d = new DatePickerDialog(this,
                      (view, year, month, day) -> {
                          String v = String.format(Locale.getDefault(), "%02d.%02d.%04d", day, month + 1, year);
                          if (start) {
                              selectedStartDate = v;
                              target.setText("Tarih  •  " + v);
                          } else {
                              selectedFinishDate = v;
                              target.setText("Görev bitiş tarihi  •  " + v);
                          }
                      }, c.get(Calendar.YEAR), c.get(Calendar.MONTH), c.get(Calendar.DAY_OF_MONTH));
                  d.show();
              }
          
              void chooseTime(Button target, boolean start) {
                  Calendar c = Calendar.getInstance();
                  TimePickerDialog d = new TimePickerDialog(this,
                      (view, hour, minute) -> {
                          String v = String.format(Locale.getDefault(), "%02d:%02d", hour, minute);
                          if (start) {
                              selectedStart = v;
                              target.setText("Saat seçildi  •  " + v);
                          } else {
                              selectedFinish = v;
                              target.setText("Görev bitiş / teslim  •  " + v);
                          }
                      }, c.get(Calendar.HOUR_OF_DAY), c.get(Calendar.MINUTE), true);
                  d.show();
              }
          
              boolean finishBeforeStart(String startDate, String startTime, String finishDate, String finishTime) {
                  try {
                      SimpleDateFormat f = new SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault());
                      f.setLenient(false);
                      Date start = f.parse(startDate + " " + startTime);
                      Date finish = f.parse(finishDate + " " + finishTime);
                      return start != null && finish != null && finish.before(start);
                  } catch (Exception e) {
                      return true;
                  }
              }

              void showTimeOrderWarning() {
                  new AlertDialog.Builder(this)
                          .setTitle("Saat bilgisi hatalı")
