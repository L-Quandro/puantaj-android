                  android.view.View.OnClickListener saveLogic = v -> {
                      if (selectedFinish.isEmpty() || tempOwner.isEmpty()) {
                          Toast.makeText(this, "Eksik bilgi var.", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      String arrival = addThirtyMinutes(selectedFinishDate, selectedFinish);
                      boolean isHotelMode = v == btnToHotel;
                      
                      String newRec;
                      if (isHotelMode) {
                          newRec = r.replace("|OPEN", "|HOTEL|" + selectedFinishDate + "|" + selectedFinish + "|" + tempOwner + "|" + arrival);
                      } else {
                          newRec = r.replace("|OPEN", "|DONE|" + selectedFinishDate + "|" + selectedFinish + "|" + tempOwner + "|" + arrival) + "|" + hotelNights[0];
                      }
                      records.set(records.indexOf(r), newRec);
                      persist();
                      home();
                  };
                  
                  btnToHotel.setOnClickListener(saveLogic);
                  btnDone.setOnClickListener(saveLogic);
              }

