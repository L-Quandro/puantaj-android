              int excelColToNum(String letters) {
                  int n = 0;
                  for (int i = 0; i < letters.length(); i++) {
                      n = n * 26 + (letters.charAt(i) - 'A' + 1);
                  }
                  return n;
              }

              String excelXmlEscape(String s) {
                  if (s == null) s = "";
                  return s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;").replace("\"", "&quot;");
              }

              String excelSetCell(String sheetXml, String cellRef, String text, int style) {
                  Matcher refM = Pattern.compile("([A-Z]+)(\\d+)").matcher(cellRef);
                  if (!refM.matches()) throw new IllegalArgumentException("Geçersiz hücre: " + cellRef);
                  String colLetters = refM.group(1);
                  int rowNum = Integer.parseInt(refM.group(2));
                  int colNum = excelColToNum(colLetters);

                  Matcher rowM = Pattern.compile("<row r=\"" + rowNum + "\"[^>]*>.*?</row>", Pattern.DOTALL).matcher(sheetXml);
                  if (!rowM.find()) throw new IllegalStateException("Satır bulunamadı: " + rowNum);
                  String rowXml = rowM.group();

                  Matcher cellM = Pattern.compile("<c r=\"" + cellRef + "\"[^>]*(?:/>|>.*?</c>)", Pattern.DOTALL).matcher(rowXml);
                  boolean exists = cellM.find();

                  int effectiveStyle = style;
                  if (exists && style < 0) {
                      Matcher sM = Pattern.compile("s=\"(\\d+)\"").matcher(cellM.group());
                      if (sM.find()) effectiveStyle = Integer.parseInt(sM.group(1));
                  }
                  String styleAttr = effectiveStyle >= 0 ? (" s=\"" + effectiveStyle + "\"") : "";
                  String newCell = "<c r=\"" + cellRef + "\"" + styleAttr + " t=\"inlineStr\"><is><t xml:space=\"preserve\">"
                          + excelXmlEscape(text) + "</t></is></c>";

                  String newRowXml;
                  if (exists) {
                      newRowXml = rowXml.substring(0, cellM.start()) + newCell + rowXml.substring(cellM.end());
                  } else {
                      Matcher anyM = Pattern.compile("<c r=\"([A-Z]+)(\\d+)\"[^>]*(?:/>|>.*?</c>)", Pattern.DOTALL).matcher(rowXml);
                      int insertPos = -1;
                      while (anyM.find()) {
                          if (excelColToNum(anyM.group(1)) > colNum) { insertPos = anyM.start(); break; }
                      }
                      if (insertPos < 0) insertPos = rowXml.lastIndexOf("</row>");
                      newRowXml = rowXml.substring(0, insertPos) + newCell + rowXml.substring(insertPos);
                  }
                  return sheetXml.substring(0, rowM.start()) + newRowXml + sheetXml.substring(rowM.end());
              }

              String excelAddMerge(String sheetXml, String ref) {
                  Matcher m = Pattern.compile("<mergeCells count=\"(\\d+)\">").matcher(sheetXml);
                  if (!m.find()) throw new IllegalStateException("mergeCells bulunamadı");
                  int newCount = Integer.parseInt(m.group(1)) + 1;
                  String result = sheetXml.substring(0, m.start()) + "<mergeCells count=\"" + newCount + "\">"
                          + sheetXml.substring(m.end());
                  int insertAt = result.indexOf("</mergeCells>");
                  return result.substring(0, insertAt) + "<mergeCell ref=\"" + ref + "\"/>" + result.substring(insertAt);
              }

              String excelSetPersonnelValue(String sheetXml, String anchorRef, String mergeRangeEnd, String text, int style) {
                  String result = excelSetCell(sheetXml, anchorRef, text, style);
                  result = excelAddMerge(result, anchorRef + ":" + mergeRangeEnd);
                  return result;
              }

              int[] excelStyleCounts(String stylesXml) {
                  Matcher fm = Pattern.compile("<fonts count=\"(\\d+)\"").matcher(stylesXml);
                  fm.find();
                  Matcher xm = Pattern.compile("<cellXfs count=\"(\\d+)\"").matcher(stylesXml);
                  xm.find();
                  return new int[]{Integer.parseInt(fm.group(1)), Integer.parseInt(xm.group(1))};
              }

              ArrayList<String> excelListBlocks(String containerXml, String tag) {
                  ArrayList<String> out = new ArrayList<>();
                  Matcher m = Pattern.compile("<" + tag + "\\b[^>]*/>|<" + tag + "\\b[^>]*>.*?</" + tag + ">",
                          Pattern.DOTALL).matcher(containerXml);
                  while (m.find()) out.add(m.group());
                  return out;
              }

              String excelBlockByIndex(String stylesXml, String outerTag, String itemTag, int index) {
                  Matcher m = Pattern.compile("<" + outerTag + " count=\"\\d+\"[^>]*>(.*?)</" + outerTag + ">",
                          Pattern.DOTALL).matcher(stylesXml);
                  m.find();
                  return excelListBlocks(m.group(1), itemTag).get(index);
              }

              class ExcelStylePatcher {
                  String original;
                  int fontCount, xfCount;
                  ArrayList<String> newFonts = new ArrayList<>();
                  ArrayList<String> newXfs = new ArrayList<>();
                  HashMap<Integer, Integer> redVariantCache = new HashMap<>();
                  Integer bigValueStyleCache = null;

                  int getOrCreateBigValueStyle() {
                      if (bigValueStyleCache != null) return bigValueStyleCache;
                      String newFont = "<font><sz val=\"28\"/><color theme=\"1\"/><name val=\"Calibri\"/><family val=\"2\"/><scheme val=\"minor\"/></font>";
                      int newFontIndex = fontCount + newFonts.size();
                      newFonts.add(newFont);

                      String newXf = "<xf numFmtId=\"0\" fontId=\"" + newFontIndex + "\" fillId=\"0\" borderId=\"0\" xfId=\"0\""
                              + " applyFont=\"1\" applyAlignment=\"1\"><alignment horizontal=\"left\" vertical=\"center\"/></xf>";
                      int newXfIndex = xfCount + newXfs.size();
                      newXfs.add(newXf);

                      bigValueStyleCache = newXfIndex;
                      return newXfIndex;
                  }

                  ExcelStylePatcher(String stylesXml) {
                      original = stylesXml;
                      int[] counts = excelStyleCounts(stylesXml);
                      fontCount = counts[0];
                      xfCount = counts[1];
                  }

                  int getOrCreateRedVariant(int baseStyleIndex) {
                      Integer cached = redVariantCache.get(baseStyleIndex);
                      if (cached != null) return cached;

                      String baseXf = excelBlockByIndex(original, "cellXfs", "xf", baseStyleIndex);
                      Matcher fIdM = Pattern.compile("fontId=\"(\\d+)\"").matcher(baseXf);
                      int baseFontId = fIdM.find() ? Integer.parseInt(fIdM.group(1)) : 0;
                      String baseFont = excelBlockByIndex(original, "fonts", "font", baseFontId);

                      String newFont;
                      Matcher colorM = Pattern.compile("<color[^/]*/>").matcher(baseFont);
                      if (colorM.find()) {
                          newFont = baseFont.substring(0, colorM.start()) + "<color rgb=\"FFFF0000\"/>" + baseFont.substring(colorM.end());
                      } else {
                          int insertAt = baseFont.lastIndexOf("</font>");
                          newFont = baseFont.substring(0, insertAt) + "<color rgb=\"FFFF0000\"/>" + baseFont.substring(insertAt);
                      }
                      int newFontIndex = fontCount + newFonts.size();
                      newFonts.add(newFont);

                      Matcher fontIdM = Pattern.compile("fontId=\"\\d+\"").matcher(baseXf);
                      fontIdM.find();
                      String newXf = baseXf.substring(0, fontIdM.start()) + "fontId=\"" + newFontIndex + "\"" + baseXf.substring(fontIdM.end());
                      int newXfIndex = xfCount + newXfs.size();
                      newXfs.add(newXf);

                      redVariantCache.put(baseStyleIndex, newXfIndex);
                      return newXfIndex;
                  }

                  String build() {
                      String result = original;
                      if (!newFonts.isEmpty()) {
                          int total = fontCount + newFonts.size();
                          Matcher cm = Pattern.compile("<fonts count=\"\\d+\"").matcher(result);
                          cm.find();
                          result = result.substring(0, cm.start()) + "<fonts count=\"" + total + "\"" + result.substring(cm.end());
                          StringBuilder sb = new StringBuilder();
                          for (String f : newFonts) sb.append(f);
                          int insertAt = result.indexOf("</fonts>");
                          result = result.substring(0, insertAt) + sb + result.substring(insertAt);
                      }
                      if (!newXfs.isEmpty()) {
                          int total = xfCount + newXfs.size();
                          Matcher cm = Pattern.compile("<cellXfs count=\"\\d+\"").matcher(result);
                          cm.find();
                          result = result.substring(0, cm.start()) + "<cellXfs count=\"" + total + "\"" + result.substring(cm.end());
                          StringBuilder sb = new StringBuilder();
                          for (String x : newXfs) sb.append(x);
                          int insertAt = result.indexOf("</cellXfs>");
                          result = result.substring(0, insertAt) + sb + result.substring(insertAt);
                      }
                      return result;
                  }
              }

