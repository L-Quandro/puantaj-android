              void newRecord() {
                  currentPage = "newRecord";
                  selectedStartDate = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault()).format(new Date());
                  selectedStart = "";

                  final String[] wizPerson = {""};
                  final String[] wizTrain = {""};
                  final String[] wizOwner = {defaultOwner()};
                  final int[] wizStep = {0};
                  final int totalSteps = 5;
                  final Runnable[] render = new Runnable[1];

                  render[0] = () -> {
                      int step = wizStep[0];
                      Runnable onBack = (step == 0)
                              ? (Runnable) this::home
                              : (Runnable) (() -> { wizStep[0] = step - 1; render[0].run(); });

                      if (step == 0) {
                          wizardPage("Hangi gün?", "Görevin başlayacağı tarihi seç.", step, totalSteps, onBack);

                          Button dateButton = choice("Tarih  •  " + selectedStartDate);
                          root.addView(dateButton);
                          dateButton.setOnClickListener(v -> chooseDate(dateButton, true));

                          root.addView(new View(this), new LinearLayout.LayoutParams(-1, 0, 1f));

                          TextView specialLink = text("★  Bunun yerine izin / özel durum gir", 14, GOLD_NEON, true);
                          specialLink.setPadding(dp(4), dp(10), dp(4), dp(16));
                          root.addView(specialLink);
                          specialLink.setOnClickListener(v -> showSpecialCaseDialog());

                          Button next = action("İleri", true);
                          root.addView(next);
                          next.setOnClickListener(v -> { wizStep[0] = 1; render[0].run(); });

                      } else if (step == 1) {
                          wizardPage("Kiminle gittin?", "Hazır isimlerden seç ya da elle yaz.", step, totalSteps, onBack);

                          TextInputLayout personField = field("Kiminle gittin?");
                          if (personField.getEditText() != null) personField.getEditText().setText(wizPerson[0]);
                          root.addView(personField);

                          if (useOwnerList() && !ownerList().isEmpty()) {
                              TextView label = text("HAZIR İSİMLER", 11, TEXT_MUTED, true);
                              label.setPadding(0, dp(16), 0, dp(8));
                              root.addView(label);
                              root.addView(chipRow(ownerList().toArray(new String[0]), wizPerson[0], picked -> {
                                  wizPerson[0] = picked;
                                  wizStep[0] = 2;
                                  render[0].run();
                              }));
                          }

                          root.addView(new View(this), new LinearLayout.LayoutParams(-1, 0, 1f));

                          Button next = action("İleri", true);
                          root.addView(next);
                          next.setOnClickListener(v -> {
                              String v2 = value(personField);
                              if (v2.isEmpty()) {
                                  Toast.makeText(this, "Kiminle gittiğini gir veya seç.", Toast.LENGTH_SHORT).show();
                                  return;
                              }
                              wizPerson[0] = v2;
                              wizStep[0] = 2;
                              render[0].run();
                          });

                      } else if (step == 2) {
                          wizardPage("Tren no?", "Hazır trenlerden seç ya da elle yaz.", step, totalSteps, onBack);

                          TextInputLayout trainField = field("Tren no");
                          if (trainField.getEditText() != null) trainField.getEditText().setText(wizTrain[0]);
                          root.addView(trainField);

                          TextView outLabel = text("GİDİŞ", 11, TEXT_MUTED, true);
                          outLabel.setPadding(0, dp(14), 0, dp(8));
                          root.addView(outLabel);
                          String[] outboundTrains = {"23201", "23202", "23205", "23207"};
                          root.addView(chipRow(outboundTrains, wizTrain[0], picked -> {
                              wizTrain[0] = picked;
                              wizStep[0] = 3;
                              render[0].run();
                          }));

                          TextView retLabel = text("DÖNÜŞ", 11, TEXT_MUTED, true);
                          retLabel.setPadding(0, dp(14), 0, dp(8));
                          root.addView(retLabel);
                          String[] returnTrains = {"13102", "13104", "13106", "13108", "53503"};
                          root.addView(chipRow(returnTrains, wizTrain[0], picked -> {
                              wizTrain[0] = picked;
                              wizStep[0] = 3;
                              render[0].run();
                          }));

                          root.addView(new View(this), new LinearLayout.LayoutParams(-1, 0, 1f));

                          Button next = action("İleri", true);
                          root.addView(next);
                          next.setOnClickListener(v -> {
                              String v2 = value(trainField);
                              if (v2.isEmpty()) {
                                  Toast.makeText(this, "Tren no gir veya seç.", Toast.LENGTH_SHORT).show();
                                  return;
                              }
                              wizTrain[0] = v2;
                              wizStep[0] = 3;
                              render[0].run();
                          });

                      } else if (step == 3) {
                          wizardPage("Teslim / tesellüm sahibi kim?", null, step, totalSteps, onBack);

                          OwnerPicker ownerPicker = new OwnerPicker(root, "Teslim / tesellüm sahibi");
                          ownerPicker.setValue(wizOwner[0]);

                          root.addView(new View(this), new LinearLayout.LayoutParams(-1, 0, 1f));

                          Button next = action("İleri", true);
                          root.addView(next);
                          next.setOnClickListener(v -> {
                              String v2 = ownerPicker.value();
                              if (v2.isEmpty()) {
                                  Toast.makeText(this, "Teslim / tesellüm sahibini seç veya gir.", Toast.LENGTH_SHORT).show();
                                  return;
                              }
                              wizOwner[0] = v2;
                              wizStep[0] = 4;
                              render[0].run();
                          });

                      } else {
                          wizardPage("Başlangıç saati?", "Görev alış saatini seç ve kaydet.", step, totalSteps, onBack);

                          Button startButton = choice("Saat seç  •  " + (selectedStart.isEmpty() ? "Henüz seçilmedi" : selectedStart));
                          root.addView(startButton);
                          startButton.setOnClickListener(v -> chooseTime(startButton, true));

                          root.addView(new View(this), new LinearLayout.LayoutParams(-1, 0, 1f));

                          Button save = actionSuccess("✓  Görevi Başlat ve Kaydet");
                          root.addView(save);
                          save.setOnClickListener(v -> {
                              if (selectedStart.isEmpty()) {
                                  Toast.makeText(this, "Başlangıç saatini seç.", Toast.LENGTH_SHORT).show();
                                  return;
                              }
                              String chainId = UUID.randomUUID().toString();
                              String record = chainId + "|" + selectedStartDate + "|" +
                                      wizPerson[0] + "|" + wizTrain[0] + "|" + selectedStart + "|" +
                                      wizOwner[0] + "|OPEN";
                              records.add(record);
                              rememberOwner(wizOwner[0]);
                              persist();
                              Toast.makeText(this, "Kayıt oluşturuldu. Uygulamayı kapatabilirsin.", Toast.LENGTH_SHORT).show();
                              home();
                          });
                      }
                  };

                  render[0].run();
              }

              // "Yeni Görev" akışının ilk adımından ulaşılan, tren almayan
              // özel gün / izin / destek iptali kısayolu. Seçilince tek satırlık
              // kaydı doğrudan oluşturup ana sayfaya döner.
              void showSpecialCaseDialog() {
                  String[] options = {"Hafta Tatili", "Boş Gün", "Yıllık İzin", "Tren İptali", "İptal Destek 1", "İptal Destek 2", "İptal Destek 3"};
                  new AlertDialog.Builder(this)
                      .setTitle("Durum veya Görev Seç")
                      .setItems(options, (dialog, which) -> {
                          String sel = options[which];
                          if (sel.equals("Tren İptali")) {
                              String[] allTrains = {
                                  "23201", "23202", "23205", "23207",
                                  "13102", "13104", "13106", "13108", "53503"
                              };

                              LinearLayout cancelBox = new LinearLayout(this);
                              cancelBox.setOrientation(LinearLayout.VERTICAL);
                              cancelBox.setPadding(dp(16), dp(8), dp(16), 0);

                              TextInputLayout manualInput = field("Veya manuel tren no gir");
                              Button trainListBtn = choice("Ortak Trenden Seç");
                              cancelBox.addView(trainListBtn);
                              cancelBox.addView(manualInput);

                              final String[] chosenCancelTrain = {""};

                              trainListBtn.setOnClickListener(tb -> {
                                  new AlertDialog.Builder(this)
                                      .setTitle("İptal Edilecek Treni Seç")
                                      .setItems(allTrains, (d3, w3) -> {
                                          chosenCancelTrain[0] = allTrains[w3];
                                          trainListBtn.setText("Seçilen Tren: " + chosenCancelTrain[0]);
                                          if (manualInput.getEditText() != null) {
                                              manualInput.getEditText().setText(chosenCancelTrain[0]);
                                          }
                                      })
                                      .setNegativeButton("İptal", null)
                                      .show();
                              });

                              new AlertDialog.Builder(this)
                                  .setTitle("Tren İptali")
                                  .setView(cancelBox)
                                  .setPositiveButton("Ekle", (d2, w2) -> {
                                      String tNo = value(manualInput);
                                      if (!tNo.isEmpty()) {
                                          saveSpecialRecord("İptal: " + tNo);
                                      }
                                  })
                                  .setNegativeButton("Vazgeç", null)
                                  .show();
                          } else {
                              saveSpecialRecord(sel);
                          }
                      }).show();
              }

              void saveSpecialRecord(String label) {
                  if (label == null || label.trim().isEmpty()) return;
                  String chainId = UUID.randomUUID().toString();
                  String record = chainId + "|" + selectedStartDate + "|" +
                          "-" + "|" + label + "|" +
                          "00:00" + "|" + "-" + "|DONE|" + selectedStartDate + "|" +
                          "00:00" + "|" + "-" + "|" + selectedStartDate + " 00:00";
                  records.add(record);
                  persist();
                  Toast.makeText(this, "Özel durum kaydedildi.", Toast.LENGTH_SHORT).show();
                  home();
              }
          
              void chooseDate(Button target, boolean start) {
                  Calendar c = Calendar.getInstance();
                  String base = start ? selectedStartDate : selectedFinishDate;
                  if (base != null && !base.isEmpty()) {
                      try {
                          Date d = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault()).parse(base);
                          if (d != null) c.setTime(d);
                      } catch (Exception ignored) {}
                  }
          
                  DatePickerDialog d = new DatePickerDialog(this,
                      (view, year, month, day) -> {
                          String v = String.format(Locale.getDefault(), "%02d.%02d.%04d", day, month + 1, year);
                          if (start) {
                              selectedStartDate = v;
                              target.setText("Tarih  •  " + v);
                          } else {
                              selectedFinishDate = v;
                              target.setText("Görev bitiş tarihi  •  " + v);
                          }
                      }, c.get(Calendar.YEAR), c.get(Calendar.MONTH), c.get(Calendar.DAY_OF_MONTH));
                  d.show();
              }
          
              void chooseTime(Button target, boolean start) {
                  Calendar c = Calendar.getInstance();
                  TimePickerDialog d = new TimePickerDialog(this,
                      (view, hour, minute) -> {
                          String v = String.format(Locale.getDefault(), "%02d:%02d", hour, minute);
                          if (start) {
                              selectedStart = v;
                              target.setText("Saat seçildi  •  " + v);
                          } else {
                              selectedFinish = v;
                              target.setText("Görev bitiş / teslim  •  " + v);
                          }
                      }, c.get(Calendar.HOUR_OF_DAY), c.get(Calendar.MINUTE), true);
                  d.show();
              }
          
              boolean finishBeforeStart(String startDate, String startTime, String finishDate, String finishTime) {
                  try {
                      SimpleDateFormat f = new SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault());
                      f.setLenient(false);
                      Date start = f.parse(startDate + " " + startTime);
                      Date finish = f.parse(finishDate + " " + finishTime);
                      return start != null && finish != null && finish.before(start);
                  } catch (Exception e) {
                      return true;
                  }
              }

              void showTimeOrderWarning() {
                  new AlertDialog.Builder(this)
                          .setTitle("Saat bilgisi hatalı")
                          .setMessage("Görev bitiş / varış saati, görev başlangıç saatinden önce olamaz. Lütfen tarihi ve saati kontrol et.")
                          .setPositiveButton("Tamam", null)
                          .show();
              }

              void editCompletedRecord(String raw) {
                  String[] a = raw.split("\\|", -1);
                  if (a.length < 11 ||
                          !("DONE".equals(a[6]) || "HOTEL".equals(a[6]) || "HOTEL_DONE".equals(a[6]))) {
                      Toast.makeText(this, "Bu kayıt için düzenleme desteklenmiyor.", Toast.LENGTH_LONG).show();
                      return;
                  }

                  boolean isDoneRecord = "DONE".equals(a[6]);
                  int existingHotelNights = 0;
                  if (isDoneRecord && a.length >= 12) {
                      try { existingHotelNights = Integer.parseInt(a[11].trim()); } catch (Exception ignored) {}
                  }
                  final int[] editHotelNights = {existingHotelNights};

                  final TextInputLayout person = field("Kiminle");
                  final TextInputLayout train = field("Tren no");
                  final TextInputLayout startOwner = field("Başlangıç teslim / tesellüm sahibi");
                  final TextInputLayout finishOwner = field("Bitiş teslim / tesellüm sahibi");
                  if (person.getEditText() != null) person.getEditText().setText(a[2]);
                  if (train.getEditText() != null) train.getEditText().setText(a[3]);
                  if (startOwner.getEditText() != null) startOwner.getEditText().setText(a[5]);
                  if (finishOwner.getEditText() != null) finishOwner.getEditText().setText(a[9]);

                  final String[] editStartDate = {a[1]};
                  final String[] editStartTime = {a[4]};
                  final String[] editFinishDate = {a[7]};
                  final String[] editFinishTime = {a[8]};

                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  int pad = dp(18);
                  box.setPadding(pad, dp(6), pad, 0);
                  box.addView(person);
                  box.addView(train);

                  Button startDate = choice("Başlangıç tarihi  •  " + editStartDate[0]);
                  Button startTime = choice("Başlangıç saati  •  " + editStartTime[0]);
                  Button finishDate = choice("Bitiş tarihi  •  " + editFinishDate[0]);
                  Button finishTime = choice("Bitiş saati  •  " + editFinishTime[0]);
                  box.addView(startDate);
                  box.addView(startTime);
                  box.addView(startOwner);
                  box.addView(finishDate);
                  box.addView(finishTime);
                  box.addView(finishOwner);

                  Button hotelNightsEditButton = null;
                  if (isDoneRecord) {
                      hotelNightsEditButton = choice("Otelde konaklanan gece sayısı  •  " + existingHotelNights + " gece");
                      box.addView(hotelNightsEditButton);
                  }
                  final Button finalHotelNightsEditButton = hotelNightsEditButton;
                  if (finalHotelNightsEditButton != null) {
                      finalHotelNightsEditButton.setOnClickListener(v -> {
                          int max = Math.max(getHotelNightsMax(), editHotelNights[0]);
                          String[] items = new String[max + 1];
                          for (int i = 0; i <= max; i++) items[i] = i + " gece";
                          new AlertDialog.Builder(this)
                                  .setTitle("Otelde konaklanan gece sayısı")
                                  .setSingleChoiceItems(items, editHotelNights[0], (d, which) -> {
                                      editHotelNights[0] = which;
                                      finalHotelNightsEditButton.setText("Otelde konaklanan gece sayısı  •  " + which + " gece");
                                      d.dismiss();
                                  })
                                  .setNegativeButton("İptal", null)
                                  .show();
                      });
                  }

                  startDate.setOnClickListener(v -> {
                      Calendar c = Calendar.getInstance();
                      try {
                          Date d = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault()).parse(editStartDate[0]);
                          if (d != null) c.setTime(d);
                      } catch (Exception ignored) {}
                      new DatePickerDialog(this, (view, year, month, day) -> {
                          editStartDate[0] = String.format(Locale.getDefault(), "%02d.%02d.%04d", day, month + 1, year);
                          startDate.setText("Başlangıç tarihi  •  " + editStartDate[0]);
                      }, c.get(Calendar.YEAR), c.get(Calendar.MONTH), c.get(Calendar.DAY_OF_MONTH)).show();
                  });
                  startTime.setOnClickListener(v -> {
                      Calendar c = Calendar.getInstance();
                      try {
                          String[] hm = editStartTime[0].split(":");
                          c.set(Calendar.HOUR_OF_DAY, Integer.parseInt(hm[0]));
                          c.set(Calendar.MINUTE, Integer.parseInt(hm[1]));
                      } catch (Exception ignored) {}
                      new TimePickerDialog(this, (view, hour, minute) -> {
                          editStartTime[0] = String.format(Locale.getDefault(), "%02d:%02d", hour, minute);
                          startTime.setText("Başlangıç saati  •  " + editStartTime[0]);
                      }, c.get(Calendar.HOUR_OF_DAY), c.get(Calendar.MINUTE), true).show();
                  });
                  finishDate.setOnClickListener(v -> {
                      Calendar c = Calendar.getInstance();
                      try {
                          Date d = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault()).parse(editFinishDate[0]);
                          if (d != null) c.setTime(d);
                      } catch (Exception ignored) {}
                      new DatePickerDialog(this, (view, year, month, day) -> {
                          editFinishDate[0] = String.format(Locale.getDefault(), "%02d.%02d.%04d", day, month + 1, year);
                          finishDate.setText("Bitiş tarihi  •  " + editFinishDate[0]);
                      }, c.get(Calendar.YEAR), c.get(Calendar.MONTH), c.get(Calendar.DAY_OF_MONTH)).show();
                  });
                  finishTime.setOnClickListener(v -> {
                      Calendar c = Calendar.getInstance();
                      try {
                          String[] hm = editFinishTime[0].split(":");
                          c.set(Calendar.HOUR_OF_DAY, Integer.parseInt(hm[0]));
                          c.set(Calendar.MINUTE, Integer.parseInt(hm[1]));
                      } catch (Exception ignored) {}
                      new TimePickerDialog(this, (view, hour, minute) -> {
                          editFinishTime[0] = String.format(Locale.getDefault(), "%02d:%02d", hour, minute);
                          finishTime.setText("Bitiş saati  •  " + editFinishTime[0]);
                      }, c.get(Calendar.HOUR_OF_DAY), c.get(Calendar.MINUTE), true).show();
                  });

                  AlertDialog dialog = new AlertDialog.Builder(this)
                          .setTitle("DONE".equals(a[6]) ? "Tamamlanmış Kaydı Düzenle" : "Görev Başlangıç Kaydını Düzenle")
                          .setView(box)
                          .setNegativeButton("Vazgeç", null)
                          .setPositiveButton("Kaydet", null)
                          .create();
                  dialog.setOnShowListener(v -> {
                      Button saveButton = dialog.getButton(AlertDialog.BUTTON_POSITIVE);
                      saveButton.setOnClickListener(x -> {
                          String pName = value(person);
                          String tNo = value(train);
                          String sOwner = value(startOwner);
                          String fOwner = value(finishOwner);
                          if (pName.isEmpty() || tNo.isEmpty() || sOwner.isEmpty() || fOwner.isEmpty()) {
                              Toast.makeText(this, "Tüm kişi, tren ve teslim/tesellüm alanları doldurulmalı.", Toast.LENGTH_LONG).show();
                              return;
                          }
                          if (finishBeforeStart(editStartDate[0], editStartTime[0], editFinishDate[0], editFinishTime[0])) {
                              showTimeOrderWarning();
                              return;
                          }
                          String arrival = addThirtyMinutes(editFinishDate[0], editFinishTime[0]);
                          String updated = a[0] + "|" + editStartDate[0] + "|" + pName + "|" + tNo + "|" +
                                  editStartTime[0] + "|" + sOwner + "|" + a[6] + "|" + editFinishDate[0] + "|" +
                                  editFinishTime[0] + "|" + fOwner + "|" + arrival;
                          if (isDoneRecord) updated += "|" + editHotelNights[0];
                          int index = records.indexOf(raw);
                          if (index >= 0) {
                              records.set(index, updated);
                              persist();
                              dialog.dismiss();
                              Toast.makeText(this, "Kayıt güncellendi.", Toast.LENGTH_SHORT).show();
                              monthly();
                          }
                      });
                  });
                  dialog.show();
              }

              void ongoing() {
                  currentPage = "ongoing";
                  page("Devam Eden", "Tamamlanmamış veya otelde devam eden görevler.");

                  boolean found = false;
                  for (String r : new ArrayList<>(records)) {
                      String[] a = r.split("\\|", -1);
                      if (a.length < 7) continue;

                      String status = a[6];
                      if (!status.equals("OPEN") && !status.equals("HOTEL")) continue;

                      found = true;
                      LinearLayout c = card(CARD_BG, status.equals("HOTEL") ? NEON_PURPLE_SOFT : AMBER_NEON);
                      c.addView(text(formatTrainName(a[3]), 18, Color.rgb(244,241,252), true));
                      c.addView(text(a[1] + "  •  " + a[2], 14, Color.rgb(158,148,190), false));
                      c.addView(text("Başlangıç  " + a[4] + "  •  Tesellüm: " + a[5],
                              14, Color.rgb(198,190,226), false));

                      if (status.equals("HOTEL") && a.length >= 11) {
                          String hotelOwner = a.length > 9 ? a[9] : "";
                          String hotelDelivery = "Otel / devam  •  Teslim: " + a[7] + " " + a[8];
                          if (!hotelOwner.isEmpty()) hotelDelivery += "  •  Tesellüm: " + hotelOwner;
                          c.addView(text(hotelDelivery,
                                  14, Color.rgb(198,190,226), false));
                          c.addView(text("Otele varış +30 dk  •  " + a[10],
                                  13, Color.rgb(158,148,190), false));
                          Button b = action("Treni devam ettir  →", true);
                          c.addView(b);
                          root.addView(c);
                          b.setOnClickListener(v -> continueFromHotel(r));
                      } else {
                          Button b = action("Görevi tamamla / otele geç  →", true);
                          c.addView(b);
                          root.addView(c);
                          b.setOnClickListener(v -> complete(r));
                      }
                  }

                  if (!found) {
                      LinearLayout empty = card();
                      empty.addView(text("Aktif görev yok", 18, Color.rgb(244,241,252), true));
                      empty.addView(text("Yeni bir görev başlattığında burada görünecek.", 14, Color.rgb(158,148,190), false));
                      root.addView(empty);
                  }

                  Button back = action("Ana Sayfa", false);
                  root.addView(back);
                  back.setOnClickListener(v -> home());
              }

              // Görev kapatma / tamamlama ekranlarının hepsinde üstte görünen,
              // "hangi görevi kapatıyorsun" hatırlatıcı tek satır.
              void addTaskSummaryLine(String[] a) {
                  TextView line = text(formatTrainName(a[3]) + "  •  " + a[2], 14, TEXT_MUTED, true);
                  line.setPadding(0, 0, 0, dp(18));
                  root.addView(line);
              }

              void complete(String r) {
                  currentPage = "complete";
                  String[] a = r.split("\\|", -1);

                  selectedFinish = "";
                  selectedFinishDate = a[1];

                  final String[] wizFinishOwner = {""};
                  final int[] hotelNightsChoice = {0};
                  final int[] wizStep = {0};
                  final int totalSteps = 3;
                  final Runnable[] render = new Runnable[1];

                  render[0] = () -> {
                      int step = wizStep[0];
                      Runnable onBack = (step == 0)
                              ? (Runnable) this::ongoing
                              : (Runnable) (() -> { wizStep[0] = step - 1; render[0].run(); });

                      if (step == 0) {
                          wizardPage("Görev ne zaman bitti?", null, step, totalSteps, onBack);
                          addTaskSummaryLine(a);

                          Button finishDate = choice("Görev bitiş tarihi  •  " + selectedFinishDate);
                          root.addView(finishDate);
                          finishDate.setOnClickListener(v -> chooseDate(finishDate, false));

                          Button finishButton = choice("Bitiş saati seç  •  " + (selectedFinish.isEmpty() ? "Henüz seçilmedi" : selectedFinish));
                          root.addView(finishButton);
                          finishButton.setOnClickListener(v -> chooseTime(finishButton, false));

                          root.addView(new View(this), new LinearLayout.LayoutParams(-1, 0, 1f));

                          Button next = action("İleri", true);
                          root.addView(next);
                          next.setOnClickListener(v -> {
                              if (selectedFinish.isEmpty()) {
                                  Toast.makeText(this, "Görev bitiş saatini seç.", Toast.LENGTH_SHORT).show();
                                  return;
                              }
                              if (finishBeforeStart(a[1], a[4], selectedFinishDate, selectedFinish)) {
                                  showTimeOrderWarning();
                                  return;
                              }
                              wizStep[0] = 1;
                              render[0].run();
                          });

                      } else if (step == 1) {
                          wizardPage("Teslim / tesellüm sahibi kim?", null, step, totalSteps, onBack);
                          addTaskSummaryLine(a);

                          OwnerPicker ownerPicker = new OwnerPicker(root, "Teslim / tesellüm sahibi", true);
                          ownerPicker.setValue(wizFinishOwner[0]);

                          root.addView(new View(this), new LinearLayout.LayoutParams(-1, 0, 1f));

                          Button next = action("İleri", true);
                          root.addView(next);
                          next.setOnClickListener(v -> {
                              String v2 = ownerPicker.value();
                              if (v2.isEmpty()) {
                                  Toast.makeText(this, "Teslim / tesellüm sahibini seç veya manuel gir.", Toast.LENGTH_SHORT).show();
                                  return;
                              }
                              wizFinishOwner[0] = v2;
                              wizStep[0] = 2;
                              render[0].run();
                          });

                      } else {
                          wizardPage("Konaklama var mıydı?", "Sadece görev burada gerçekten bitiyorsa gir.", step, totalSteps, onBack);
                          addTaskSummaryLine(a);

                          Button hotelNightsButton = choice("Otelde konaklanan gece sayısı  •  " + hotelNightsChoice[0] + " gece");
                          root.addView(hotelNightsButton);
                          hotelNightsButton.setOnClickListener(v -> {
                              int max = getHotelNightsMax();
                              String[] items = new String[max + 1];
                              for (int i = 0; i <= max; i++) items[i] = i + " gece";
                              new AlertDialog.Builder(this)
                                      .setTitle("Otelde konaklanan gece sayısı")
                                      .setSingleChoiceItems(items, hotelNightsChoice[0], (d, which) -> {
                                          hotelNightsChoice[0] = which;
                                          hotelNightsButton.setText("Otelde konaklanan gece sayısı  •  " + which + " gece");
                                          d.dismiss();
                                      })
                                      .setNegativeButton("İptal", null)
                                      .show();
                          });

                          LinearLayout auto = card(CARD_BG_ALT2, BORDER_MUTED);
                          auto.addView(text("EVE DÖNÜŞ", 11, NEON_PURPLE_SOFT, true));
                          auto.addView(text("Görev bitişi + 30 dakika = eve giriş", 15, TEXT_SECONDARY, true));
                          auto.addView(text("Bu 30 dakika fiili çalışmaya dahildir.", 13, TEXT_MUTED, false));
                          root.addView(auto);

                          root.addView(new View(this), new LinearLayout.LayoutParams(-1, 0, 1f));

                          Button hotel = action("🏨  Otele Geç / Treni Devam Ettir", false);
                          root.addView(hotel);
                          hotel.setOnClickListener(v -> {
                              String hotelArrival = addThirtyMinutes(selectedFinishDate, selectedFinish);
                              String newRecord = r.replace("|OPEN", "|HOTEL|" + selectedFinishDate + "|" +
                                      selectedFinish + "|" + wizFinishOwner[0] + "|" + hotelArrival);
                              records.set(records.indexOf(r), newRecord);
                              rememberOwner(wizFinishOwner[0]);
                              persist();
                              Toast.makeText(this, "Otel konaklaması kaydedildi • Otele varış " + hotelArrival,
                                      Toast.LENGTH_LONG).show();
                              home();
                          });

                          Button save = actionSuccess("✓  Görevi Tamamla ve Eve Dön");
                          root.addView(save);
                          save.setOnClickListener(v -> {
                              String arrival = addThirtyMinutes(selectedFinishDate, selectedFinish);
                              String newRecord = r.replace("|OPEN", "|DONE|" + selectedFinishDate + "|" +
                                      selectedFinish + "|" + wizFinishOwner[0] + "|" + arrival) +
                                      "|" + hotelNightsChoice[0];
                              records.set(records.indexOf(r), newRecord);
                              rememberOwner(wizFinishOwner[0]);
                              persist();
                              Toast.makeText(this, "Görev tamamlandı • Eve giriş " + arrival, Toast.LENGTH_LONG).show();
                              home();
                          });
                      }
                  };

                  render[0].run();
              }

