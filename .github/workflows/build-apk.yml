              void chooseTrain(TextInputLayout target, String[] trains, String titleText) {
                  String current = value(target);
                  int checked = -1;
                  for (int i = 0; i < trains.length; i++) {
                      if (trains[i].equals(current)) {
                          checked = i;
                          break;
                      }
                  }

                  AlertDialog dialog = new AlertDialog.Builder(this)
                          .setTitle(titleText)
                          .setSingleChoiceItems(trains, checked, (d, which) -> {
                              EditText e = target.getEditText();
                              if (e != null) e.setText(trains[which]);
                              d.dismiss();
                          })
                          .setNegativeButton("İptal", null)
                          .create();
                  dialog.show();
              }

              int compareDates(String first, String second) {
                  try {
                      SimpleDateFormat f = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault());
                      f.setLenient(false);
                      Date a = f.parse(first);
                      Date b = f.parse(second);
                      if (a == null || b == null) return first.compareTo(second);
                      return a.compareTo(b);
                  } catch (Exception ignored) {
                      return first.compareTo(second);
                  }
              }

              String addThirtyMinutes(String date, String time) {
                  try {
                      SimpleDateFormat f = new SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault());
                      Date d = f.parse(date + " " + time);
                      if (d != null) {
                          d = new Date(d.getTime() + 30L * 60L * 1000L);
                          return new SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault()).format(d);
                      }
                  } catch (Exception ignored) {}
                  return date + " " + time;
              }

              String addDays(String date, int days) {
                  try {
                      SimpleDateFormat f = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault());
                      Date d = f.parse(date);
                      if (d != null) {
                          Calendar c = Calendar.getInstance();
                          c.setTime(d);
                          c.add(Calendar.DAY_OF_MONTH, days);
                          return f.format(c.getTime());
                      }
                  } catch (Exception ignored) {}
                  return date;
              }

              void addHotelDays(LinearLayout target, String chainId, String fromDate, String toDate) {
                  try {
                      SimpleDateFormat f = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault());
                      Calendar c = Calendar.getInstance();
                      Date from = f.parse(fromDate);
                      Date to = f.parse(toDate);
                      if (from == null || to == null) return;
                      c.setTime(from);
                      c.add(Calendar.DAY_OF_MONTH, 1);

                      while (c.getTime().before(to)) {
                          String d = f.format(c.getTime());
                          LinearLayout hotel = card();
                          hotel.addView(text(d + "  •  OTEL / BEKLEME", 15,
                                  Color.rgb(230,220,238), true));
                          hotel.addView(text("Aynı tren görevi devam ediyor.", 13,
                                  Color.rgb(175,168,185), false));
                          target.addView(hotel);
                          c.add(Calendar.DAY_OF_MONTH, 1);
                      }
                  } catch (Exception ignored) {}
              }
               
              void monthly() {
                  currentPage = "monthly";
                  page("Aylık Kayıtlar", "Yıl ve ay seçerek kayıtlarını düzenli şekilde görüntüle.");

                  if (records.isEmpty()) {
                      LinearLayout empty = card();
                      empty.addView(text("Henüz kayıt yok.", 18, Color.rgb(240,236,246), true));
                      root.addView(empty);

                      Button back = action("Ana Sayfa", false);
                      root.addView(back);
                      back.setOnClickListener(v -> home());
                      return;
                  }

                  // Aynı servis zincirine ait tüm segmentleri chainId üzerinden tek kartta topluyoruz.
                  LinkedHashMap<String, ArrayList<String>> chains = new LinkedHashMap<>();
                  for (String r : records) {
                      String[] a = r.split("\\|", -1);
                      if (a.length < 7) continue;

                      String chainId = a[0];
                      ArrayList<String> list = chains.get(chainId);
                      if (list == null) {
                          list = new ArrayList<>();
                          chains.put(chainId, list);
                      }
                      list.add(r);
                  }

                  ArrayList<ArrayList<String>> sortedChains = new ArrayList<>(chains.values());

                  Collections.sort(sortedChains, (x, y) -> {
                      String[] a = x.get(0).split("\\|", -1);
                      String[] b = y.get(0).split("\\|", -1);

                      int dateCompare = compareDates(a[1], b[1]);
                      if (dateCompare != 0) return dateCompare;

                      return a[4].compareTo(b[4]);
                  });

                  // Yıl seçimi 2025-2100 arasında sabit tutulur.
                  // Yeni bir yıl için önceden kayıt bulunması gerekmez.
                  TreeSet<Integer> yearSet = new TreeSet<>();
                  for (int y = 2025; y <= 2100; y++) {
                      yearSet.add(y);
                  }

                  if (yearSet.isEmpty()) {
                      LinearLayout empty = card();
                      empty.addView(text("Tarih bilgisi okunamadı.", 18, Color.rgb(240,236,246), true));
                      root.addView(empty);
                  } else {
                      Integer[] years = yearSet.toArray(new Integer[0]);
                      String[] yearLabels = new String[years.length];
                      for (int i = 0; i < years.length; i++) {
                          yearLabels[i] = String.valueOf(years[i]);
                      }

                      String[] monthLabels = new String[]{
                              "Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran",
                              "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"
                      };

                      // Varsayılan olarak en son kayıtlı yıl ve ay seçilir.
                      int defaultYearIndex = years.length - 1;
                      int defaultMonthIndex = 0;
                      int latestYear = years[defaultYearIndex];
                      Date latestDate = null;
                      SimpleDateFormat filterDate = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault());
                      filterDate.setLenient(false);

                      for (ArrayList<String> chain : sortedChains) {
                          for (String r : chain) {
                              String[] a = r.split("\\|", -1);
                              if (a.length < 2) continue;
                              try {
                                  Date d = filterDate.parse(a[1]);
                                  if (d != null && (latestDate == null || d.after(latestDate))) {
                                      latestDate = d;
                                  }
                              } catch (Exception ignored) {}
                          }
                      }

                      if (latestDate != null) {
                          Calendar latestCal = Calendar.getInstance();
                          latestCal.setTime(latestDate);
                          latestYear = latestCal.get(Calendar.YEAR);
                          defaultMonthIndex = latestCal.get(Calendar.MONTH);
                          for (int i = 0; i < years.length; i++) {
                              if (years[i] == latestYear) {
                                  defaultYearIndex = i;
                                  break;
                              }
                          }
                      }

                      LinearLayout filterCard = card();
                      filterCard.setBackground(bg(Color.rgb(40,32,55), 22));
                      filterCard.addView(section("Kayıt dönemi"));

                      TextView yearLabel = text("YIL", 11, Color.rgb(183,161,220), true);
                      yearLabel.setPadding(dp(2), 0, 0, dp(4));
                      filterCard.addView(yearLabel);

                      Spinner yearSpinner = new Spinner(this);
                      ArrayAdapter<String> yearAdapter = new ArrayAdapter<String>(
                              this,
                              android.R.layout.simple_spinner_dropdown_item,
                              yearLabels
                      );
                      yearSpinner.setAdapter(yearAdapter);
                      yearSpinner.setSelection(defaultYearIndex);
                      filterCard.addView(yearSpinner, new LinearLayout.LayoutParams(-1, dp(54)));

                      TextView monthLabel = text("AY", 11, Color.rgb(183,161,220), true);
                      monthLabel.setPadding(dp(2), dp(10), 0, dp(4));
                      filterCard.addView(monthLabel);

                      Spinner monthSpinner = new Spinner(this);
                      ArrayAdapter<String> monthAdapter = new ArrayAdapter<String>(
                              this,
                              android.R.layout.simple_spinner_dropdown_item,
                              monthLabels
                      );
                      monthSpinner.setAdapter(monthAdapter);
                      monthSpinner.setSelection(defaultMonthIndex);
                      filterCard.addView(monthSpinner, new LinearLayout.LayoutParams(-1, dp(54)));

                      root.addView(filterCard);

                      LinearLayout resultContainer = new LinearLayout(this);
                      resultContainer.setOrientation(LinearLayout.VERTICAL);
                      root.addView(resultContainer);

                      Runnable render = () -> {
                          resultContainer.removeAllViews();

                          int selectedYear = years[Math.max(0, yearSpinner.getSelectedItemPosition())];
                          int selectedMonth = Math.max(0, monthSpinner.getSelectedItemPosition());

                          int visibleChains = 0;

                          for (ArrayList<String> chain : sortedChains) {
                              // Zincirin seçilen ay/yılda en az bir çalışma veya otel segmenti
                              // içermesi halinde bu ay altında gösterilir.
                              boolean belongsToMonth = false;
                              for (String r : chain) {
                                  String[] a = r.split("\\|", -1);
                                  if (a.length < 2) continue;
                                  try {
                                      String dateForFilter = ("HOTEL".equals(a.length > 6 ? a[6] : "") ||
                                              "HOTEL_DONE".equals(a.length > 6 ? a[6] : ""))
                                              && a.length >= 8 ? a[7] : a[1];
                                      Date d = filterDate.parse(dateForFilter);
                                      if (d != null) {
                                          Calendar cal = Calendar.getInstance();
                                          cal.setTime(d);
                                          if (cal.get(Calendar.YEAR) == selectedYear &&
                                                  cal.get(Calendar.MONTH) == selectedMonth) {
                                              belongsToMonth = true;
                                              break;
                                          }
                                      }
                                  } catch (Exception ignored) {}
                              }

                              if (!belongsToMonth) continue;
                              visibleChains++;

                              Collections.sort(chain, (x, y) -> {
                                  String[] a = x.split("\\|", -1);
                                  String[] b = y.split("\\|", -1);

                                  int dateCompare = compareDates(a[1], b[1]);
                                  if (dateCompare != 0) return dateCompare;

                                  return a[4].compareTo(b[4]);
                              });

                              String startDate = "";
                              String endDate = "";
                              boolean completed = false;
                              String firstRecord = "";

                              // Servis zincirinin başlangıcı, zincirdeki en erken tarihli
                              // kayıttır. İlk kayıt otele dönüşe çevrilmiş olsa bile a[1] ve
                              // a[2..5] başlangıçta girilen gerçek görev bilgilerini korur.
                              for (String segment : chain) {
                                  String[] a = segment.split("\\|", -1);
                                  if (a.length < 2) continue;
                                  if (firstRecord.isEmpty() || compareDates(a[1], firstRecord.split("\\|", -1)[1]) < 0) {
                                      firstRecord = segment;
                                  }
                              }
                              if (!firstRecord.isEmpty()) {
                                  String[] first = firstRecord.split("\\|", -1);
                                  startDate = first[1];
                              }

                              // Bitiş tarihi yalnızca gerçek görev segmentlerinden alınır.
                              for (String segment : chain) {
                                  String[] a = segment.split("\\|", -1);
                                  if (a.length < 7) continue;
                                  String status = a[6];
                                  if ("HOTEL".equals(status) || "HOTEL_DONE".equals(status)) continue;

                                  if (endDate.isEmpty() || compareDates(a[1], endDate) > 0) {
                                      endDate = a[1];
                                  }
                                  if ("DONE".equals(status)) completed = true;
                              }

                              if (endDate.isEmpty()) endDate = startDate;

                              LinearLayout chainCard = card();

                              String chainTitle;
                              if (startDate.equals(endDate)) {
                                  chainTitle = startDate + "  •  SERVİS";
                              } else {
                                  chainTitle = startDate + "  →  " + endDate + "  •  SERVİS";
                              }
                              TextView serviceTitle = text(chainTitle, 18,
                                      Color.rgb(245,243,250), true);
                              final String deleteChainId = chain.get(0).split("\\|", -1)[0];

                              // Sadece servis başlığına uzun basınca bütün servis zincirini
                              // silme onayı açılır. Kartın diğer bölümleri bu işlemi tetiklemez.
                              serviceTitle.setOnLongClickListener(v -> {
                                  new AlertDialog.Builder(this)
                                          .setTitle("Kaydı sil")
                                          .setMessage("Gerçekten bu servisin tamamını silmek istiyor musun?")
                                          .setNegativeButton("HAYIR", null)
                                          .setPositiveButton("SİL", (dialog, which) -> {
                                              for (int i = records.size() - 1; i >= 0; i--) {
                                                  String[] rec = records.get(i).split("\\|", -1);
                                                  if (rec.length > 0 && deleteChainId.equals(rec[0])) {
                                                      records.remove(i);
                                                  }
                                              }
                                              persist();
                                              monthly();
                                          })
                                          .show();
                                  return true;
                              });
                              chainCard.addView(serviceTitle);

                              // Üst başlıkta tekrar eden tren/kiminle/başlangıç bilgileri yok.
                              // Bu bilgiler artık ait oldukları tarih segmentinde ayrıntılı gösterilir.
                              chainCard.addView(text(
                                      completed ? "SERVİS TAMAMLANDI" : "SERVİS DEVAM EDİYOR",
                                      12,
                                      completed ? Color.rgb(180,205,190) : Color.rgb(235,190,90),
                                      true));

                              for (String r : chain) {
                                  String[] a = r.split("\\|", -1);
                                  if (a.length < 7) continue;

                                  String status = a[6];

                                  // Otel/bekleme segmenti, o günün görev başlangıç bilgilerini
                                  // ve ardından otel teslim/varış bilgilerini birlikte gösterir.
                                  if ("HOTEL".equals(status) || "HOTEL_DONE".equals(status)) {
                                      if (a.length >= 11) {
                                          LinearLayout hotel = card();
                                          hotel.setBackground(bg(Color.rgb(33,28,43), 18));

                                          // Otel dönüşüne çevrilmiş ilk kayıt da gerçek görev
                                          // başlangıcı olduğu için, başlangıçta girilen tüm bilgiler
                                          // bu tarih kartında korunur ve gösterilir.
                                          hotel.addView(text(a[1] + "  •  TREN " + a[3], 16,
                                                  Color.rgb(245,243,250), true));
                                          hotel.addView(text("Kiminle  •  " + a[2], 13,
                                                  Color.rgb(205,196,220), false));
                                          hotel.addView(text("Başlangıç  •  " + a[4], 13,
                                                  Color.rgb(205,196,220), false));
                                          hotel.addView(text("Başlangıç tesellüm  •  " + a[5], 13,
                                                  Color.rgb(205,196,220), false));
                                          hotel.addView(text("OTEL / BEKLEME", 12,
                                                  Color.rgb(183,161,220), true));
                                          hotel.addView(text("Teslim  •  " + a[8] +
                                                  "  •  Tesellüm: " + a[9], 13,
                                                  Color.rgb(205,196,220), false));
                                          hotel.addView(text("Otele varış  •  " + a[10] +
                                                  "  (+30 dk çalışma)", 13,
                                                  Color.rgb(180,205,190), false));

                                          if ("HOTEL_DONE".equals(status)) {
                                              hotel.addView(text("Sonraki gün trene devam edildi.",
                                                      13, Color.rgb(190,175,220), false));
                                          } else {
                                              hotel.addView(text("Tren devamı bekleniyor.",
                                                      13, Color.rgb(175,168,185), false));
                                          }

                                          final String editableHotelRecord = r;
                                          hotel.setOnLongClickListener(v -> {
                                              String title = "HOTEL_DONE".equals(status)
                                                      ? "Otel / bekleme kaydı"
                                                      : "Görev başlangıç kaydı";
                                              new AlertDialog.Builder(this)
                                                      .setTitle(title)
                                                      .setMessage("Bu kaydı düzenlemek ister misin?")
                                                      .setNegativeButton("Vazgeç", null)
                                                      .setPositiveButton("Düzenle", (d, which) -> editCompletedRecord(editableHotelRecord))
                                                      .show();
                                              return true;
                                          });

                                          chainCard.addView(hotel);

                                          String nextDate = "";
                                          for (String nextSegment : chain) {
                                              String[] n = nextSegment.split("\\|", -1);
                                              if (n.length >= 7 &&
                                                      !"HOTEL".equals(n[6]) &&
                                                      !"HOTEL_DONE".equals(n[6]) &&
                                                      compareDates(n[1], a[7]) > 0) {
                                                  if (nextDate.isEmpty() ||
                                                          compareDates(n[1], nextDate) < 0) {
                                                      nextDate = n[1];
                                                  }
                                              }
                                          }

                                          if (!nextDate.isEmpty()) {
                                              try {
                                                  Date from = filterDate.parse(a[7]);
                                                  Date to = filterDate.parse(nextDate);

                                                  if (from != null && to != null) {
                                                      Calendar c = Calendar.getInstance();
                                                      c.setTime(from);
                                                      c.add(Calendar.DAY_OF_MONTH, 1);

                                                      while (c.getTime().before(to)) {
                                                          String d = filterDate.format(c.getTime());

                                                          LinearLayout wait = card();
                                                          wait.setBackground(bg(Color.rgb(27,24,32), 18));
                                                          wait.addView(text(d + "  •  OTEL / BEKLEME", 14,
                                                                  Color.rgb(210,200,222), true));
                                                          wait.addView(text("Çalışma kaydı yok • Otel konaklaması",
                                                                  13, Color.rgb(165,158,175), false));
                                                          chainCard.addView(wait);

                                                          c.add(Calendar.DAY_OF_MONTH, 1);
                                                      }
                                                  }
                                              } catch (Exception ignored) {}
                                          }
                                      }

                                      continue;
                                  }

                                  // Çalışılan her tarih ayrı segment olarak görünür.
                                  LinearLayout segmentCard = card();
                                  segmentCard.setBackground(bg(Color.rgb(35,31,42), 18));

                                  segmentCard.addView(text(
                                          a[1] + "  •  TREN " + a[3],
                                          16, Color.rgb(245,243,250), true));

                                  segmentCard.addView(text(
                                          "Kiminle  •  " + a[2],
                                          14, Color.rgb(205,196,220), false));

                                  segmentCard.addView(text(
                                          "Başlangıç  •  " + a[4],
                                          13, Color.rgb(185,178,195), false));

                                  segmentCard.addView(text(
                                          "Başlangıç tesellüm  •  " + a[5],
                                          13, Color.rgb(170,165,180), false));

                                  if ("DONE".equals(status) && a.length >= 11) {
                                      segmentCard.addView(text("TAMAMLANDI", 12,
                                              Color.rgb(180,205,190), true));

                                      segmentCard.addView(text(
                                              "Bitiş  •  " + a[7] + " " + a[8],
                                              13, Color.rgb(205,196,220), false));

                                      segmentCard.addView(text(
                                              "Tesellüm  •  " + a[9],
                                              13, Color.rgb(205,196,220), false));

                                      segmentCard.addView(text(
                                              "Eve giriş  •  " + a[10] + "  (+30 dk)",
                                              13, Color.rgb(180,205,190), false));
                                  } else if ("OPEN".equals(status)) {
                                      segmentCard.addView(text("DEVAM EDİYOR", 12,
                                              Color.rgb(235,190,90), true));
                                  }

                                  if ("DONE".equals(status)) {
                                      final String editableRecord = r;
                                      segmentCard.setOnLongClickListener(v -> {
                                          new AlertDialog.Builder(this)
                                                  .setTitle("Tamamlanmış kayıt")
                                                  .setMessage("Bu kaydı düzenlemek ister misin?")
                                                  .setNegativeButton("Vazgeç", null)
                                                  .setPositiveButton("Düzenle", (d, which) -> editCompletedRecord(editableRecord))
                                                  .show();
                                          return true;
                                      });
                                  }

                                  chainCard.addView(segmentCard);
                              }

                              resultContainer.addView(chainCard);
                          }

                          if (visibleChains == 0) {
                              LinearLayout emptyMonth = card();
                              emptyMonth.addView(text(
                                      monthLabels[selectedMonth] + " " + selectedYear + " içinde kayıt bulunmuyor.",
                                      17, Color.rgb(240,236,246), true));
                              emptyMonth.addView(text(
                                      "Başka bir ay veya yıl seçerek kayıtlarını görüntüleyebilirsin.",
                                      13, Color.rgb(170,165,180), false));
                              resultContainer.addView(emptyMonth);
                          }
                      };

                      yearSpinner.setOnItemSelectedListener(new android.widget.AdapterView.OnItemSelectedListener() {
                          @Override
                          public void onItemSelected(android.widget.AdapterView<?> parent, View view, int position, long id) {
                              render.run();
                          }

                          @Override
                          public void onNothingSelected(android.widget.AdapterView<?> parent) {}
                      });

                      monthSpinner.setOnItemSelectedListener(new android.widget.AdapterView.OnItemSelectedListener() {
                          @Override
                          public void onItemSelected(android.widget.AdapterView<?> parent, View view, int position, long id) {
                              render.run();
                          }

                          @Override
                          public void onNothingSelected(android.widget.AdapterView<?> parent) {}
                      });

                      render.run();
                  }

                  Button back = action("Ana Sayfa", false);
                  root.addView(back);
                  back.setOnClickListener(v -> home());
              }

              void load() {
                  String all = prefs.getString("records", "");
                  if (all.isEmpty()) return;

                  for (String raw : all.split("\\n", -1)) {
                      if (raw.trim().isEmpty()) continue;
                      String[] a = raw.split("\\|", -1);

                      // Eski OPEN kayit formati: id|date|person|train|start|OPEN
                      if (a.length == 6 && a[5].equals("OPEN")) {
                          raw = a[0] + "|" + a[1] + "|" + a[2] + "|" + a[3] + "|" +
                                  a[4] + "|Belirtilmedi|OPEN";
                      }
                      // Eski DONE kayit formati: id|date|person|train|start|DONE|finishDate|finish|owner|arrival
                      else if (a.length == 10 && a[5].equals("DONE")) {
                          raw = a[0] + "|" + a[1] + "|" + a[2] + "|" + a[3] + "|" +
                                  a[4] + "|Belirtilmedi|DONE|" + a[6] + "|" + a[7] + "|" +
                                  a[8] + "|" + a[9];
                      }

                      records.add(raw);
                  }
              }
          
              void persist() {
                  StringBuilder out = new StringBuilder();
                  for (String r : records) {
                      if (out.length() > 0) out.append("\n");
                      out.append(r);
                  }
                  prefs.edit().putString("records", out.toString()).apply();
              }
          }
          EOF

          cd puantaj
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Puantaj-v0.5.22.apk"
          test -s "$GITHUB_WORKSPACE/Puantaj-v0.5.22.apk"

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Puantaj-v0.5.22
          path: ${{ github.workspace }}/Puantaj-v0.5.22.apk
