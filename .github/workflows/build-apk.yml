name: Puantaj APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Android projesini oluştur
        shell: bash
        run: |
          set -e

          mkdir -p puantaj/app/src/main/java/com/furkan/puantaj
          mkdir -p puantaj/app/src/main/res/values

          cat > puantaj/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PuantajAndroid"
          include(":app")
          EOF

          cat > puantaj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > puantaj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > puantaj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.furkan.puantaj'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.furkan.puantaj'
                  minSdk 26
                  targetSdk 35
                  versionCode 3
                  versionName '0.3'
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > puantaj/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/Theme.Puantaj"
                  android:label="Puantaj"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > puantaj/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.Puantaj" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
              </style>
          </resources>
          EOF

          cat > puantaj/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Puantaj</string>
          </resources>
          EOF

          cat > puantaj/app/src/main/java/com/furkan/puantaj/MainActivity.java <<'EOF'
          package com.furkan.puantaj;

          import android.app.*;
          import android.os.Bundle;
          import android.content.*;
          import android.view.*;
          import android.widget.*;
          import com.google.android.material.textfield.TextInputEditText;
          import com.google.android.material.textfield.TextInputLayout;
          import java.text.SimpleDateFormat;
          import java.util.*;

          public class MainActivity extends Activity {
              LinearLayout root;
              SharedPreferences prefs;
              ArrayList<String> records = new ArrayList<>();

              String selectedStart = "";
              String selectedStartDate = "";
              String selectedFinish = "";
              String selectedFinishDate = "";

              int dp(float v) {
                  return (int)(v * getResources().getDisplayMetrics().density + 0.5f);
              }

              TextView title(String s) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(28);
                  t.setTypeface(null, 1);
                  t.setPadding(0, 0, 0, dp(18));
                  return t;
              }

              TextView info(String s) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(16);
                  t.setPadding(0, dp(4), 0, dp(14));
                  return t;
              }

              Button button(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setAllCaps(false);
                  b.setTextSize(16);
                  b.setMinHeight(dp(52));
                  b.setPadding(dp(8), dp(6), dp(8), dp(6));
                  return b;
              }

              TextInputLayout field(String hint) {
                  TextInputLayout box = new TextInputLayout(this);
                  box.setHint(hint);
                  box.setBoxBackgroundMode(TextInputLayout.BOX_BACKGROUND_OUTLINE);
                  box.setPadding(0, dp(4), 0, dp(8));
                  TextInputEditText edit = new TextInputEditText(box.getContext());
                  edit.setSingleLine(true);
                  edit.setTextSize(17);
                  box.addView(edit, new LinearLayout.LayoutParams(-1, -2));
                  return box;
              }

              String value(TextInputLayout box) {
                  TextInputEditText e = (TextInputEditText) box.getEditText();
                  return e == null || e.getText() == null ? "" : e.getText().toString().trim();
              }

              void page(String s) {
                  ScrollView scroll = new ScrollView(this);
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(20), dp(20), dp(20), dp(20));
                  scroll.addView(root);
                  setContentView(scroll);
                  root.addView(title(s));
              }

              void home() {
                  page("PUANTAJ");
                  root.addView(info("Günlük görev kayıtlarını telefondan kolayca yönet."));

                  Button n = button("Yeni Görev / Tren Al");
                  root.addView(n);
                  n.setOnClickListener(v -> newRecord());

                  Button o = button("Devam Eden Kayıtlar");
                  root.addView(o);
                  o.setOnClickListener(v -> ongoing());

                  Button m = button("Aylık Kayıtlar");
                  root.addView(m);
                  m.setOnClickListener(v -> monthly());

                  root.addView(info("Görevi başlattıktan sonra uygulamayı kapatabilirsin."));
              }

              void newRecord() {
                  page("Yeni Görev / Tren Al");

                  selectedStartDate = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault()).format(new Date());
                  selectedStart = "";

                  Button dateButton = button("Tarih  •  " + selectedStartDate);
                  root.addView(dateButton);
                  dateButton.setOnClickListener(v -> chooseDate(dateButton, true));

                  TextInputLayout person = field("Kiminle gittin?");
                  root.addView(person);

                  TextInputLayout train = field("Tren no");
                  root.addView(train);

                  Button startButton = button("Görev alış / başlangıç saati seç");
                  root.addView(startButton);
                  startButton.setOnClickListener(v -> chooseTime(startButton, true));

                  Button save = button("Görevi Başlat ve Kaydet");
                  root.addView(save);
                  save.setOnClickListener(v -> {
                      if (value(person).isEmpty() || value(train).isEmpty() || selectedStart.isEmpty()) {
                          Toast.makeText(this, "Kiminle, tren no ve başlangıç saati gerekli.", Toast.LENGTH_LONG).show();
                          return;
                      }

                      String record =
                              UUID.randomUUID() + "|" +
                              selectedStartDate + "|" +
                              value(person) + "|" +
                              value(train) + "|" +
                              selectedStart + "|OPEN";

                      records.add(record);
                      persist();
                      Toast.makeText(this, "Görev kaydedildi. Uygulamayı kapatabilirsin.", Toast.LENGTH_LONG).show();
                      home();
                  });

                  Button cancel = button("Vazgeç");
                  root.addView(cancel);
                  cancel.setOnClickListener(v -> home());
              }

              void chooseDate(Button target, boolean start) {
                  Calendar c = Calendar.getInstance();
                  if (start && !selectedStartDate.isEmpty()) {
                      try {
                          Date d = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault()).parse(selectedStartDate);
                          if (d != null) c.setTime(d);
                      } catch (Exception ignored) {}
                  }

                  DatePickerDialog d = new DatePickerDialog(
                      this,
                      (view, year, month, day) -> {
                          String value = String.format(Locale.getDefault(), "%02d.%02d.%04d", day, month + 1, year);
                          if (start) {
                              selectedStartDate = value;
                              target.setText("Tarih  •  " + value);
                          } else {
                              selectedFinishDate = value;
                              target.setText("Görev bitiş tarihi  •  " + value);
                          }
                      },
                      c.get(Calendar.YEAR), c.get(Calendar.MONTH), c.get(Calendar.DAY_OF_MONTH)
                  );
                  d.show();
              }

              void chooseTime(Button target, boolean start) {
                  Calendar c = Calendar.getInstance();
                  TimePickerDialog d = new TimePickerDialog(
                      this,
                      (view, hour, minute) -> {
                          String value = String.format(Locale.getDefault(), "%02d:%02d", hour, minute);
                          if (start) {
                              selectedStart = value;
                              target.setText("Görev alış / başlangıç  •  " + value);
                          } else {
                              selectedFinish = value;
                              target.setText("Görev bitiş / teslim  •  " + value);
                          }
                      },
                      c.get(Calendar.HOUR_OF_DAY), c.get(Calendar.MINUTE), true
                  );
                  d.show();
              }

              void ongoing() {
                  page("Devam Eden Kayıtlar");
                  boolean found = false;

                  for (String r : new ArrayList<>(records)) {
                      if (r.endsWith("|OPEN")) {
                          found = true;
                          String[] a = r.split("\\|", -1);
                          Button b = button(a[1] + "  •  Tren " + a[3] + "  •  " + a[2]);
                          root.addView(b);
                          b.setOnClickListener(v -> complete(r));
                      }
                  }

                  if (!found) root.addView(info("Devam eden kayıt yok."));

                  Button back = button("Ana Sayfa");
                  root.addView(back);
                  back.setOnClickListener(v -> home());
              }

              void complete(String r) {
                  String[] a = r.split("\\|", -1);

                  page("Görevi Tamamla");
                  root.addView(info(
                      "Tarih: " + a[1] +
                      "\nTren: " + a[3] +
                      "\nKiminle: " + a[2] +
                      "\nGörev alış / başlangıç: " + a[4]
                  ));

                  selectedFinish = "";
                  selectedFinishDate = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault()).format(new Date());

                  Button finishDate = button("Görev bitiş tarihi  •  " + selectedFinishDate);
                  root.addView(finishDate);
                  finishDate.setOnClickListener(v -> chooseDate(finishDate, false));

                  Button finishButton = button("Görev bitiş / teslim saati seç");
                  root.addView(finishButton);
                  finishButton.setOnClickListener(v -> chooseTime(finishButton, false));

                  TextInputLayout owner = field("Teslim / tesellüm sahibi");
                  root.addView(owner);

                  TextView automatic = info("Eve giriş: Görev bitişinden otomatik olarak +30 dakika");
                  root.addView(automatic);

                  Button save = button("Görevi Tamamla");
                  root.addView(save);

                  save.setOnClickListener(v -> {
                      if (selectedFinish.isEmpty() || selectedFinishDate.isEmpty()) {
                          Toast.makeText(this, "Görev bitiş tarihi ve saatini seç.", Toast.LENGTH_LONG).show();
                          return;
                      }

                      String arrival = addThirtyMinutes(selectedFinishDate, selectedFinish);

                      String newRecord =
                          r.replace(
                              "|OPEN",
                              "|DONE|" +
                              selectedFinishDate + "|" +
                              selectedFinish + "|" +
                              value(owner) + "|" +
                              arrival
                          );

                      records.set(records.indexOf(r), newRecord);
                      persist();

                      Toast.makeText(this, "Görev tamamlandı. Eve giriş: " + arrival, Toast.LENGTH_LONG).show();
                      home();
                  });

                  Button cancel = button("Vazgeç");
                  root.addView(cancel);
                  cancel.setOnClickListener(v -> ongoing());
              }

              String addThirtyMinutes(String date, String time) {
                  try {
                      SimpleDateFormat f = new SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault());
                      Date d = f.parse(date + " " + time);
                      if (d != null) {
                          d = new Date(d.getTime() + 30L * 60L * 1000L);
                          return new SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault()).format(d);
                      }
                  } catch (Exception ignored) {}
                  return date + " " + time;
              }

              void monthly() {
                  page("Aylık Kayıtlar");
                  if (records.isEmpty()) root.addView(info("Henüz kayıt yok."));

                  for (String r : records) {
                      String[] a = r.split("\\|", -1);
                      if (a.length >= 4) {
                          root.addView(info(
                              a[1] + "  •  Tren " + a[3] +
                              "  •  " + a[2] +
                              "  •  " + (r.endsWith("|OPEN") ? "Devam ediyor" : "Tamamlandı")
                          ));
                      }
                  }

                  Button back = button("Ana Sayfa");
                  root.addView(back);
                  back.setOnClickListener(v -> home());
              }

              void load() {
                  String all = prefs.getString("records", "");
                  if (!all.isEmpty()) records.addAll(Arrays.asList(all.split("\\n", -1)));
              }

              void persist() {
                  StringBuilder out = new StringBuilder();
                  for (String r : records) {
                      if (out.length() > 0) out.append("\n");
                      out.append(r);
                  }
                  prefs.edit().putString("records", out.toString()).apply();
              }
          }
          EOF

          cd puantaj
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Puantaj-v0.3.apk"

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Puantaj-v0.3
          path: Puantaj-v0.3.apk
