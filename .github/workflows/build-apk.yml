name: 4011 Model APK v0.12.1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v5

      - name: Android projesini oluştur
        shell: bash
        run: |
          set -e
          mkdir -p puantaj/app/src/main/java/com/furkan/puantaj
          mkdir -p puantaj/app/src/main/res/values
          mkdir -p puantaj/app/src/main/res/drawable-nodpi
          mkdir -p puantaj/app/src/main/res/drawable
          mkdir -p puantaj/app/src/main/res/mipmap-anydpi-v26
          mkdir -p puantaj/app/src/main/res/xml
          mkdir -p puantaj/app/src/main/assets

          test -s "$GITHUB_WORKSPACE/puantaj_app_icon.png"
          cp "$GITHUB_WORKSPACE/puantaj_app_icon.png" puantaj/app/src/main/res/drawable-nodpi/puantaj_icon.png
          test -s puantaj/app/src/main/res/drawable-nodpi/puantaj_icon.png

          cat > puantaj/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PuantajAndroid"
          include(":app")
          EOF

          cat > puantaj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > puantaj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > puantaj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.furkan.puantaj'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.furkan.puantaj'
                  minSdk 26
                  targetSdk 35
                  versionCode 53
                  versionName '0.12.1'
              }
          }
          dependencies {
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > puantaj/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/Theme.Puantaj"
                  android:label="4011 Model"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat > puantaj/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/puantaj_icon_background" />
              <foreground android:drawable="@drawable/puantaj_icon_foreground" />
          </adaptive-icon>
          EOF

          cat > puantaj/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/puantaj_icon_background" />
              <foreground android:drawable="@drawable/puantaj_icon_foreground" />
          </adaptive-icon>
          EOF

          cat > puantaj/app/src/main/res/drawable/puantaj_icon_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/puantaj_icon"
              android:gravity="fill" />
          EOF

          cat > puantaj/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="puantaj_icon_background">#140A26</color>
          </resources>
          EOF

          cat > puantaj/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.Puantaj" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#06050E</item>
                  <item name="android:navigationBarColor">#06050E</item>
                  <item name="colorPrimary">#A82CFF</item>
                  <item name="colorSecondary">#39FFA0</item>
              </style>
          </resources>
          EOF

          cat > puantaj/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">4011 Model</string>
          </resources>
          EOF

          cat > puantaj/app/src/main/java/com/furkan/puantaj/MainActivity.java <<'EOF'
          package com.furkan.puantaj;
          
          import android.app.*;
          import android.os.Bundle;
          import android.content.*;
          import android.graphics.Color;
          import android.graphics.BitmapFactory;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.LinearGradient;
          import android.graphics.Shader;
          import android.net.Uri;
          import java.io.*;
          import java.util.zip.*;
          import java.util.regex.*;
          import android.view.*;
          import android.widget.*;
          import com.google.android.material.textfield.TextInputEditText;
          import com.google.android.material.textfield.TextInputLayout;
          import java.text.SimpleDateFormat;
          import java.util.*;
          
          public class MainActivity extends Activity {
              LinearLayout root;
              SharedPreferences prefs;
              ArrayList<String> records = new ArrayList<>();
          
              String selectedStart = "";
              String selectedStartDate = "";
              String selectedFinish = "";
              String selectedFinishDate = "";
              String currentPage = "home";
              // "Yeni Görev" sihirbazında hangi adımdaysak, o adımın "geri" davranışı
              // buraya yazılır (her render'da güncellenir). navigateBack() bunu okuyarak
              // sistem geri tuşu / kaydırma hareketini de ok butonuyla birebir aynı
              // şekilde çalıştırır.
              Runnable pendingBack = null;

              static final String DEFAULT_PEOPLE = "Hazım|Ender|Yücel|Emirhan|Melike";

              // Sabit tren listeleri — tek yerden yönetilir, tüm ekranlar buradan okur.
              static final String[] OUTBOUND_TRAINS = {"23201", "23202", "23205", "23207", "27450(des1)", "27452(des2)", "27454(des3)", "Destek-2/3", "Bila", "İcap"};
              static final String[] RETURN_TRAINS = {"13102", "13104", "13106", "13108", "53503"};

              // ================== EXCEL MOTORU (ZIP/XML) — AŞAMA 1 (TEST) ==================
              // Hazır template.xlsx şablonu hiç yeniden oluşturulmuyor; asset olarak
              // gömülü kopyası ZIP olarak açılıp SADECE gerekli hücrelerin XML'i metin
              // düzeyinde değiştiriliyor, sonra aynen yeniden paketleniyor. Şablonun geri
              // kalanı (birleşik hücreler, kenarlıklar, yazı tipleri, logo, sayfa düzeni,
              // sharedStrings.xml, workbook.xml, printerSettings) hiç dokunulmadan aynen
              // kopyalanıyor. Bu aşamada SADECE şunlar yazılıyor: personel bilgileri,
              // seçilen ay/yıl başlığı, Pazar günü tarih rengi. Görev/tren kayıtları,
              // imzalar ve "4011 Excel Çıktıları" ekranı bilinçli olarak KAPSAM DIŞI.
              static final String[] EXCEL_AY_ADLARI = {"OCAK","ŞUBAT","MART","NİSAN","MAYIS","HAZİRAN",
                      "TEMMUZ","AĞUSTOS","EYLÜL","EKİM","KASIM","ARALIK"};

              int excelColToNum(String letters) {
                  int n = 0;
                  for (int i = 0; i < letters.length(); i++) {
                      n = n * 26 + (letters.charAt(i) - 'A' + 1);
                  }
                  return n;
              }

              String excelXmlEscape(String s) {
                  if (s == null) s = "";
                  return s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;").replace("\"", "&quot;");
              }

              String excelXmlUnescape(String s) {
                  if (s == null) return "";
                  return s.replace("&lt;", "<").replace("&gt;", ">").replace("&quot;", "\"").replace("&amp;", "&");
              }

              // Bir hücrenin DÜZ METİN içeriğini okur (excelSetCell'in yazdığı inlineStr
              // formatını okur) — sayfa toplamlarını hesaplarken bu motorun kendi yazdığı
              // J/M/X/AA hücrelerini geri okumak için kullanılır. Hücre yok/boşsa "" döner.
              String excelReadCellText(String sheetXml, String cellRef) {
                  Matcher rowRefM = Pattern.compile("([A-Z]+)(\\d+)").matcher(cellRef);
                  if (!rowRefM.matches()) return "";
                  int rowNum = Integer.parseInt(rowRefM.group(2));
                  Matcher rowM = Pattern.compile("<row r=\"" + rowNum + "\"[^>]*>.*?</row>", Pattern.DOTALL).matcher(sheetXml);
                  if (!rowM.find()) return "";
                  Matcher cellM = Pattern.compile("<c r=\"" + cellRef + "\"(?:[^>]*?/>|[^>]*>.*?</c>)", Pattern.DOTALL).matcher(rowM.group());
                  if (!cellM.find()) return "";
                  Matcher tM = Pattern.compile("<t[^>]*>(.*?)</t>", Pattern.DOTALL).matcher(cellM.group());
                  if (!tM.find()) return "";
                  return excelXmlUnescape(tM.group(1));
              }

              // Bir hücrenin GEÇERLİ stil (s=) indeksini okur; hücre yoksa/stil yoksa 0.
              int excelCellStyleIndex(String sheetXml, int rowNum, String cellRef) {
                  Matcher rowM = Pattern.compile("<row r=\"" + rowNum + "\"[^>]*>.*?</row>", Pattern.DOTALL).matcher(sheetXml);
                  if (!rowM.find()) return 0;
                  Matcher cellM = Pattern.compile("<c r=\"" + cellRef + "\"(?:[^>]*?/>|[^>]*>.*?</c>)", Pattern.DOTALL).matcher(rowM.group());
                  if (!cellM.find()) return 0;
                  Matcher sM = Pattern.compile("s=\"(\\d+)\"").matcher(cellM.group());
                  return sM.find() ? Integer.parseInt(sM.group(1)) : 0;
              }

              // "H:MM" / "HH:MM" metnini dakikaya çevirir (24 saati aşan değerler dahil).
              // Tanınmayan/boş metin 0 döner.
              int excelParseDurationToMinutes(String s) {
                  if (s == null) return 0;
                  s = s.trim();
                  if (s.isEmpty()) return 0;
                  Matcher m = Pattern.compile("^(\\d+):(\\d{1,2})$").matcher(s);
                  if (!m.find()) return 0;
                  return Integer.parseInt(m.group(1)) * 60 + Integer.parseInt(m.group(2));
              }

              // Dakikayı "H:MM" biçimine çevirir (24 saati aşan toplamları da destekler,
              // ör. 10225 dakika → "170:25").
              String excelMinutesToDuration(int totalMinutes) {
                  int h = totalMinutes / 60;
                  int mm = totalMinutes % 60;
                  return h + ":" + (mm < 10 ? "0" + mm : String.valueOf(mm));
              }

              // Dakikayı "H Saat M Dakika" biçimine çevirir (24 saati aşan toplamları da
              // destekler). Yalnızca DIŞ sayfasının "FİİLİ ÇALIŞMA SAATİ TOPLAMI=" alanı
              // için kullanılır — diğer tüm yerlerde excelMinutesToDuration ("H:MM")
              // KULLANILMAYA DEVAM EDER, bu ayrı bir biçim.
              String excelMinutesToSaatDakika(int totalMinutes) {
                  int h = totalMinutes / 60;
                  int mm = totalMinutes % 60;
                  return h + " Saat " + mm + " Dakika";
              }

              // "5-1=4" veya sade "4" biçimindeki bir yemek hücresinden NET (eşittirden
              // sonraki) sayıyı okur. Tanınmayan/boş metin 0 döner.
              int excelParseNetMeal(String s) {
                  if (s == null) return 0;
                  s = s.trim();
                  if (s.isEmpty()) return 0;
                  int eq = s.indexOf('=');
                  String numPart = eq >= 0 ? s.substring(eq + 1) : s;
                  try { return Integer.parseInt(numPart.trim()); } catch (Exception e) { return 0; }
              }

              // Bir <font>...</font> bloğunu bir zengin metin (<rPr>) bloğuna çevirir;
              // overrideSizePt>0 ise sadece <sz> puntosu bu değere değiştirilir — ailesi,
              // rengi vb. AYNEN korunur. overrideSizePt<=0 ise fontun kendi puntosu
              // hiç değiştirilmeden kullanılır.
              String excelFontToRPr(String fontBlock, int overrideSizePt) {
                  String inner = fontBlock.substring("<font>".length(), fontBlock.length() - "</font>".length());
                  if (overrideSizePt > 0) {
                      Matcher szM = Pattern.compile("<sz val=\"[^\"]*\"\\s*/>").matcher(inner);
                      if (szM.find()) {
                          inner = inner.substring(0, szM.start()) + "<sz val=\"" + overrideSizePt + "\"/>" + inner.substring(szM.end());
                      } else {
                          inner = "<sz val=\"" + overrideSizePt + "\"/>" + inner;
                      }
                  }
                  return "<rPr>" + inner + "</rPr>";
              }

              // ZATEN VAR OLAN bir hücreye (ör. DIŞ!A22, DIŞ!A25), içinde FARKLI puntolu
              // bölümler barındıran bir metni gerçek rich-text run'lar (<is><r>...) olarak
              // yazar. Hücrenin MEVCUT s= (stil) değeri HİÇ DEĞİŞMEZ — sadece metin
              // çok-parçalı hale gelir. texts[i]/sizesPt[i] sırayla eşleşir; sizesPt[i]<=0
              // olan parça hücrenin KENDİ mevcut fontunun puntosuyla (değiştirilmeden)
              // yazılır — böylece etiket ve nokta bölümleri "11 punto"da aynen kalırken
              // sadece istenen parça (ör. sonuç değeri) farklı puntoda görünür.
              String excelSetCellRichText(String sheetXml, String cellRef, String stylesOriginal,
                                          String[] texts, int[] sizesPt) throws Exception {
                  Matcher rowRefM = Pattern.compile("([A-Z]+)(\\d+)").matcher(cellRef);
                  if (!rowRefM.matches()) return sheetXml;
                  int rowNum = Integer.parseInt(rowRefM.group(2));
                  Matcher rowM = Pattern.compile("<row r=\"" + rowNum + "\"[^>]*>.*?</row>", Pattern.DOTALL).matcher(sheetXml);
                  if (!rowM.find()) return sheetXml;
                  String rowXml = rowM.group();
                  Matcher cellM = Pattern.compile("<c r=\"" + cellRef + "\"(?:[^>]*?/>|[^>]*>.*?</c>)", Pattern.DOTALL).matcher(rowXml);
                  if (!cellM.find()) return sheetXml;
                  String cellXml = cellM.group();
                  Matcher sM = Pattern.compile("s=\"(\\d+)\"").matcher(cellXml);
                  int styleIdx = sM.find() ? Integer.parseInt(sM.group(1)) : 0;

                  String baseXf = excelBlockByIndex(stylesOriginal, "cellXfs", "xf", styleIdx);
                  Matcher fIdM = Pattern.compile("fontId=\"(\\d+)\"").matcher(baseXf);
                  int baseFontId = fIdM.find() ? Integer.parseInt(fIdM.group(1)) : 0;
                  String baseFont = excelBlockByIndex(stylesOriginal, "fonts", "font", baseFontId);

                  StringBuilder runsXml = new StringBuilder();
                  for (int i = 0; i < texts.length; i++) {
                      if (texts[i] == null || texts[i].isEmpty()) continue;
                      String rPr = excelFontToRPr(baseFont, sizesPt[i]);
                      runsXml.append("<r>").append(rPr).append("<t xml:space=\"preserve\">")
                              .append(excelXmlEscape(texts[i])).append("</t></r>");
                  }
                  String newCellXml = "<c r=\"" + cellRef + "\" s=\"" + styleIdx + "\" t=\"inlineStr\"><is>" + runsXml + "</is></c>";

                  String newRowXml = rowXml.substring(0, cellM.start()) + newCellXml + rowXml.substring(cellM.end());
                  return sheetXml.substring(0, rowM.start()) + newRowXml + sheetXml.substring(rowM.end());
              }

              // Belirtilen hücreyi satırda bulup değiştirir; yoksa doğru sütun sırasına
              // yeni hücre olarak ekler. style<0 ise: hücre zaten varsa mevcut stilini
              // korur, yoksa stilsiz (şablonun varsayılanı) ekler. Metin asla regex'in
              // "replacement" mekanizmasına verilmiyor (substring birleştirme kullanılıyor)
              // — böylece kullanıcının yazdığı metinde "$" veya "\" olsa bile bozulma olmaz.
              String excelSetCell(String sheetXml, String cellRef, String text, int style) {
                  Matcher refM = Pattern.compile("([A-Z]+)(\\d+)").matcher(cellRef);
                  if (!refM.matches()) throw new IllegalArgumentException("Geçersiz hücre: " + cellRef);
                  String colLetters = refM.group(1);
                  int rowNum = Integer.parseInt(refM.group(2));
                  int colNum = excelColToNum(colLetters);

                  Matcher rowM = Pattern.compile("<row r=\"" + rowNum + "\"[^>]*>.*?</row>", Pattern.DOTALL).matcher(sheetXml);
                  if (!rowM.find()) throw new IllegalStateException("Satır bulunamadı: " + rowNum);
                  String rowXml = rowM.group();

                  Matcher cellM = Pattern.compile("<c r=\"" + cellRef + "\"(?:[^>]*?/>|[^>]*>.*?</c>)", Pattern.DOTALL).matcher(rowXml);
                  boolean exists = cellM.find();

                  int effectiveStyle = style;
                  if (exists && style < 0) {
                      Matcher sM = Pattern.compile("s=\"(\\d+)\"").matcher(cellM.group());
                      if (sM.find()) effectiveStyle = Integer.parseInt(sM.group(1));
                  }
                  String styleAttr = effectiveStyle >= 0 ? (" s=\"" + effectiveStyle + "\"") : "";
                  String newCell = "<c r=\"" + cellRef + "\"" + styleAttr + " t=\"inlineStr\"><is><t xml:space=\"preserve\">"
                          + excelXmlEscape(text) + "</t></is></c>";

                  String newRowXml;
                  if (exists) {
                      newRowXml = rowXml.substring(0, cellM.start()) + newCell + rowXml.substring(cellM.end());
                  } else {
                      Matcher anyM = Pattern.compile("<c r=\"([A-Z]+)(\\d+)\"(?:[^>]*?/>|[^>]*>.*?</c>)", Pattern.DOTALL).matcher(rowXml);
                      int insertPos = -1;
                      while (anyM.find()) {
                          if (excelColToNum(anyM.group(1)) > colNum) { insertPos = anyM.start(); break; }
                      }
                      if (insertPos < 0) insertPos = rowXml.lastIndexOf("</row>");
                      newRowXml = rowXml.substring(0, insertPos) + newCell + rowXml.substring(insertPos);
                  }
                  return sheetXml.substring(0, rowM.start()) + newRowXml + sheetXml.substring(rowM.end());
              }

              // Mevcut birleşimlere hiç dokunmadan, listeye yeni bir birleşim ekler.
              String excelAddMerge(String sheetXml, String ref) {
                  Matcher m = Pattern.compile("<mergeCells count=\"(\\d+)\">").matcher(sheetXml);
                  if (!m.find()) throw new IllegalStateException("mergeCells bulunamadı");
                  int newCount = Integer.parseInt(m.group(1)) + 1;
                  String result = sheetXml.substring(0, m.start()) + "<mergeCells count=\"" + newCount + "\">"
                          + sheetXml.substring(m.end());
                  int insertAt = result.indexOf("</mergeCells>");
                  return result.substring(0, insertAt) + "<mergeCell ref=\"" + ref + "\"/>" + result.substring(insertAt);
              }

              // Uygulamadan gelen bir personel bilgisini, karşısındaki hazır başlıkla AYNI
              // 2 satırlık yüksekliği kaplayacak şekilde yazar (anchorRef:companionRef
              // birleştirilir). Böylece dikey ortalama, başlığın dikey ortasıyla birebir
              // eşleşir — satır yükseklikleri hiç değişmeden.
              // Uygulamadan gelen bir personel bilgisini yazar ve karşısındaki hazır
              // başlıkla AYNI 2 satırlık yüksekliği kaplayacak şekilde birleştirir —
              // dikey ortalama böylece başlığın dikey ortasıyla birebir eşleşir.
              // mergeRangeEnd, 28pt metnin tamamının sığması için yeterli GENİŞLİKTEKİ
              // birleşimin sağ-alt köşesidir (örn. "X13") — tek sütun 28pt'te sadece
              // ~4 karakter aldığından ("Tren Makinisti" kırpılması buradan geliyordu),
              // birleşim çapa sütunundan başlayıp birden çok sütunu kapsar. Birleşimdeki
              // diğer hücrelere hiç dokunulmuyor — Excel bir birleşimi görüntülerken
              // yalnızca çapa (sol-üst) hücrenin içeriğini ve stilini kullanır; ayrıca
              // hücre eklemek gerekmiyor ve şablonun başka hiçbir yerine dokunmuyor.
              String excelSetPersonnelValue(String sheetXml, String anchorRef, String mergeRangeEnd, String text, int style) {
                  String result = excelSetCell(sheetXml, anchorRef, text, style);
                  result = excelAddMerge(result, anchorRef + ":" + mergeRangeEnd);
                  return result;
              }

              int[] excelStyleCounts(String stylesXml) {
                  Matcher fm = Pattern.compile("<fonts count=\"(\\d+)\"").matcher(stylesXml);
                  fm.find();
                  Matcher xm = Pattern.compile("<cellXfs count=\"(\\d+)\"").matcher(stylesXml);
                  xm.find();
                  return new int[]{Integer.parseInt(fm.group(1)), Integer.parseInt(xm.group(1))};
              }

              ArrayList<String> excelListBlocks(String containerXml, String tag) {
                  ArrayList<String> out = new ArrayList<>();
                  Matcher m = Pattern.compile("<" + tag + "\\b[^>]*/>|<" + tag + "\\b[^>]*>.*?</" + tag + ">",
                          Pattern.DOTALL).matcher(containerXml);
                  while (m.find()) out.add(m.group());
                  return out;
              }

              String excelBlockByIndex(String stylesXml, String outerTag, String itemTag, int index) {
                  Matcher m = Pattern.compile("<" + outerTag + " count=\"\\d+\"[^>]*>(.*?)</" + outerTag + ">",
                          Pattern.DOTALL).matcher(stylesXml);
                  m.find();
                  return excelListBlocks(m.group(1), itemTag).get(index);
              }

              // Var olan bir stili (kenarlık/hizalama/dolgu aynı kalacak şekilde) sadece
              // yazı rengi kırmızı olan bir kopyasıyla klonlar. Aynı temel stil için ikinci
              // kez çağrılırsa önbellekten döner — aynı stilden onlarca Pazar günü olsa
              // bile styles.xml'e gereksiz tekrar eklenmez.
              class ExcelStylePatcher {
                  String original;
                  int fontCount, xfCount;
                  ArrayList<String> newFonts = new ArrayList<>();
                  ArrayList<String> newXfs = new ArrayList<>();
                  HashMap<Integer, Integer> redVariantCache = new HashMap<>();
                  Integer bigValueStyleCache = null;
                  HashMap<Integer, Integer> wrapVariantCache = new HashMap<>();

                  // KÖK NEDEN DÜZELTMESİ ("Index N out of bounds for length M"):
                  // excelSetCell() bir hücreye zaten yeni üretilmiş bir varyant stili
                  // uyguladıysa, o hücrenin GÜNCEL style index'i artık orijinal
                  // styles.xml'deki cellXfs listesinin (uzunluğu xfCount) DIŞINDA bir
                  // değer olabilir. Bu index tekrar bir getOrCreate...Variant çağrısına
                  // baseStyleIndex olarak verildiğinde, doğrudan original.get(index)
                  // çağırmak IndexOutOfBounds'a yol açıyordu. Bu iki yardımcı, index
                  // orijinal aralıktaysa "original"dan, DEĞİLSE (bu motorun kendi
                  // ürettiği bir varyantsa) newXfs/newFonts listesinden okur — böylece
                  // bir varyanttan yeni bir varyant türetilebilir, asla sınır dışına
                  // çıkılmaz. Border/fill/alignment mantığı DEĞİŞMEDİ, sadece "hangi
                  // listeden okunacağı" güvenli hale getirildi.
                  String xfBlockForIndex(int styleIndex) {
                      if (styleIndex >= 0 && styleIndex < xfCount) {
                          return excelBlockByIndex(original, "cellXfs", "xf", styleIndex);
                      }
                      int newIdx = styleIndex - xfCount;
                      if (newIdx >= 0 && newIdx < newXfs.size()) {
                          return newXfs.get(newIdx);
                      }
                      return excelBlockByIndex(original, "cellXfs", "xf", 0);
                  }

                  String fontBlockForIndex(int fontIndex) {
                      if (fontIndex >= 0 && fontIndex < fontCount) {
                          return excelBlockByIndex(original, "fonts", "font", fontIndex);
                      }
                      int newIdx = fontIndex - fontCount;
                      if (newIdx >= 0 && newIdx < newFonts.size()) {
                          return newFonts.get(newIdx);
                      }
                      return excelBlockByIndex(original, "fonts", "font", 0);
                  }

                  // "Kiminle" için: var olan bir stili (kenarlık/hizalama/renk aynı
                  // kalacak şekilde) yalnızca satır kaydırma (wrapText) açık bir
                  // kopyasıyla klonlar. Kırmızı Pazar varyantıyla birebir aynı yöntem.
                  int getOrCreateWrapVariant(int baseStyleIndex) {
                      Integer cached = wrapVariantCache.get(baseStyleIndex);
                      if (cached != null) return cached;

                      String baseXf = xfBlockForIndex(baseStyleIndex);
                      String newXf;
                      Matcher alignM = Pattern.compile("<alignment\\b[^/]*/>").matcher(baseXf);
                      if (alignM.find()) {
                          String align = alignM.group();
                          String newAlign = align.contains("wrapText")
                                  ? align.replaceFirst("wrapText=\"\\d\"", "wrapText=\"1\"")
                                  : align.substring(0, align.length() - 2) + " wrapText=\"1\"/>";
                          newXf = baseXf.substring(0, alignM.start()) + newAlign + baseXf.substring(alignM.end());
                      } else {
                          String withApply = baseXf.contains("applyAlignment=\"1\"") ? baseXf
                                  : baseXf.replace(" xfId=", " applyAlignment=\"1\" xfId=");
                          int closeAt = withApply.endsWith("/>") ? withApply.length() - 2 : withApply.indexOf("</xf>");
                          String tagEnd = withApply.endsWith("/>") ? "><alignment wrapText=\"1\"/></xf>" : "";
                          newXf = withApply.endsWith("/>")
                                  ? withApply.substring(0, closeAt) + tagEnd
                                  : withApply.substring(0, closeAt) + "<alignment wrapText=\"1\"/>" + withApply.substring(closeAt);
                      }
                      int newXfIndex = xfCount + newXfs.size();
                      newXfs.add(newXf);
                      wrapVariantCache.put(baseStyleIndex, newXfIndex);
                      return newXfIndex;
                  }

                  HashMap<Integer, Integer> topLeftWrapVariantCache = new HashMap<>();

                  // Tarih (+Kiminle) hücresi için: yatay=left, dikey=top, wrapText açık —
                  // "Excel'de hücreyi seçip Yazı Hizalama → SOL ÜST" ile elde edilen
                  // sonucun aynısı. Kenarlık/birleşim/satır yüksekliği DEĞİŞMEZ, sadece
                  // hizalama zorlanır (withForcedAlignment mevcut <alignment>'ı değiştirir
                  // ya da ekler — getOrCreateWrapVariant'tan farklı olarak yatay/dikeyi de
                  // açıkça sabitler).
                  int getOrCreateTopLeftWrapVariant(int baseStyleIndex) {
                      Integer cached = topLeftWrapVariantCache.get(baseStyleIndex);
                      if (cached != null) return cached;

                      String baseXf = xfBlockForIndex(baseStyleIndex);
                      String newXf = withForcedAlignment(baseXf, "horizontal=\"left\" vertical=\"top\" wrapText=\"1\"");
                      int newXfIndex = xfCount + newXfs.size();
                      newXfs.add(newXf);

                      topLeftWrapVariantCache.put(baseStyleIndex, newXfIndex);
                      return newXfIndex;
                  }


                  // 28pt, aynı yazı tipi ailesi (Calibri), dikey ortalanmış. Hazır
                  // şablon başlıklarının fontuna KESİNLİKLE dokunmaz — bu tamamen
                  // yeni, ayrı bir stildir. 4 alan için de aynı stil kullanıldığından
                  // yalnızca ilk çağrıda oluşturulur, sonrakiler önbellekten döner.
                  int getOrCreateBigValueStyle() {
                      if (bigValueStyleCache != null) return bigValueStyleCache;
                      String newFont = "<font><sz val=\"28\"/><color theme=\"1\"/><name val=\"Calibri\"/><family val=\"2\"/><scheme val=\"minor\"/></font>";
                      int newFontIndex = fontCount + newFonts.size();
                      newFonts.add(newFont);

                      String newXf = "<xf numFmtId=\"0\" fontId=\"" + newFontIndex + "\" fillId=\"0\" borderId=\"0\" xfId=\"0\""
                              + " applyFont=\"1\" applyAlignment=\"1\"><alignment horizontal=\"left\" vertical=\"center\"/></xf>";
                      int newXfIndex = xfCount + newXfs.size();
                      newXfs.add(newXf);

                      bigValueStyleCache = newXfIndex;
                      return newXfIndex;
                  }

                  ExcelStylePatcher(String stylesXml) {
                      original = removeDiagonalBorders(stylesXml);
                      int[] counts = excelStyleCounts(original);
                      fontCount = counts[0];
                      xfCount = counts[1];
                  }

                  // Şablondaki TÜM <border> tanımlarından yalnızca DİYAGONAL (çapraz)
                  // çizgi özelliklerini kaldırır: <border> etiketindeki diagonalUp/
                  // diagonalDown öznitelikleri silinir ve görünür bir diyagonal çizim
                  // tanımlayan <diagonal style="...">...</diagonal> alt öğesi, Excel'in
                  // zaten her border'da bulundurduğu zararsız boş <diagonal/> haline
                  // getirilir. left/right/top/bottom kenarlıklarına HİÇ dokunulmaz —
                  // bu sayede normal hücre çizgileri aynen korunur, sadece çapraz
                  // çizgi görünmez olur. Global bir metin düzeltmesi olduğundan,
                  // uygulamanın yazdığı/yazmadığı HER hücreye (özel gün hücreleri
                  // dahil) otomatik olarak yansır; yeni hücre/merge oluşturulmaz.
                  String removeDiagonalBorders(String stylesXml) {
                      String result = stylesXml;
                      result = result.replaceAll("\\s+diagonalUp=\"1\"", "");
                      result = result.replaceAll("\\s+diagonalDown=\"1\"", "");
                      result = Pattern.compile("<diagonal style=\"[^\"]*\"[^>]*>.*?</diagonal>", Pattern.DOTALL)
                              .matcher(result).replaceAll("<diagonal/>");
                      return result;
                  }

                  int getOrCreateRedVariant(int baseStyleIndex) {
                      Integer cached = redVariantCache.get(baseStyleIndex);
                      if (cached != null) return cached;

                      String baseXf = xfBlockForIndex(baseStyleIndex);
                      Matcher fIdM = Pattern.compile("fontId=\"(\\d+)\"").matcher(baseXf);
                      int baseFontId = fIdM.find() ? Integer.parseInt(fIdM.group(1)) : 0;
                      String baseFont = fontBlockForIndex(baseFontId);

                      String newFont;
                      Matcher colorM = Pattern.compile("<color[^/]*/>").matcher(baseFont);
                      if (colorM.find()) {
                          newFont = baseFont.substring(0, colorM.start()) + "<color rgb=\"FFFF0000\"/>" + baseFont.substring(colorM.end());
                      } else {
                          int insertAt = baseFont.lastIndexOf("</font>");
                          newFont = baseFont.substring(0, insertAt) + "<color rgb=\"FFFF0000\"/>" + baseFont.substring(insertAt);
                      }
                      int newFontIndex = fontCount + newFonts.size();
                      newFonts.add(newFont);

                      Matcher fontIdM = Pattern.compile("fontId=\"\\d+\"").matcher(baseXf);
                      fontIdM.find();
                      String newXf = baseXf.substring(0, fontIdM.start()) + "fontId=\"" + newFontIndex + "\"" + baseXf.substring(fontIdM.end());
                      int newXfIndex = xfCount + newXfs.size();
                      newXfs.add(newXf);

                      redVariantCache.put(baseStyleIndex, newXfIndex);
                      return newXfIndex;
                  }

                  HashMap<String, Integer> fontSizeVariantCache = new HashMap<>();

                  // Var olan bir stili (kenarlık/hizalama/dolgu AYNI kalacak şekilde) sadece
                  // yazı boyutu (punto) değiştirilmiş bir kopyasıyla klonlar —
                  // getOrCreateRedVariant ile BİREBİR aynı yöntem, renk yerine punto.
                  int getOrCreateFontSizeVariant(int baseStyleIndex, int sizePt) {
                      String cacheKey = baseStyleIndex + "_" + sizePt;
                      Integer cached = fontSizeVariantCache.get(cacheKey);
                      if (cached != null) return cached;

                      String baseXf = xfBlockForIndex(baseStyleIndex);
                      Matcher fIdM = Pattern.compile("fontId=\"(\\d+)\"").matcher(baseXf);
                      int baseFontId = fIdM.find() ? Integer.parseInt(fIdM.group(1)) : 0;
                      String baseFont = fontBlockForIndex(baseFontId);

                      String newFont = withFontSize(baseFont, sizePt);
                      int newFontIndex = fontCount + newFonts.size();
                      newFonts.add(newFont);

                      Matcher fontIdM = Pattern.compile("fontId=\"\\d+\"").matcher(baseXf);
                      fontIdM.find();
                      String newXf = baseXf.substring(0, fontIdM.start()) + "fontId=\"" + newFontIndex + "\"" + baseXf.substring(fontIdM.end());
                      if (!newXf.contains("applyFont=")) newXf = newXf.replace(" xfId=", " applyFont=\"1\" xfId=");
                      int newXfIndex = xfCount + newXfs.size();
                      newXfs.add(newXf);

                      fontSizeVariantCache.put(cacheKey, newXfIndex);
                      return newXfIndex;
                  }

                  HashMap<String, Integer> sizedCenteredVariantCache = new HashMap<>();

                  // Var olan bir stili (kenarlık/dolgu AYNI kalacak şekilde) istenen punto
                  // + yatay/dikey TAM ORTALANMIŞ hizalamayla klonlar. Hem X işareti hem de
                  // TOPLAM hücreleri (fiili çalışma/yemek) için ortak kullanılır.
                  int getOrCreateFontSizeCenteredVariant(int baseStyleIndex, int sizePt) {
                      String cacheKey = baseStyleIndex + "_" + sizePt + "_c";
                      Integer cached = sizedCenteredVariantCache.get(cacheKey);
                      if (cached != null) return cached;

                      String baseXf = xfBlockForIndex(baseStyleIndex);
                      Matcher fIdM = Pattern.compile("fontId=\"(\\d+)\"").matcher(baseXf);
                      int baseFontId = fIdM.find() ? Integer.parseInt(fIdM.group(1)) : 0;
                      String baseFont = fontBlockForIndex(baseFontId);

                      String newFont = withFontSize(baseFont, sizePt);
                      int newFontIndex = fontCount + newFonts.size();
                      newFonts.add(newFont);

                      Matcher fontIdM = Pattern.compile("fontId=\"\\d+\"").matcher(baseXf);
                      fontIdM.find();
                      String withFont = baseXf.substring(0, fontIdM.start()) + "fontId=\"" + newFontIndex + "\"" + baseXf.substring(fontIdM.end());
                      if (!withFont.contains("applyFont=")) withFont = withFont.replace(" xfId=", " applyFont=\"1\" xfId=");

                      String newXf = withForcedAlignment(withFont, "horizontal=\"center\" vertical=\"center\"");
                      int newXfIndex = xfCount + newXfs.size();
                      newXfs.add(newXf);

                      sizedCenteredVariantCache.put(cacheKey, newXfIndex);
                      return newXfIndex;
                  }

                  HashMap<Integer, Integer> xMarkVariantCache = new HashMap<>();

                  // Karşı güne yazılan OTEL x işareti için: 22pt, hem yatay hem dikey TAM
                  // ORTALANMIŞ, kenarlık/dolgu AYNI kalan bağımsız bir stil.
                  int getOrCreateXMarkVariant(int baseStyleIndex) {
                      Integer cached = xMarkVariantCache.get(baseStyleIndex);
                      if (cached != null) return cached;
                      int v = getOrCreateFontSizeCenteredVariant(baseStyleIndex, 22);
                      xMarkVariantCache.put(baseStyleIndex, v);
                      return v;
                  }

                  // Bir <font> bloğunun boyutunu (<sz val="..."/>) değiştirir; yoksa ekler.
                  String withFontSize(String font, int sizePt) {
                      Matcher szM = Pattern.compile("<sz val=\"[^\"]*\"\\s*/>").matcher(font);
                      if (szM.find()) {
                          return font.substring(0, szM.start()) + "<sz val=\"" + sizePt + "\"/>" + font.substring(szM.end());
                      }
                      int insertAt = font.indexOf("<font>") + "<font>".length();
                      return font.substring(0, insertAt) + "<sz val=\"" + sizePt + "\"/>" + font.substring(insertAt);
                  }

                  // Bir xf bloğuna istenen hizalamayı uygular: var olan <alignment> varsa
                  // değiştirir, yoksa ekler. getOrCreateWrapVariant'taki AYNI self-closing/
                  // non-self-closing xf ayrımını kullanır.
                  String withForcedAlignment(String xf, String alignmentAttrs) {
                      Matcher alignM = Pattern.compile("<alignment\\b[^/]*/>").matcher(xf);
                      if (alignM.find()) {
                          return xf.substring(0, alignM.start()) + "<alignment " + alignmentAttrs + "/>" + xf.substring(alignM.end());
                      }
                      String withApply = xf.contains("applyAlignment=\"1\"") ? xf
                              : xf.replace(" xfId=", " applyAlignment=\"1\" xfId=");
                      if (withApply.endsWith("/>")) {
                          return withApply.substring(0, withApply.length() - 2) + "><alignment " + alignmentAttrs + "/></xf>";
                      }
                      int closeAt = withApply.indexOf("</xf>");
                      return withApply.substring(0, closeAt) + "<alignment " + alignmentAttrs + "/>" + withApply.substring(closeAt);
                  }

                  String build() {
                      String result = original;
                      if (!newFonts.isEmpty()) {
                          int total = fontCount + newFonts.size();
                          Matcher cm = Pattern.compile("<fonts count=\"\\d+\"").matcher(result);
                          cm.find();
                          result = result.substring(0, cm.start()) + "<fonts count=\"" + total + "\"" + result.substring(cm.end());
                          StringBuilder sb = new StringBuilder();
                          for (String f : newFonts) sb.append(f);
                          int insertAt = result.indexOf("</fonts>");
                          result = result.substring(0, insertAt) + sb + result.substring(insertAt);
                      }
                      if (!newXfs.isEmpty()) {
                          int total = xfCount + newXfs.size();
                          Matcher cm = Pattern.compile("<cellXfs count=\"\\d+\"").matcher(result);
                          cm.find();
                          result = result.substring(0, cm.start()) + "<cellXfs count=\"" + total + "\"" + result.substring(cm.end());
                          StringBuilder sb = new StringBuilder();
                          for (String x : newXfs) sb.append(x);
                          int insertAt = result.indexOf("</cellXfs>");
                          result = result.substring(0, insertAt) + sb + result.substring(insertAt);
                      }
                      return result;
                  }
              }

