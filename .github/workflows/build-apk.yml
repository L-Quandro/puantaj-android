              void monthly() {
                  currentPage = "monthly";
                  page("Aylık Rapor", "Tamamlanmış kayıtlar ve detaylar.");

                  if (records.isEmpty()) {
                      root.addView(text("Henüz kaydedilmiş veri yok.", 14, TEXT_MUTED, false));
                  } else {
                      for (String r : new ArrayList<>(records)) {
                          String[] a = r.split("\\|", -1);
                          if (a.length < 7) continue;

                          LinearLayout c = card();
                          c.addView(text(formatTrainName(a[3]), 16, NEON_GREEN, true));
                          c.addView(text("Tarih: " + a[1] + " • Personel: " + a[2], 13, TEXT_PRIMARY, false));

                          if (a[6].equals("DONE")) {
                              c.addView(text("Başlangıç: " + a[4] + " (Tesellüm: " + a[5] + ")", 12, TEXT_MUTED, false));
                              if (a.length > 8) c.addView(text("Bitiş: " + a[7] + " " + a[8] + " (Teslim: " + a[9] + ")", 12, TEXT_MUTED, false));
                              if (a.length > 10) c.addView(text("Varış/Hesaplama: " + a[10], 12, NEON_PURPLE, false));
                              
                              Button editBtn = choice("Düzenle");
                              c.addView(editBtn);
                              editBtn.setOnClickListener(v -> editCompletedRecord(r));
                          } else {
                              c.addView(text("Durum: " + a[6], 12, Color.parseColor("#FFD700"), true));
                          }
                          root.addView(c);
                      }
                  }

                  Button back = choice("Ana Menüye Dön"); root.addView(back); back.setOnClickListener(v -> home());
              }

              void chooseTrain(TextInputLayout target, String[] trains, String titleText) {
                  AlertDialog dialog = new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                          .setTitle(titleText).setItems(trains, (d, which) -> {
                              EditText e = target.getEditText(); if (e != null) e.setText(trains[which]); d.dismiss();
                          }).show();
              }

              int compareDates(String first, String second) { return first.compareTo(second); }

              String addThirtyMinutes(String dateStr, String timeStr) {
                  try {
                      SimpleDateFormat sdf = new SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault());
                      Date d = sdf.parse(dateStr + " " + timeStr);
                      if (d == null) return dateStr + " " + timeStr;
                      Calendar cal = Calendar.getInstance();
                      cal.setTime(d);
                      cal.add(Calendar.MINUTE, 30);
                      return sdf.format(cal.getTime());
                  } catch (Exception e) {
                      return dateStr + " " + timeStr;
                  }
              }

              String addDays(String dateStr, int days) {
                  try {
                      SimpleDateFormat sdf = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault());
                      Date d = sdf.parse(dateStr);
                      if (d == null) return dateStr;
                      Calendar cal = Calendar.getInstance();
                      cal.setTime(d);
                      cal.add(Calendar.DAY_OF_MONTH, days);
                      return sdf.format(cal.getTime());
                  } catch (Exception e) {
                      return dateStr;
                  }
              }

              void load() {
                  String all = prefs.getString("records", "");
                  if (all.isEmpty()) return;
                  for (String raw : all.split("\\n", -1)) {
                      if (!raw.trim().isEmpty()) records.add(raw);
                  }
              }

              void persist() {
                  StringBuilder out = new StringBuilder();
                  for (String r : records) { if (out.length() > 0) out.append("\n"); out.append(r); }
                  prefs.edit().putString("records", out.toString()).apply();
              }
          }
