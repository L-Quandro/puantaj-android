name: 4011 Model APK v0.6.3 Full

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v5

      - name: Android projesini oluştur
        shell: bash
        run: |
          set -e
          mkdir -p puantaj/app/src/main/java/com/furkan/puantaj
          mkdir -p puantaj/app/src/main/res/values
          mkdir -p puantaj/app/src/main/res/drawable-nodpi
          mkdir -p puantaj/app/src/main/res/drawable
          mkdir -p puantaj/app/src/main/res/mipmap-anydpi-v26

          test -s "$GITHUB_WORKSPACE/puantaj_app_icon.png" || touch "$GITHUB_WORKSPACE/puantaj_app_icon.png"
          cp "$GITHUB_WORKSPACE/puantaj_app_icon.png" puantaj/app/src/main/res/drawable-nodpi/puantaj_icon.png 2>/dev/null || true

          cat > puantaj/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PuantajAndroid"
          include(":app")
          EOF

          cat > puantaj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > puantaj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > puantaj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.furkan.puantaj'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.furkan.puantaj'
                  minSdk 26
                  targetSdk 35
                  versionCode 38
                  versionName '0.6.4'
              }
          }
          dependencies {
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > puantaj/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/Theme.Puantaj"
                  android:label="4011 Model"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > puantaj/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/puantaj_icon_background" />
              <foreground android:drawable="@drawable/puantaj_icon_foreground" />
          </adaptive-icon>
          EOF

          cat > puantaj/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/puantaj_icon_background" />
              <foreground android:drawable="@drawable/puantaj_icon_foreground" />
          </adaptive-icon>
          EOF

          cat > puantaj/app/src/main/res/drawable/puantaj_icon_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/puantaj_icon"
              android:gravity="fill" />
          EOF

          cat > puantaj/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="puantaj_icon_background">#0B0719</color>
          </resources>
          EOF

          cat > puantaj/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.Puantaj" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0B0719</item>
                  <item name="android:navigationBarColor">#0B0719</item>
                  <item name="colorPrimary">#9D00FF</item>
                  <item name="colorSecondary">#39FF14</item>
              </style>
          </resources>
          EOF

          cat > puantaj/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">4011 Model</string>
          </resources>
          EOF

          cat > puantaj/app/src/main/java/com/furkan/puantaj/MainActivity.java <<'EOF'
          package com.furkan.puantaj;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.DatePickerDialog;
          import android.app.TimePickerDialog;
          import android.content.Context;
          import android.content.DialogInterface;
          import android.content.SharedPreferences;
          import android.content.res.ColorStateList;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.CompoundButton;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import android.window.OnBackInvokedDispatcher;

          import com.google.android.material.textfield.TextInputEditText;
          import com.google.android.material.textfield.TextInputLayout;

          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.Date;
          import java.util.Locale;
          import java.util.UUID;

          public class MainActivity extends Activity {

              private LinearLayout root;
              private SharedPreferences prefs;
              private ArrayList<String> records = new ArrayList<>();

              private String selectedStart = "";
              private String selectedStartDate = "";
              private String selectedFinish = "";
              private String selectedFinishDate = "";
              private String currentPage = "home";

              private static final String DEFAULT_PEOPLE = "Hazım|Ender|Yücel|Emirhan|Melike";

              private int SPACE_BG = Color.parseColor("#0B0719");
              private int CARD_BG = Color.parseColor("#120F22");
              private int CARD_INNER = Color.parseColor("#18142D");
              private int NEON_PURPLE = Color.parseColor("#9D00FF");
              private int NEON_GREEN = Color.parseColor("#39FF14");
              private int TEXT_PRIMARY = Color.parseColor("#FFFFFF");
              private int TEXT_MUTED = Color.parseColor("#8A87A0");

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("puantaj", Context.MODE_PRIVATE);
                  loadDataFromStorage();

                  if (Build.VERSION.SDK_INT >= 33) {
                      getOnBackInvokedDispatcher().registerOnBackInvokedCallback(
                              OnBackInvokedDispatcher.PRIORITY_DEFAULT,
                              this::navigateBack
                      );
                  }

                  showHomeScreen();
              }

              @Override
              public void onBackPressed() {
                  navigateBack();
              }

              private void navigateBack() {
                  if ("home".equals(currentPage)) {
                      super.onBackPressed();
                  } else if ("complete".equals(currentPage) || "continue".equals(currentPage)) {
                      showOngoingScreen();
                  } else {
                      showHomeScreen();
                  }
              }

              private ArrayList<String> ownerList() {
                  String raw = prefs.getString("owner_list", DEFAULT_PEOPLE);
                  ArrayList<String> list = new ArrayList<>();
                  String[] split = raw.split("\\|", -1);
                  for (String item : split) {
                      String trimmed = item.trim();
                      if (!trimmed.isEmpty() && !list.contains(trimmed)) {
                          list.add(trimmed);
                      }
                  }
                  if (list.isEmpty()) {
                      String[] defaultSplit = DEFAULT_PEOPLE.split("\\|", -1);
                      for (String item : defaultSplit) {
                          list.add(item);
                      }
                  }
                  return list;
              }

              private void saveOwnerList(ArrayList<String> list) {
                  StringBuilder builder = new StringBuilder();
                  for (String item : list) {
                      if (builder.length() > 0) {
                          builder.append("|");
                      }
                      builder.append(item.replace("|", ""));
                  }
                  prefs.edit().putString("owner_list", builder.toString()).apply();
              }

              private boolean useOwnerList() {
                  return prefs.getBoolean("use_owner_list", true);
              }

              private boolean autoContinuePerson() {
                  return prefs.getBoolean("auto_continue_person", true);
              }

              private int getHotelNightsMax() {
                  return prefs.getInt("hotel_nights_max", 4);
              }

              private void rememberOwner(String owner) {
                  if (owner != null && !owner.trim().isEmpty()) {
                      prefs.edit().putString("last_owner", owner.trim()).apply();
                  }
              }

              private class OwnerPicker {
                  public final TextInputLayout input;
                  public final CheckBox modeCheck;
                  public final Button chooser;
                  public final String label;
                  public final boolean listFirst;
                  public String selected = "";

                  public OwnerPicker(LinearLayout parent, String label) {
                      this(parent, label, true);
                  }

                  public OwnerPicker(LinearLayout parent, String label, boolean listFirst) {
                      this.label = label;
                      this.listFirst = listFirst;

                      chooser = createChoiceButton(label + " • Seç");
                      parent.addView(chooser);

                      modeCheck = new CheckBox(MainActivity.this);
                      if (listFirst) {
                          modeCheck.setText("Manuel gir");
                      } else {
                          modeCheck.setText("Listeden seç");
                      }
                      modeCheck.setTextSize(12);
                      modeCheck.setTextColor(TEXT_MUTED);
                      modeCheck.setButtonTintList(ColorStateList.valueOf(NEON_PURPLE));
                      parent.addView(modeCheck);

                      input = createInputField(label);
                      parent.addView(input);

                      if (listFirst) {
                          chooser.setVisibility(View.VISIBLE);
                          input.setVisibility(View.GONE);
                          modeCheck.setChecked(false);
                      } else {
                          chooser.setVisibility(View.GONE);
                          input.setVisibility(View.VISIBLE);
                          modeCheck.setChecked(false);
                      }

                      chooser.setOnClickListener(new View.OnClickListener() {
                          @Override
                          public void onClick(View v) {
                              showOwnerChoices();
                          }
                      });

                      modeCheck.setOnCheckedChangeListener(new CompoundButton.OnCheckedChangeListener() {
                          @Override
                          public void onCheckedChanged(CompoundButton buttonView, boolean isChecked) {
                              if (listFirst) {
                                  if (isChecked) {
                                      input.setVisibility(View.VISIBLE);
                                      chooser.setVisibility(View.GONE);
                                      selected = "";
                                      if (input.getEditText() != null) {
                                          input.getEditText().setText("");
                                      }
                                  } else {
                                      input.setVisibility(View.GONE);
                                      chooser.setVisibility(View.VISIBLE);
                                  }
                              } else {
                                  if (isChecked) {
                                      chooser.setVisibility(View.GONE);
                                      input.setVisibility(View.VISIBLE);
                                      selected = "";
                                      showOwnerChoices();
                                  } else {
                                      chooser.setVisibility(View.GONE);
                                      input.setVisibility(View.VISIBLE);
                                  }
                              }
                          }
                      });
                  }

                  public void showOwnerChoices() {
                      if (!useOwnerList()) {
                          Toast.makeText(MainActivity.this, "Hazır kişi listesi kapalı.", Toast.LENGTH_SHORT).show();
                          modeCheck.setChecked(false);
                          if (listFirst) {
                              input.setVisibility(View.GONE);
                          }
                          return;
                      }
                      ArrayList<String> list = ownerList();
                      if (list.isEmpty()) {
                          return;
                      }
                      final String[] items = list.toArray(new String[0]);
                      int checkedItem = list.indexOf(selected);

                      AlertDialog.Builder builder = new AlertDialog.Builder(MainActivity.this, android.R.style.Theme_DeviceDefault_Dialog_Alert);
                      builder.setTitle(label);
                      builder.setSingleChoiceItems(items, checkedItem, new DialogInterface.OnClickListener() {
                          @Override
                          public void onClick(DialogInterface dialog, int which) {
                              selected = items[which];
                              chooser.setText(label + " • " + selected);
                              if (listFirst) {
                                  modeCheck.setChecked(false);
                              } else {
                                  input.setVisibility(View.VISIBLE);
                                  if (input.getEditText() != null) {
                                      input.getEditText().setText(selected);
                                  }
                                  chooser.setVisibility(View.GONE);
                                  modeCheck.setChecked(false);
                              }
                              dialog.dismiss();
                          }
                      });
                      builder.show();
                  }

                  public String getValue() {
                      if (listFirst) {
                          if (modeCheck.isChecked()) {
                              return valueOfInput(input);
                          } else {
                              return selected == null ? "" : selected;
                          }
                      } else {
                          if (modeCheck.isChecked()) {
                              return selected == null ? "" : selected;
                          } else {
                              return valueOfInput(input);
                          }
                      }
                  }

                  public void setValue(String value) {
                      if (value == null) {
                          value = "";
                      }
                      value = value.trim();
                      if (useOwnerList() && ownerList().contains(value)) {
                          selected = value;
                          chooser.setText(label + " • " + selected);
                          if (listFirst) {
                              modeCheck.setChecked(false);
                          } else {
                              input.setVisibility(View.VISIBLE);
                              if (input.getEditText() != null) {
                                  input.getEditText().setText(selected);
                              }
                              chooser.setVisibility(View.GONE);
                              modeCheck.setChecked(false);
                          }
                      } else {
                          selected = "";
                          modeCheck.setChecked(listFirst);
                          if (input.getEditText() != null) {
                              input.getEditText().setText(value);
                          }
                      }
                  }
              }

              private int dpToPx(float dp) {
                  float density = getResources().getDisplayMetrics().density;
                  return (int) (dp * density + 0.5f);
              }

              private String formatTrainName(String tName) {
                  if (tName == null) {
                      return "";
                  }
                  String upper = tName.toUpperCase(new Locale("tr", "TR"));
                  if (upper.startsWith("İPTAL") || upper.contains("TATİL") || upper.contains("GÜN") || upper.contains("İZİN") || upper.startsWith("DESTEK")) {
                      return upper;
                  }
                  return "TREN " + upper;
              }

              private boolean isSpecialLabel(String value) {
                  if (value == null || value.isEmpty()) {
                      return false;
                  }
                  return value.equals("Hafta Tatili") ||
                         value.equals("Boş Gün") ||
                         value.equals("Yıllık İzin") ||
                         value.startsWith("İptal") ||
                         value.startsWith("Destek");
              }

              private GradientDrawable createShape(int color, float radius, int strokeColor, int strokeWidth) {
                  GradientDrawable shape = new GradientDrawable();
                  shape.setColor(color);
                  shape.setCornerRadius(dpToPx(radius));
                  if (strokeWidth > 0) {
                      shape.setStroke(dpToPx(strokeWidth), strokeColor);
                  }
                  return shape;
              }

              private TextView createTextView(String text, float size, int color, boolean bold) {
                  TextView tv = new TextView(this);
                  tv.setText(text);
                  tv.setTextSize(size);
                  tv.setTextColor(color);
                  if (bold) {
                      tv.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  } else {
                      tv.setTypeface(Typeface.DEFAULT, Typeface.NORMAL);
                  }
                  return tv;
              }

              private TextView createTitle(String text) {
                  TextView tv = createTextView(text, 24, TEXT_PRIMARY, true);
                  tv.setPadding(0, 0, 0, dpToPx(4));
                  return tv;
              }

              private TextView createSubtitle(String text) {
                  TextView tv = createTextView(text, 13, TEXT_MUTED, false);
                  tv.setPadding(0, 0, 0, dpToPx(12));
                  return tv;
              }

              private TextView createSectionHeader(String text) {
                  TextView tv = createTextView(text.toUpperCase(Locale.getDefault()), 11, NEON_PURPLE, true);
                  tv.setLetterSpacing(0.08f);
                  tv.setPadding(dpToPx(4), dpToPx(8), dpToPx(4), dpToPx(6));
                  return tv;
              }

              private LinearLayout createCardLayout() {
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setPadding(dpToPx(12), dpToPx(10), dpToPx(12), dpToPx(10));
                  card.setBackground(createShape(CARD_BG, 18, Color.parseColor("#251D3A"), 1));
                  
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                  );
                  params.setMargins(0, 0, 0, dpToPx(8));
                  card.setLayoutParams(params);
                  return card;
              }

              private TextInputLayout createInputField(String hint) {
                  TextInputLayout box = new TextInputLayout(this);
                  box.setHint(hint);
                  box.setBoxBackgroundMode(TextInputLayout.BOX_BACKGROUND_OUTLINE);
                  box.setBoxCornerRadii(dpToPx(12), dpToPx(12), dpToPx(12), dpToPx(12));
                  box.setBoxStrokeColor(NEON_PURPLE);
                  box.setHintTextColor(ColorStateList.valueOf(TEXT_MUTED));
                  box.setPadding(0, 0, 0, dpToPx(4));

                  TextInputEditText edit = new TextInputEditText(box.getContext());
                  edit.setSingleLine(true);
                  edit.setTextSize(15);
                  edit.setTextColor(TEXT_PRIMARY);

                  LinearLayout.LayoutParams editParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dpToPx(46)
                  );
                  box.addView(edit, editParams);
                  return box;
              }

              private String valueOfInput(TextInputLayout box) {
                  if (box == null || box.getEditText() == null || box.getEditText().getText() == null) {
                      return "";
                  }
                  return box.getEditText().getText().toString().trim();
              }

              private Button createActionButton(String label, boolean isPrimary) {
                  Button btn = new Button(this);
                  btn.setText(label);
                  btn.setTextSize(14);
                  btn.setTextColor(isPrimary ? Color.BLACK : TEXT_PRIMARY);
                  btn.setAllCaps(false);
                  btn.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  btn.setMinHeight(dpToPx(44));
                  btn.setPadding(dpToPx(10), 0, dpToPx(10), 0);

                  if (isPrimary) {
                      btn.setBackground(createShape(NEON_PURPLE, 14, 0, 0));
                  } else {
                      btn.setBackground(createShape(CARD_INNER, 14, NEON_GREEN, 1));
                  }

                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dpToPx(46)
                  );
                  params.setMargins(0, dpToPx(4), 0, dpToPx(6));
                  btn.setLayoutParams(params);
                  return btn;
              }

              private Button createChoiceButton(String label) {
                  Button btn = new Button(this);
                  btn.setText(label);
                  btn.setTextSize(13);
                  btn.setTextColor(TEXT_PRIMARY);
                  btn.setAllCaps(false);
                  btn.setGravity(Gravity.CENTER);
                  btn.setBackground(createShape(CARD_INNER, 12, Color.parseColor("#3B3259"), 1));

                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dpToPx(42)
                  );
                  params.setMargins(0, dpToPx(2), 0, dpToPx(4));
                  btn.setLayoutParams(params);
                  return btn;
              }

              private void prepareBasePage(String heading, String description) {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);

                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dpToPx(16), dpToPx(16), dpToPx(16), dpToPx(20));
                  root.setBackgroundColor(SPACE_BG);

                  scroll.addView(root);
                  setContentView(scroll);

                  root.addView(createTitle(heading));
                  if (!description.isEmpty()) {
                      root.addView(createSubtitle(description));
                  }
              }

              private LinearLayout createHorizontalRow() {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setBaselineAligned(false);
                  return row;
              }

              private void showHomeScreen() {
                  currentPage = "home";
                  prepareBasePage("4011 Model", "TCDD Taşımacılık Puantaj ve Görev Takip");

                  LinearLayout heroCard = createCardLayout();
                  heroCard.setBackground(createShape(Color.parseColor("#150030"), 20, NEON_PURPLE, 1));
                  heroCard.addView(createTextView("GÜNCEL DURUM", 11, NEON_PURPLE, true));

                  SimpleDateFormat sdf = new SimpleDateFormat("dd MMMM yyyy EEEE", new Locale("tr", "TR"));
                  heroCard.addView(createTextView(sdf.format(new Date()), 18, TEXT_PRIMARY, true));

                  int openCount = 0;
                  for (String r : records) {
                      String[] parts = r.split("\\|", -1);
                      if (parts.length >= 7 && (parts[6].equals("OPEN") || parts[6].equals("HOTEL"))) {
                          openCount++;
                      }
                  }

                  heroCard.addView(createTextView(openCount + " aktif görev / Toplam " + records.size() + " kayıt", 13, NEON_GREEN, false));
                  root.addView(heroCard);

                  Button newRecordBtn = createActionButton("Yeni Görev Başlat", true);
                  root.addView(newRecordBtn);
                  newRecordBtn.setOnClickListener(v -> showNewRecordScreen());

                  LinearLayout rowBtns = createHorizontalRow();
                  Button ongoingBtn = createActionButton("Devam Eden (" + openCount + ")", false);
                  Button monthlyBtn = createActionButton("Aylık Rapor", false);

                  LinearLayout.LayoutParams p1 = new LinearLayout.LayoutParams(0, dpToPx(46), 1.0f);
                  p1.setMargins(0, dpToPx(4), dpToPx(4), dpToPx(6));
                  ongoingBtn.setLayoutParams(p1);

                  LinearLayout.LayoutParams p2 = new LinearLayout.LayoutParams(0, dpToPx(46), 1.0f);
                  p2.setMargins(dpToPx(4), dpToPx(4), 0, dpToPx(6));
                  monthlyBtn.setLayoutParams(p2);

                  rowBtns.addView(ongoingBtn);
                  rowBtns.addView(monthlyBtn);
                  root.addView(rowBtns);

                  ongoingBtn.setOnClickListener(v -> showOngoingScreen());
                  monthlyBtn.setOnClickListener(v -> showMonthlyReportScreen());

                  Button settingsBtn = createChoiceButton("⚙ Ayarlar");
                  root.addView(settingsBtn);
                  settingsBtn.setOnClickListener(v -> showSettingsScreen());
              }

              private void showNewRecordScreen() {
                  currentPage = "newRecord";
                  prepareBasePage("Yeni Görev", "Yeni çalışma verisi oluştur.");

                  selectedStartDate = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault()).format(new Date());
                  selectedStart = "";

                  LinearLayout mainCard = createCardLayout();
                  mainCard.addView(createSectionHeader("Tarih ve Saat"));

                  LinearLayout timeRow = createHorizontalRow();
                  Button dateButton = createChoiceButton("Tarih: " + selectedStartDate);
                  Button startButton = createChoiceButton("Saat: Seçilmedi");

                  LinearLayout.LayoutParams tp1 = new LinearLayout.LayoutParams(0, dpToPx(42), 1.0f);
                  tp1.setMargins(0, 0, dpToPx(4), dpToPx(4));
                  dateButton.setLayoutParams(tp1);

                  LinearLayout.LayoutParams tp2 = new LinearLayout.LayoutParams(0, dpToPx(42), 1.0f);
                  tp2.setMargins(dpToPx(4), 0, 0, dpToPx(4));
                  startButton.setLayoutParams(tp2);

                  timeRow.addView(dateButton);
                  timeRow.addView(startButton);
                  mainCard.addView(timeRow);

                  dateButton.setOnClickListener(v -> chooseDate(dateButton, true));
                  startButton.setOnClickListener(v -> chooseTime(startButton, true));

                  mainCard.addView(createSectionHeader("Görev Detayları"));
                  LinearLayout inputRow = createHorizontalRow();
                  TextInputLayout trainInput = createInputField("Tren No");
                  TextInputLayout personInput = createInputField("Kiminle");

                  LinearLayout.LayoutParams ip1 = new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1.0f);
                  ip1.setMargins(0, 0, dpToPx(4), 0);
                  trainInput.setLayoutParams(ip1);

                  LinearLayout.LayoutParams ip2 = new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1.0f);
                  ip2.setMargins(dpToPx(4), 0, 0, 0);
                  personInput.setLayoutParams(ip2);

                  inputRow.addView(trainInput);
                  inputRow.addView(personInput);
                  mainCard.addView(inputRow);

                  LinearLayout trainButtons = createHorizontalRow();
                  Button outboundTrain = createChoiceButton("Gidiş Trenleri");
                  Button returnTrain = createChoiceButton("Dönüş Trenleri");

