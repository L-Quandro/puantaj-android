name: Puantaj APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Android projesini oluştur
        shell: bash
        run: |
          set -e

          mkdir -p puantaj/app/src/main/java/com/furkan/puantaj
          mkdir -p puantaj/app/src/main/res/values

          cat > puantaj/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PuantajAndroid"
          include(":app")
          EOF

          cat > puantaj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > puantaj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > puantaj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.furkan.puantaj'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.furkan.puantaj'
                  minSdk 26
                  targetSdk 35
                  versionCode 2
                  versionName '0.2'
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > puantaj/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/Theme.Puantaj"
                  android:label="Puantaj"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > puantaj/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.Puantaj" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
              </style>
          </resources>
          EOF

          cat > puantaj/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Puantaj</string>
          </resources>
          EOF

          cat > puantaj/app/src/main/java/com/furkan/puantaj/MainActivity.java <<'EOF'
          package com.furkan.puantaj;

          import android.app.*;
          import android.os.Bundle;
          import android.content.*;
          import android.graphics.Color;
          import android.view.*;
          import android.widget.*;
          import java.text.*;
          import java.util.*;

          public class MainActivity extends Activity {
              LinearLayout root;
              SharedPreferences prefs;
              ArrayList<String> records = new ArrayList<>();

              String selectedDate = "";
              String selectedStart = "";

              public void onCreate(Bundle b) {
                  super.onCreate(b);
                  prefs = getSharedPreferences("puantaj", MODE_PRIVATE);
                  load();
                  home();
              }

              TextView title(String s) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(27);
                  t.setTypeface(null, 1);
                  t.setPadding(0, 0, 0, 18);
                  return t;
              }

              TextView info(String s) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(16);
                  t.setPadding(0, 8, 0, 14);
                  return t;
              }

              Button button(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setAllCaps(false);
                  b.setTextSize(16);
                  b.setPadding(8, 12, 8, 12);
                  return b;
              }

              EditText field(String hint) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setSingleLine(true);
                  e.setTextSize(17);
                  e.setPadding(0, 8, 0, 8);
                  return e;
              }

              void page(String s) {
                  ScrollView scroll = new ScrollView(this);
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(20, 20, 20, 20);
                  scroll.addView(root);
                  setContentView(scroll);
                  root.addView(title(s));
              }

              void home() {
                  page("PUANTAJ");
                  root.addView(info("Günlük görev kayıtlarını telefondan yönet."));

                  Button n = button("Yeni Görev / Tren Al");
                  root.addView(n);
                  n.setOnClickListener(v -> newRecord());

                  Button o = button("Devam Eden Kayıtlar");
                  root.addView(o);
                  o.setOnClickListener(v -> ongoing());

                  Button m = button("Aylık Kayıtlar");
                  root.addView(m);
                  m.setOnClickListener(v -> monthly());

                  root.addView(info("Görevi başlatıp uygulamayı tamamen kapatabilirsin. Teslim saatini daha sonra girebilirsin."));
              }

              void newRecord() {
                  page("Yeni Görev / Tren Al");

                  selectedDate = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault()).format(new Date());
                  selectedStart = "";

                  Button dateButton = button("Tarih: " + selectedDate);
                  root.addView(dateButton);
                  dateButton.setOnClickListener(v -> chooseDate(dateButton, false));

                  EditText person = field("Kiminle gittin?");
                  root.addView(person);

                  EditText train = field("Tren no");
                  root.addView(train);

                  Button startButton = button("Görev alış / başlangıç saati seç");
                  root.addView(startButton);
                  startButton.setOnClickListener(v -> chooseTime(startButton, true));

                  Button save = button("Görevi Başlat ve Kaydet");
                  root.addView(save);
                  save.setOnClickListener(v -> {
                      if (person.getText().toString().trim().isEmpty() ||
                          train.getText().toString().trim().isEmpty() ||
                          selectedStart.isEmpty()) {
                          Toast.makeText(this, "Kiminle, tren no ve başlangıç saati gerekli.", Toast.LENGTH_LONG).show();
                          return;
                      }

                      String record =
                              UUID.randomUUID() + "|" +
                              selectedDate + "|" +
                              person.getText().toString().trim() + "|" +
                              train.getText().toString().trim() + "|" +
                              selectedStart + "|" +
                              selectedStart + "|OPEN";

                      records.add(record);
                      persist();

                      Toast.makeText(this, "Görev kaydedildi. Uygulamayı kapatabilirsin.", Toast.LENGTH_LONG).show();
                      home();
                  });

                  Button cancel = button("Vazgeç");
                  root.addView(cancel);
                  cancel.setOnClickListener(v -> home());
              }

              void chooseDate(Button target, boolean homeDate) {
                  Calendar c = Calendar.getInstance();

                  DatePickerDialog d = new DatePickerDialog(
                      this,
                      (view, year, month, day) -> {
                          String value = String.format(Locale.getDefault(), "%02d.%02d.%04d", day, month + 1, year);
                          if (!homeDate) {
                              selectedDate = value;
                              target.setText("Tarih: " + value);
                          }
                      },
                      c.get(Calendar.YEAR),
                      c.get(Calendar.MONTH),
                      c.get(Calendar.DAY_OF_MONTH)
                  );
                  d.show();
              }

              void chooseTime(Button target, boolean start) {
                  Calendar c = Calendar.getInstance();

                  TimePickerDialog d = new TimePickerDialog(
                      this,
                      (view, hour, minute) -> {
                          String value = String.format(Locale.getDefault(), "%02d:%02d", hour, minute);
                          if (start) {
                              selectedStart = value;
                              target.setText("Görev alış / başlangıç: " + value);
                          }
                      },
                      c.get(Calendar.HOUR_OF_DAY),
                      c.get(Calendar.MINUTE),
                      true
                  );
                  d.show();
              }

              void ongoing() {
                  page("Devam Eden Kayıtlar");

                  boolean found = false;

                  for (String r : new ArrayList<>(records)) {
                      if (r.endsWith("|OPEN")) {
                          found = true;
                          String[] a = r.split("\\|", -1);

                          String person = a.length > 2 ? a[2] : "";
                          String train = a.length > 3 ? a[3] : "";
                          String date = a.length > 1 ? a[1] : "";

                          Button b = button(date + " • Tren " + train + " • " + person);
                          root.addView(b);
                          b.setOnClickListener(v -> complete(r));
                      }
                  }

                  if (!found) root.addView(info("Devam eden kayıt yok."));

                  Button back = button("Ana Sayfa");
                  root.addView(back);
                  back.setOnClickListener(v -> home());
              }

              void complete(String r) {
                  String[] a = r.split("\\|", -1);

                  page("Görev Tamamla");

                  root.addView(info(
                      "Tarih: " + a[1] +
                      "\nTren: " + a[3] +
                      "\nKiminle: " + a[2] +
                      "\nGörev alış / başlangıç: " + a[4]
                  ));

                  final String[] finish = {""};
                  final String[] homeDate = {""};
                  final String[] homeIn = {""};

                  Button finishButton = button("Görev bitiş / teslim saati seç");
                  root.addView(finishButton);
                  finishButton.setOnClickListener(v -> chooseFinishTime(finishButton, finish));

                  EditText owner = field("Teslim / tesellüm sahibi");
                  root.addView(owner);

                  Button homeDateButton = button("Eve giriş tarihi seç");
                  root.addView(homeDateButton);
                  homeDateButton.setOnClickListener(v -> chooseHomeDate(homeDateButton, homeDate));

                  Button homeTimeButton = button("Eve giriş saati seç");
                  root.addView(homeTimeButton);
                  homeTimeButton.setOnClickListener(v -> chooseHomeTime(homeTimeButton, homeIn));

                  Button save = button("Görevi Tamamla");
                  root.addView(save);

                  save.setOnClickListener(v -> {
                      if (finish[0].isEmpty() || homeDate[0].isEmpty() || homeIn[0].isEmpty()) {
                          Toast.makeText(this, "Bitiş ve eve giriş bilgilerini tamamla.", Toast.LENGTH_LONG).show();
                          return;
                      }

                      String newRecord =
                          r.replace(
                              "|OPEN",
                              "|DONE|" +
                              finish[0] + "|" +
                              owner.getText().toString().trim() + "|" +
                              homeDate[0] + "|" +
                              homeIn[0]
                          );

                      records.set(records.indexOf(r), newRecord);
                      persist();

                      Toast.makeText(this, "Görev tamamlandı.", Toast.LENGTH_SHORT).show();
                      home();
                  });

                  Button cancel = button("Vazgeç");
                  root.addView(cancel);
                  cancel.setOnClickListener(v -> ongoing());
              }

              void chooseFinishTime(Button target, String[] result) {
                  Calendar c = Calendar.getInstance();
                  TimePickerDialog d = new TimePickerDialog(
                      this,
                      (view, hour, minute) -> {
                          result[0] = String.format(Locale.getDefault(), "%02d:%02d", hour, minute);
                          target.setText("Görev bitiş / teslim: " + result[0]);
                      },
                      c.get(Calendar.HOUR_OF_DAY),
                      c.get(Calendar.MINUTE),
                      true
                  );
                  d.show();
              }

              void chooseHomeDate(Button target, String[] result) {
                  Calendar c = Calendar.getInstance();
                  DatePickerDialog d = new DatePickerDialog(
                      this,
                      (view, year, month, day) -> {
                          result[0] = String.format(Locale.getDefault(), "%02d.%02d.%04d", day, month + 1, year);
                          target.setText("Eve giriş tarihi: " + result[0]);
                      },
                      c.get(Calendar.YEAR),
                      c.get(Calendar.MONTH),
                      c.get(Calendar.DAY_OF_MONTH)
                  );
                  d.show();
              }

              void chooseHomeTime(Button target, String[] result) {
                  Calendar c = Calendar.getInstance();
                  TimePickerDialog d = new TimePickerDialog(
                      this,
                      (view, hour, minute) -> {
                          result[0] = String.format(Locale.getDefault(), "%02d:%02d", hour, minute);
                          target.setText("Eve giriş saati: " + result[0]);
                      },
                      c.get(Calendar.HOUR_OF_DAY),
                      c.get(Calendar.MINUTE),
                      true
                  );
                  d.show();
              }

              void monthly() {
                  page("Aylık Kayıtlar");

                  if (records.isEmpty()) {
                      root.addView(info("Henüz kayıt yok."));
                  }

                  for (String r : records) {
                      String[] a = r.split("\\|", -1);
                      if (a.length >= 4) {
                          root.addView(info(
                              a[1] + " • Tren " + a[3] +
                              " • " + a[2] +
                              " • " + (r.endsWith("|OPEN") ? "Devam ediyor" : "Tamamlandı")
                          ));
                      }
                  }

                  Button back = button("Ana Sayfa");
                  root.addView(back);
                  back.setOnClickListener(v -> home());
              }

              void load() {
                  String all = prefs.getString("records", "");
                  if (!all.isEmpty()) {
                      records.addAll(Arrays.asList(all.split("\\n", -1)));
                  }
              }

              void persist() {
                  StringBuilder out = new StringBuilder();

                  for (String r : records) {
                      if (out.length() > 0) out.append("\n");
                      out.append(r);
                  }

                  prefs.edit().putString("records", out.toString()).apply();
              }
          }
          EOF

          cd puantaj
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Puantaj-v0.2.apk"

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Puantaj-v0.2
          path: Puantaj-v0.2.apk
