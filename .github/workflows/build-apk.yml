name: Puantaj APK v0.5.1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Android projesini oluştur
        shell: bash
        run: |
          set -e
          mkdir -p puantaj/app/src/main/java/com/furkan/puantaj
          mkdir -p puantaj/app/src/main/res/values

          cat > puantaj/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PuantajAndroid"
          include(":app")
          EOF

          cat > puantaj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > puantaj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > puantaj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.furkan.puantaj'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.furkan.puantaj'
                  minSdk 26
                  targetSdk 35
                  versionCode 6
                  versionName '0.5.1'
              }
          }
          dependencies {
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > puantaj/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/Theme.Puantaj"
                  android:label="Puantaj"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > puantaj/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.Puantaj" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0F0D13</item>
                  <item name="android:navigationBarColor">#0F0D13</item>
                  <item name="colorPrimary">#7053AA</item>
                  <item name="colorSecondary">#A98BD4</item>
              </style>
          </resources>
          EOF

          cat > puantaj/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Puantaj</string>
          </resources>
          EOF

          cat > puantaj/app/src/main/java/com/furkan/puantaj/MainActivity.java <<'EOF'
          package com.furkan.puantaj;
          
          import android.app.*;
          import android.os.Bundle;
          import android.content.*;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.*;
          import android.widget.*;
          import com.google.android.material.textfield.TextInputEditText;
          import com.google.android.material.textfield.TextInputLayout;
          import java.text.SimpleDateFormat;
          import java.util.*;
          
          public class MainActivity extends Activity {
              LinearLayout root;
              SharedPreferences prefs;
              ArrayList<String> records = new ArrayList<>();
          
              String selectedStart = "";
              String selectedStartDate = "";
              String selectedFinish = "";
              String selectedFinishDate = "";
          
              int dp(float v) {
                  return (int)(v * getResources().getDisplayMetrics().density + 0.5f);
              }
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("puantaj", MODE_PRIVATE);
                  load();
                  home();
              }
          
              GradientDrawable bg(int color, float radius) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(radius));
                  return g;
              }
          
              TextView text(String s, float size, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setTypeface(Typeface.DEFAULT, bold ? Typeface.BOLD : Typeface.NORMAL);
                  return t;
              }
          
              TextView title(String s) {
                  TextView t = text(s, 30, Color.rgb(245,243,250), true);
                  t.setPadding(0, 0, 0, dp(6));
                  return t;
              }
          
              TextView subtitle(String s) {
                  TextView t = text(s, 15, Color.rgb(170,165,180), false);
                  t.setPadding(0, 0, 0, dp(22));
                  return t;
              }
          
              TextView section(String s) {
                  TextView t = text(s.toUpperCase(Locale.getDefault()), 12, Color.rgb(185,178,205), true);
                  t.setLetterSpacing(.08f);
                  t.setPadding(dp(4), dp(16), dp(4), dp(8));
                  return t;
              }
          
              LinearLayout card() {
                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setPadding(dp(16), dp(14), dp(16), dp(14));
                  c.setBackground(bg(Color.rgb(29,26,35), 22));
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, -2);
                  p.setMargins(0, 0, 0, dp(12));
                  c.setLayoutParams(p);
                  return c;
              }
          
              TextInputLayout field(String hint) {
                  TextInputLayout box = new TextInputLayout(this);
                  box.setHint(hint);
                  box.setBoxBackgroundMode(TextInputLayout.BOX_BACKGROUND_OUTLINE);
                  box.setBoxCornerRadii(dp(14),dp(14),dp(14),dp(14));
                  box.setBoxStrokeColor(Color.rgb(115,100,150));
                  box.setHintTextColor(android.content.res.ColorStateList.valueOf(Color.rgb(170,165,180)));
                  box.setPadding(0, dp(4), 0, dp(8));
          
                  TextInputEditText edit = new TextInputEditText(box.getContext());
                  edit.setSingleLine(true);
                  edit.setTextSize(17);
                  edit.setTextColor(Color.rgb(245,243,250));
                  edit.setHintTextColor(Color.rgb(150,145,160));
                  box.addView(edit, new LinearLayout.LayoutParams(-1, dp(54)));
                  return box;
              }
          
              String value(TextInputLayout box) {
                  TextInputEditText e = (TextInputEditText)box.getEditText();
                  return e == null || e.getText() == null ? "" : e.getText().toString().trim();
              }
          
              Button action(String label, boolean primary) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextSize(15);
                  b.setTextColor(Color.rgb(248,246,252));
                  b.setAllCaps(false);
                  b.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  b.setMinHeight(dp(52));
                  b.setPadding(dp(10), 0, dp(10), 0);
                  b.setBackground(bg(primary ? Color.rgb(112,83,170) : Color.rgb(45,41,52), 18));
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, dp(54));
                  p.setMargins(0, dp(4), 0, dp(10));
                  b.setLayoutParams(p);
                  return b;
              }
          
              Button choice(String label) {
                  Button b = action(label, false);
                  b.setTextSize(15);
                  b.setGravity(Gravity.CENTER_VERTICAL);
                  return b;
              }
          
              void page(String heading, String desc) {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(20), dp(24), dp(20), dp(28));
                  root.setBackgroundColor(Color.rgb(15,13,19));
                  scroll.addView(root);
                  setContentView(scroll);
                  root.addView(title(heading));
                  if (!desc.isEmpty()) root.addView(subtitle(desc));
              }
          
              void home() {
                  page("PUANTAJ", "Günlük görevlerini hızlıca kaydet. Hesaplamaları uygulamaya bırak.");
          
                  LinearLayout hero = card();
                  hero.setBackground(bg(Color.rgb(40,32,55), 24));
                  hero.addView(text("Bugünün görevi", 13, Color.rgb(194,180,220), true));
                  hero.addView(text(new SimpleDateFormat("EEEE, dd MMMM", new Locale("tr","TR")).format(new Date()), 22, Color.rgb(250,248,255), true));
                  hero.addView(text(records.size() + " kayıt telefonda güvenle saklanıyor", 14, Color.rgb(175,168,185), false));
                  root.addView(hero);
          
                  Button n = action("＋  Yeni Görev / Tren Al", true);
                  root.addView(n);
                  n.setOnClickListener(v -> newRecord());
          
                  Button o = action("↻  Devam Eden Kayıtlar", false);
                  root.addView(o);
                  o.setOnClickListener(v -> ongoing());
          
                  Button m = action("▦  Aylık Kayıtlar", false);
                  root.addView(m);
                  m.setOnClickListener(v -> monthly());
          
                  root.addView(section("Nasıl çalışır?"));
                  LinearLayout help = card();
                  help.addView(text("1  Görev alış / başlangıç saatini seç.", 14, Color.rgb(225,220,232), false));
                  help.addView(text("2  Uygulamayı kapat; görev telefonda kalır.", 14, Color.rgb(225,220,232), false));
                  help.addView(text("3  Bitiş saatini gir; eve giriş otomatik +30 dk.", 14, Color.rgb(225,220,232), false));
                  root.addView(help);
              }
          
              void newRecord() {
                  page("Yeni Görev", "Puantaj satırını oluşturmak için bilgileri gir.");
          
                  selectedStartDate = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault()).format(new Date());
                  selectedStart = "";
          
                  LinearLayout c = card();
                  c.addView(section("Görev bilgileri"));
          
                  Button dateButton = choice("Tarih  •  " + selectedStartDate);
                  c.addView(dateButton);
                  dateButton.setOnClickListener(v -> chooseDate(dateButton, true));
          
                  TextInputLayout person = field("Kiminle gittin?");
                  c.addView(person);
          
                  TextInputLayout train = field("Tren no");
                  c.addView(train);
          
                  c.addView(section("Başlangıç"));

                  TextInputLayout owner = field("Teslim / tesellüm sahibi");
                  c.addView(owner);

                  Button startButton = choice("Saat seç  •  Henüz seçilmedi");
                  c.addView(startButton);
                  startButton.setOnClickListener(v -> chooseTime(startButton, true));
          
                  root.addView(c);
          
                  Button save = action("Görevi Başlat ve Kaydet", true);
                  root.addView(save);
                  save.setOnClickListener(v -> {
                      if (value(person).isEmpty() || value(train).isEmpty() ||
                              value(owner).isEmpty() || selectedStart.isEmpty()) {
                          Toast.makeText(this, "Kiminle, tren no, teslim/tesellüm sahibi ve başlangıç saati gerekli.", Toast.LENGTH_LONG).show();
                          return;
                      }
                      String chainId = UUID.randomUUID().toString();
                      String record = chainId + "|" + selectedStartDate + "|" +
                              value(person) + "|" + value(train) + "|" + selectedStart + "|" +
                              value(owner) + "|OPEN";
                      records.add(record);
                      persist();
                      Toast.makeText(this, "Kayıt oluşturuldu. Uygulamayı kapatabilirsin.", Toast.LENGTH_SHORT).show();
                      home();
                  });
          
                  Button cancel = action("Vazgeç", false);
                  root.addView(cancel);
                  cancel.setOnClickListener(v -> home());
              }
          
              void chooseDate(Button target, boolean start) {
                  Calendar c = Calendar.getInstance();
                  String base = start ? selectedStartDate : selectedFinishDate;
                  if (base != null && !base.isEmpty()) {
                      try {
                          Date d = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault()).parse(base);
                          if (d != null) c.setTime(d);
                      } catch (Exception ignored) {}
                  }
          
                  DatePickerDialog d = new DatePickerDialog(this,
                      (view, year, month, day) -> {
                          String v = String.format(Locale.getDefault(), "%02d.%02d.%04d", day, month + 1, year);
                          if (start) {
                              selectedStartDate = v;
                              target.setText("Tarih  •  " + v);
                          } else {
                              selectedFinishDate = v;
                              target.setText("Görev bitiş tarihi  •  " + v);
                          }
                      }, c.get(Calendar.YEAR), c.get(Calendar.MONTH), c.get(Calendar.DAY_OF_MONTH));
                  d.show();
              }
          
              void chooseTime(Button target, boolean start) {
                  Calendar c = Calendar.getInstance();
                  TimePickerDialog d = new TimePickerDialog(this,
                      (view, hour, minute) -> {
                          String v = String.format(Locale.getDefault(), "%02d:%02d", hour, minute);
                          if (start) {
                              selectedStart = v;
                              target.setText("Saat seçildi  •  " + v);
                          } else {
                              selectedFinish = v;
                              target.setText("Görev bitiş / teslim  •  " + v);
                          }
                      }, c.get(Calendar.HOUR_OF_DAY), c.get(Calendar.MINUTE), true);
                  d.show();
              }
          
              void ongoing() {
                  page("Devam Eden", "Tamamlanmamış veya otelde devam eden görevler.");

                  boolean found = false;
                  for (String r : new ArrayList<>(records)) {
                      String[] a = r.split("\\|", -1);
                      if (a.length < 7) continue;

                      String status = a[6];
                      if (!status.equals("OPEN") && !status.equals("HOTEL")) continue;

                      found = true;
                      LinearLayout c = card();
                      c.addView(text("TREN " + a[3], 18, Color.rgb(245,243,250), true));
                      c.addView(text(a[1] + "  •  " + a[2], 14, Color.rgb(175,168,185), false));
                      c.addView(text("Başlangıç  " + a[4] + "  •  Tesellüm: " + a[5],
                              14, Color.rgb(205,196,220), false));

                      if (status.equals("HOTEL") && a.length >= 11) {
                          c.addView(text("Otel / devam  •  Teslim: " + a[7] + " " + a[8],
                                  14, Color.rgb(210,190,225), false));
                          c.addView(text("Otele varış +30 dk  •  " + a[10],
                                  13, Color.rgb(175,168,185), false));
                          Button b = action("Treni devam ettir  →", true);
                          c.addView(b);
                          root.addView(c);
                          b.setOnClickListener(v -> continueFromHotel(r));
                      } else {
                          Button b = action("Görevi tamamla / otele geç  →", true);
                          c.addView(b);
                          root.addView(c);
                          b.setOnClickListener(v -> complete(r));
                      }
                  }

                  if (!found) {
                      LinearLayout empty = card();
                      empty.addView(text("Aktif görev yok", 18, Color.rgb(240,236,246), true));
                      empty.addView(text("Yeni bir görev başlattığında burada görünecek.", 14, Color.rgb(170,165,180), false));
                      root.addView(empty);
                  }

                  Button back = action("Ana Sayfa", false);
                  root.addView(back);
                  back.setOnClickListener(v -> home());
              }

              void complete(String r) {
                  String[] a = r.split("\\|", -1);
                  page("Görevi Sonlandır", "Bitişte eve giriş otomatik +30 dakika. Otelde kalacaksan görevi devam ettirebilirsin.");

                  LinearLayout summary = card();
                  summary.addView(text("TREN " + a[3], 20, Color.rgb(245,243,250), true));
                  summary.addView(text(a[2], 14, Color.rgb(190,182,200), false));
                  summary.addView(text("Başlangıç  " + a[4] + "  •  " + a[1], 14, Color.rgb(205,196,220), false));
                  summary.addView(text("Başlangıç tesellüm sahibi  •  " + a[5], 13, Color.rgb(175,168,185), false));
                  root.addView(summary);

                  selectedFinish = "";
                  selectedFinishDate = a[1];

                  LinearLayout c = card();
                  c.addView(section("Görev bitiş / teslim"));

                  Button finishDate = choice("Görev bitiş tarihi  •  " + selectedFinishDate);
                  c.addView(finishDate);
                  finishDate.setOnClickListener(v -> chooseDate(finishDate, false));

                  Button finishButton = choice("Bitiş saati seç  •  Henüz seçilmedi");
                  c.addView(finishButton);
                  finishButton.setOnClickListener(v -> chooseTime(finishButton, false));

                  TextInputLayout owner = field("Teslim / tesellüm sahibi");
                  c.addView(owner);

                  LinearLayout auto = card();
                  auto.setBackground(bg(Color.rgb(33,28,43), 18));
                  auto.addView(text("EVE DÖNÜŞ", 11, Color.rgb(183,161,220), true));
                  auto.addView(text("Görev bitişi + 30 dakika = eve giriş", 15, Color.rgb(235,230,242), true));
                  auto.addView(text("Bu 30 dakika fiili çalışmaya dahildir.", 13, Color.rgb(175,168,185), false));
                  c.addView(auto);
                  root.addView(c);

                  Button hotel = action("🏨  Otele Geç / Treni Devam Ettir", false);
                  root.addView(hotel);
                  hotel.setOnClickListener(v -> {
                      if (selectedFinish.isEmpty()) {
                          Toast.makeText(this, "Önce görev bitiş saatini seç.", Toast.LENGTH_LONG).show();
                          return;
                      }
                      if (value(owner).isEmpty()) {
                          Toast.makeText(this, "Teslim / tesellüm sahibini gir.", Toast.LENGTH_LONG).show();
                          return;
                      }

                      String hotelArrival = addThirtyMinutes(selectedFinishDate, selectedFinish);
                      String newRecord = r.replace("|OPEN", "|HOTEL|" + selectedFinishDate + "|" +
                              selectedFinish + "|" + value(owner) + "|" + hotelArrival);
                      records.set(records.indexOf(r), newRecord);
                      persist();
                      Toast.makeText(this, "Otel konaklaması kaydedildi • Otele varış " + hotelArrival,
                              Toast.LENGTH_LONG).show();
                      home();
                  });

                  Button save = action("✓  Görevi Tamamla ve Eve Dön", true);
                  root.addView(save);
                  save.setOnClickListener(v -> {
                      if (selectedFinish.isEmpty()) {
                          Toast.makeText(this, "Görev bitiş saatini seç.", Toast.LENGTH_LONG).show();
                          return;
                      }
                      if (value(owner).isEmpty()) {
                          Toast.makeText(this, "Teslim / tesellüm sahibini gir.", Toast.LENGTH_LONG).show();
                          return;
                      }

                      String arrival = addThirtyMinutes(selectedFinishDate, selectedFinish);
                      String newRecord = r.replace("|OPEN", "|DONE|" + selectedFinishDate + "|" +
                              selectedFinish + "|" + value(owner) + "|" + arrival);
                      records.set(records.indexOf(r), newRecord);
                      persist();
                      Toast.makeText(this, "Görev tamamlandı • Eve giriş " + arrival, Toast.LENGTH_LONG).show();
                      home();
                  });

                  Button cancel = action("Vazgeç", false);
                  root.addView(cancel);
                  cancel.setOnClickListener(v -> ongoing());
              }

              void continueFromHotel(String r) {
                  String[] a = r.split("\\|", -1);

                  page("Treni Devam Ettir", "Aynı tren ve görev zinciri devam eder. Yeni başlangıç bilgilerini gir.");

                  LinearLayout summary = card();
                  summary.addView(text("TREN " + a[3], 20, Color.rgb(245,243,250), true));
                  summary.addView(text(a[2] + "  •  Aynı görev zinciri", 14, Color.rgb(190,182,200), false));
                  summary.addView(text("Otele teslim  •  " + a[7] + " " + a[8], 14, Color.rgb(205,196,220), false));
                  summary.addView(text("Otele varış  •  " + a[10] + "  (+30 dk çalışma)", 13, Color.rgb(175,168,185), false));
                  root.addView(summary);

                  selectedStartDate = addDays(a[7], 1);
                  selectedStart = "";

                  LinearLayout c = card();
                  c.addView(section("Yeni görev başlangıcı"));

                  Button dateButton = choice("Başlangıç tarihi  •  " + selectedStartDate);
                  c.addView(dateButton);
                  dateButton.setOnClickListener(v -> chooseDate(dateButton, true));

                  Button startButton = choice("Başlangıç saati seç  •  Henüz seçilmedi");
                  c.addView(startButton);
                  startButton.setOnClickListener(v -> chooseTime(startButton, true));

                  TextInputLayout owner = field("Teslim / tesellüm sahibi");
                  c.addView(owner);

                  root.addView(c);

                  Button save = action("✓  Treni Devam Ettir", true);
                  root.addView(save);
                  save.setOnClickListener(v -> {
                      if (selectedStart.isEmpty() || value(owner).isEmpty()) {
                          Toast.makeText(this, "Başlangıç saati ve teslim/tesellüm sahibi gerekli.", Toast.LENGTH_LONG).show();
                          return;
                      }

                      String chainId = a[0];
                      String newRecord = chainId + "|" + selectedStartDate + "|" + a[2] + "|" + a[3] + "|" +
                              selectedStart + "|" + value(owner) + "|OPEN";
                      int oldIndex = records.indexOf(r);
                      String closedHotel = r.replace("|HOTEL|", "|HOTEL_DONE|");
                      if (oldIndex >= 0) {
                          records.set(oldIndex, closedHotel);
                      }
                      records.add(newRecord);
                      persist();

                      Toast.makeText(this, "Tren devam kaydı oluşturuldu.", Toast.LENGTH_SHORT).show();
                      home();
                  });

                  Button cancel = action("Vazgeç", false);
                  root.addView(cancel);
                  cancel.setOnClickListener(v -> ongoing());
              }

              String addThirtyMinutes(String date, String time) {
                  try {
                      SimpleDateFormat f = new SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault());
                      Date d = f.parse(date + " " + time);
                      if (d != null) {
                          d = new Date(d.getTime() + 30L * 60L * 1000L);
                          return new SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault()).format(d);
                      }
                  } catch (Exception ignored) {}
                  return date + " " + time;
              }

              String addDays(String date, int days) {
                  try {
                      SimpleDateFormat f = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault());
                      Date d = f.parse(date);
                      if (d != null) {
                          Calendar c = Calendar.getInstance();
                          c.setTime(d);
                          c.add(Calendar.DAY_OF_MONTH, days);
                          return f.format(c.getTime());
                      }
                  } catch (Exception ignored) {}
                  return date;
              }

              void addHotelDays(LinearLayout target, String chainId, String fromDate, String toDate) {
                  try {
                      SimpleDateFormat f = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault());
                      Calendar c = Calendar.getInstance();
                      Date from = f.parse(fromDate);
                      Date to = f.parse(toDate);
                      if (from == null || to == null) return;
                      c.setTime(from);
                      c.add(Calendar.DAY_OF_MONTH, 1);

                      while (c.getTime().before(to)) {
                          String d = f.format(c.getTime());
                          LinearLayout hotel = card();
                          hotel.addView(text(d + "  •  OTEL / BEKLEME", 15,
                                  Color.rgb(230,220,238), true));
                          hotel.addView(text("Aynı tren görevi devam ediyor.", 13,
                                  Color.rgb(175,168,185), false));
                          target.addView(hotel);
                          c.add(Calendar.DAY_OF_MONTH, 1);
                      }
                  } catch (Exception ignored) {}
              }
               
              void monthly() {
                  page("Aylık Kayıtlar", "Görev, otel/bekleme ve devam segmentleri burada görünür.");

                  if (records.isEmpty()) {
                      LinearLayout empty = card();
                      empty.addView(text("Henüz kayıt yok.", 18, Color.rgb(240,236,246), true));
                      root.addView(empty);
                  }

                  ArrayList<String> sorted = new ArrayList<>(records);
                  Collections.sort(sorted, (x, y) -> {
                      String[] a = x.split("\\|", -1);
                      String[] b = y.split("\\|", -1);
                      return a[1].compareTo(b[1]);
                  });

                  for (int i = 0; i < sorted.size(); i++) {
                      String r = sorted.get(i);
                      String[] a = r.split("\\|", -1);
                      if (a.length < 7) continue;

                      LinearLayout c = card();
                      c.addView(text(a[1] + "  •  TREN " + a[3], 17, Color.rgb(245,243,250), true));
                      c.addView(text(a[2] + "  •  Başlangıç " + a[4], 14, Color.rgb(185,178,195), false));
                      c.addView(text("Başlangıç tesellüm: " + a[5], 13, Color.rgb(170,165,180), false));

                      if (a[6].equals("HOTEL") && a.length >= 11) {
                          c.addView(text("OTEL / DEVAM", 12, Color.rgb(235,190,90), true));
                          c.addView(text("Teslim " + a[7] + " " + a[8] +
                                  "  •  Tesellüm: " + a[9], 13, Color.rgb(205,196,220), false));
                          c.addView(text("Otele varış " + a[10] + "  (+30 dk çalışma)",
                                  13, Color.rgb(180,205,190), false));

                          // Sonraki segmentin başlangıcına kadar olan günleri otomatik göster.
                          String nextDate = "";
                          for (int j = 0; j < sorted.size(); j++) {
                              String[] n = sorted.get(j).split("\\|", -1);
                              if (n.length >= 7 && n[0].equals(a[0]) &&
                                      n[1].compareTo(a[7]) > 0) {
                                  if (nextDate.isEmpty() || n[1].compareTo(nextDate) < 0) nextDate = n[1];
                              }
                          }
                          if (!nextDate.isEmpty()) addHotelDays(root, a[0], a[7], nextDate);
                      } else if (a[6].equals("DONE") && a.length >= 11) {
                          c.addView(text("TAMAMLANDI", 12, Color.rgb(180,205,190), true));
                          c.addView(text("Bitiş " + a[7] + " " + a[8] +
                                  "  •  Tesellüm: " + a[9], 13, Color.rgb(205,196,220), false));
                          c.addView(text("Eve giriş " + a[10], 13, Color.rgb(180,205,190), false));
                      } else if (a[6].equals("OPEN")) {
                          c.addView(text("DEVAM EDİYOR", 12, Color.rgb(235,190,90), true));
                      }
                      root.addView(c);
                  }

                  Button back = action("Ana Sayfa", false);
                  root.addView(back);
                  back.setOnClickListener(v -> home());
              }

              void load() {
                  String all = prefs.getString("records", "");
                  if (all.isEmpty()) return;

                  for (String raw : all.split("\\n", -1)) {
                      if (raw.trim().isEmpty()) continue;
                      String[] a = raw.split("\\|", -1);

                      // v0.4 OPEN: id|date|person|train|start|OPEN
                      if (a.length == 6 && a[5].equals("OPEN")) {
                          raw = a[0] + "|" + a[1] + "|" + a[2] + "|" + a[3] + "|" +
                                  a[4] + "|Belirtilmedi|OPEN";
                      }
                      // v0.4 DONE: id|date|person|train|start|DONE|finishDate|finish|owner|arrival
                      else if (a.length == 10 && a[5].equals("DONE")) {
                          raw = a[0] + "|" + a[1] + "|" + a[2] + "|" + a[3] + "|" +
                                  a[4] + "|Belirtilmedi|DONE|" + a[6] + "|" + a[7] + "|" +
                                  a[8] + "|" + a[9];
                      }

                      records.add(raw);
                  }
              }
          
              void persist() {
                  StringBuilder out = new StringBuilder();
                  for (String r : records) {
                      if (out.length() > 0) out.append("\n");
                      out.append(r);
                  }
                  prefs.edit().putString("records", out.toString()).apply();
              }
          }
          EOF

          cd puantaj
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Puantaj-v0.4.apk"

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Puantaj-v0.4
          path: Puantaj-v0.4.apk
