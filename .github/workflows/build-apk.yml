                  LinearLayout tileSettings = homeTile("⚙", "Ayarlar", "Kişiler & tercihler", BORDER_MUTED);
                  LinearLayout.LayoutParams lp3 = new LinearLayout.LayoutParams(0, dp(130), 1f);
                  lp3.setMargins(0, 0, dp(6), dp(12));
                  LinearLayout.LayoutParams lp4 = new LinearLayout.LayoutParams(0, dp(130), 1f);
                  lp4.setMargins(dp(6), 0, 0, dp(12));
                  row2.addView(tileMonthly, lp3);
