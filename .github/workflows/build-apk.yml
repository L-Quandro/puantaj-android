              private void showOngoingScreen() {
                  currentPage = "ongoing";
                  prepareBasePage("Devam Eden Görevler", "Kapatılmamış veya otelde olan görevler.");

                  boolean hasRecords = false;
                  for (String r : new ArrayList<>(records)) {
                      String[] parts = r.split("\\|", -1);
                      if (parts.length < 7) {
                          continue;
                      }

                      String status = parts[6];
                      if (!status.equals("OPEN") && !status.equals("HOTEL")) {
                          continue;
                      }

                      hasRecords = true;
                      LinearLayout card = createCardLayout();
                      card.addView(createTextView(formatTrainName(parts[3]), 16, NEON_GREEN, true));
                      card.addView(createTextView("Tarih: " + parts[1] + " • Kiminle: " + parts[2], 13, TEXT_PRIMARY, false));
                      card.addView(createTextView("Saat: " + parts[4] + " • Tesellüm: " + parts[5], 12, TEXT_MUTED, false));

                      if (status.equals("HOTEL")) {
                          String hotelArrival = parts.length > 10 ? parts[10] : "-";
                          card.addView(createTextView("Durum: Otel Konaklamasında (Varış: " + hotelArrival + ")", 12, Color.parseColor("#FFD700"), true));

                          Button continueBtn = createActionButton("Treni Devam Ettir (Otelden Çık)", true);
                          card.addView(continueBtn);
                          root.addView(card);
                          continueBtn.setOnClickListener(v -> showContinueFromHotelScreen(r));
                      } else {
                          card.addView(createTextView("Durum: Görev Devam Ediyor", 12, NEON_PURPLE, true));

                          Button finishBtn = createActionButton("Görevi Sonlandır / Otele Geç", true);
                          card.addView(finishBtn);
                          root.addView(card);
                          finishBtn.setOnClickListener(v -> showCompleteTaskScreen(r));
                      }
                  }

                  if (!hasRecords) {
                      root.addView(createTextView("Devam eden açık bir görev bulunmamaktadır.", 14, TEXT_MUTED, false));
                  }

                  Button backBtn = createChoiceButton("Ana Menüye Dön");
                  root.addView(backBtn);
                  backBtn.setOnClickListener(v -> showHomeScreen());
              }

