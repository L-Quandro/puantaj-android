              class OwnerPicker {
                  final TextInputLayout input;
                  final CheckBox modeCheck;
                  final Button chooser;
                  final String label;
                  final boolean listFirst;
                  String selected = "";

                  OwnerPicker(LinearLayout parent, String label) {
                      this(parent, label, true);
                  }

                  OwnerPicker(LinearLayout parent, String label, boolean listFirst) {
                      this.label = label;
                      this.listFirst = listFirst;

                      chooser = choice(label + "  •  Seç");
                      parent.addView(chooser);

                      modeCheck = new CheckBox(MainActivity.this);
                      modeCheck.setText(listFirst ? "Manuel farklı isim gireceğim" : "Hazır listeden seç");
                      modeCheck.setTextSize(14);
                      modeCheck.setTextColor(Color.rgb(198,190,226));
                      modeCheck.setButtonTintList(android.content.res.ColorStateList.valueOf(Color.rgb(199,120,255)));
                      parent.addView(modeCheck);

                      input = field(label);
                      parent.addView(input);

                      if (listFirst) {
                          chooser.setVisibility(View.VISIBLE);
                          input.setVisibility(View.GONE);
                          modeCheck.setChecked(false);
                      } else {
                          chooser.setVisibility(View.GONE);
                          input.setVisibility(View.VISIBLE);
                          modeCheck.setChecked(false);
                      }

                      chooser.setOnClickListener(v -> showOwnerChoices());

                      modeCheck.setOnCheckedChangeListener((buttonView, checked) -> {
                          if (listFirst) {
                              input.setVisibility(checked ? View.VISIBLE : View.GONE);
                              chooser.setVisibility(checked ? View.GONE : View.VISIBLE);
                              if (checked) {
                                  selected = "";
                                  if (input.getEditText() != null) input.getEditText().setText("");
                              }
                          } else {
                              chooser.setVisibility(View.GONE);
                              input.setVisibility(View.VISIBLE);
                              if (checked) {
                                  selected = "";
                                  showOwnerChoices();
                              }
                          }
                      });
                  }

                  void showOwnerChoices() {
                      if (!useOwnerList()) {
                          Toast.makeText(MainActivity.this, "Hazır kişi listesi Ayarlar'dan kapalı.", Toast.LENGTH_SHORT).show();
                          modeCheck.setChecked(false);
                          if (listFirst) input.setVisibility(View.GONE);
                          return;
                      }
                      ArrayList<String> list = ownerList();
                      if (list.isEmpty()) {
                          Toast.makeText(MainActivity.this, "Hazır kişi listesinde isim yok.", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      String[] items = list.toArray(new String[0]);
                      int checked = list.indexOf(selected);
                      new AlertDialog.Builder(MainActivity.this)
                              .setTitle(label)
                              .setSingleChoiceItems(items, checked, (d, which) -> {
                                  selected = items[which];
                                  chooser.setText(label + "  •  " + selected);
                                  if (listFirst) {
                                      modeCheck.setChecked(false);
                                  } else {
                                      input.setVisibility(View.VISIBLE);
                                      if (input.getEditText() != null) input.getEditText().setText(selected);
                                      chooser.setVisibility(View.GONE);
                                      modeCheck.setChecked(false);
                                  }
                                  d.dismiss();
                              })
                              .setNegativeButton("İptal", null)
                              .show();
                  }

                  String value() {
                      if (listFirst) {
                          return modeCheck.isChecked() ? MainActivity.this.value(input) :
                                  (selected == null ? "" : selected);
                      }
                      return modeCheck.isChecked() ? (selected == null ? "" : selected) :
                              MainActivity.this.value(input);
                  }

                  void setValue(String value) {
                      if (value == null) value = "";
                      value = value.trim();
                      if (value.isEmpty()) {
                          return;
                      }
                      if (useOwnerList() && ownerList().contains(value)) {
                          selected = value;
                          chooser.setText(label + "  •  " + selected);
                          if (listFirst) {
                              modeCheck.setChecked(false);
                          } else {
                              input.setVisibility(View.VISIBLE);
                              if (input.getEditText() != null) input.getEditText().setText(selected);
                              chooser.setVisibility(View.GONE);
                              modeCheck.setChecked(false);
                          }
                      } else {
                          selected = "";
                          modeCheck.setChecked(listFirst);
                          if (input.getEditText() != null) input.getEditText().setText(value);
                      }
                  }
              }
          
