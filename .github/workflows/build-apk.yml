              private void showMonthlyReportScreen() {
                  currentPage = "monthly";
                  prepareBasePage("Aylık Rapor", "Tamamlanmış kayıtlar ve detaylar.");

                  if (records.isEmpty()) {
                      root.addView(createTextView("Henüz kaydedilmiş veri yok.", 14, TEXT_MUTED, false));
                  } else {
                      for (String record : new ArrayList<>(records)) {
                          String[] parts = record.split("\\|", -1);
                          if (parts.length < 7) {
                              continue;
                          }

                          LinearLayout card = createCardLayout();
                          card.addView(createTextView(formatTrainName(parts[3]), 16, NEON_GREEN, true));
                          card.addView(createTextView("Tarih: " + parts[1] + " • Personel: " + parts[2], 13, TEXT_PRIMARY, false));

                          if (parts[6].equals("DONE")) {
                              card.addView(createTextView("Başlangıç: " + parts[4] + " (Tesellüm: " + parts[5] + ")", 12, TEXT_MUTED, false));
                              if (parts.length > 8) {
                                  card.addView(createTextView("Bitiş: " + parts[7] + " " + parts[8] + " (Teslim: " + parts[9] + ")", 12, TEXT_MUTED, false));
                              }
                              if (parts.length > 10) {
                                  card.addView(createTextView("Varış/Hesaplama: " + parts[10], 12, NEON_PURPLE, false));
                              }

                              Button editBtn = createChoiceButton("Düzenle");
                              card.addView(editBtn);
                              editBtn.setOnClickListener(v -> editCompletedRecord(record));
                          } else {
                              card.addView(createTextView("Durum: " + parts[6], 12, Color.parseColor("#FFD700"), true));
                          }
                          root.addView(card);
                      }
                  }

                  Button backBtn = createChoiceButton("Ana Menüye Dön");
                  root.addView(backBtn);
                  backBtn.setOnClickListener(v -> showHomeScreen());
              }

              private void chooseTrain(TextInputLayout targetInput, String[] trains, String dialogTitle) {
                  AlertDialog dialog = new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                          .setTitle(dialogTitle)
                          .setItems(trains, (d, which) -> {
                              EditText edit = targetInput.getEditText();
                              if (edit != null) {
                                  edit.setText(trains[which]);
                              }
                              d.dismiss();
                          })
                          .show();
              }

              private String addThirtyMinutes(String dateStr, String timeStr) {
                  try {
                      SimpleDateFormat sdf = new SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault());
                      Date d = sdf.parse(dateStr + " " + timeStr);
                      if (d == null) {
                          return dateStr + " " + timeStr;
                      }
                      Calendar cal = Calendar.getInstance();
                      cal.setTime(d);
                      cal.add(Calendar.MINUTE, 30);
                      return sdf.format(cal.getTime());
                  } catch (Exception e) {
                      return dateStr + " " + timeStr;
                  }
              }

              private void loadDataFromStorage() {
                  String allRecords = prefs.getString("records", "");
                  if (allRecords.isEmpty()) {
                      return;
                  }
                  String[] lines = allRecords.split("\\n", -1);
                  for (String raw : lines) {
                      if (!raw.trim().isEmpty()) {
                          records.add(raw);
                      }
                  }
              }

              private void saveDataToStorage() {
                  StringBuilder builder = new StringBuilder();
                  for (String r : records) {
                      if (builder.length() > 0) {
                          builder.append("\n");
                      }
                      builder.append(r);
                  }
                  prefs.edit().putString("records", builder.toString()).apply();
              }
          }
