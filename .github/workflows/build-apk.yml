              // --- İmza görseli seçme/kaydetme ---
              // MainActivity düz Activity'den türediği için (ComponentActivity değil),
              // modern ActivityResult API'si kullanılamıyor; mimariyi değiştirmemek
              // için klasik startActivityForResult/onActivityResult yöntemi kullanıldı.
              static final int REQUEST_PICK_SIGNATURE = 4011;
              String pendingSignatureTarget = "";
              // İmza kaydedildikten sonra TÜM ekranı yeniden kurmak yerine (bu,
              // henüz "Kaydet"e basılmamış EditText içeriğini SharedPreferences'tan
              // yeniden okuyup sıfırlardı), sadece ilgili durum metnini/butonunu
              // yerinde güncelleyen hafif bir geri çağırma burada tutuluyor.
              java.util.HashMap<String, Runnable> signatureRefreshCallbacks = new java.util.HashMap<>();

              String sanitizeSignatureName(String name) {
                  if (name == null || name.trim().isEmpty()) return "_";
                  return name.trim().replaceAll("[^a-zA-Z0-9ığüşöçİĞÜŞÖÇıİ_-]", "_");
              }

              File signatureDir() {
                  File dir = new File(getFilesDir(), "imzalar");
                  if (!dir.exists()) dir.mkdirs();
                  return dir;
              }

              File signatureFile(String target) {
                  return new File(signatureDir(), sanitizeSignatureName(target) + ".png");
              }

              boolean hasSignature(String target) {
                  return signatureFile(target).exists();
              }

              void pickSignatureFor(String target) {
                  pendingSignatureTarget = target;
                  Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                  intent.setType("image/*");
                  try {
                      startActivityForResult(intent, REQUEST_PICK_SIGNATURE);
                  } catch (Exception e) {
                      Toast.makeText(this, "Görsel seçici açılamadı.", Toast.LENGTH_SHORT).show();
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != REQUEST_PICK_SIGNATURE) return;
                  if (resultCode != RESULT_OK || data == null || data.getData() == null) {
                      pendingSignatureTarget = "";
                      return;
                  }
                  Uri uri = data.getData();
                  String target = pendingSignatureTarget;
                  pendingSignatureTarget = "";
                  boolean saved = false;
                  try (InputStream in = getContentResolver().openInputStream(uri);
                       FileOutputStream out = new FileOutputStream(signatureFile(target))) {
                      if (in != null) {
                          byte[] buf = new byte[4096];
                          int len;
                          while ((len = in.read(buf)) > 0) out.write(buf, 0, len);
                          saved = true;
                      }
                  } catch (Exception e) {
                      saved = false;
                  }
                  Toast.makeText(this, saved ? "İmza kaydedildi." : "İmza kaydedilemedi.", Toast.LENGTH_SHORT).show();
                  Runnable refresh = signatureRefreshCallbacks.get(target);
                  if (refresh != null) refresh.run();
              }

              void navigateBack() {
                  if ("home".equals(currentPage)) {
                      super.onBackPressed();
                      return;
                  }
                  if (("newRecord".equals(currentPage) || "complete".equals(currentPage)) && pendingBack != null) {
                      pendingBack.run();
                  } else if ("continue".equals(currentPage)) {
                      confirmExitContinue();
                  } else if ("trainDefaults".equals(currentPage) || "peopleList".equals(currentPage)
                          || "settingsPersonnelInfo".equals(currentPage) || "settingsPeopleSignatures".equals(currentPage)) {
                      settings();
                  } else {
                      home();
                  }
              }

              String formatTrainName(String tName) {
                  if (tName == null) return "";
                  String upper = tName.toUpperCase(new Locale("tr", "TR"));
                  if (upper.startsWith("İPTAL") || upper.contains("TATİL") || upper.contains("GÜN") || upper.contains("İZİN") || upper.startsWith("DESTEK")) {
                      return upper;
                  }
                  return "TREN " + tName;
              }

