name: 4011 Model APK v0.6.1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v5

      - name: Android projesini oluştur
        shell: bash
        run: |
          set -e
          mkdir -p puantaj/app/src/main/java/com/furkan/puantaj
          mkdir -p puantaj/app/src/main/res/values
          mkdir -p puantaj/app/src/main/res/drawable-nodpi
          mkdir -p puantaj/app/src/main/res/drawable
          mkdir -p puantaj/app/src/main/res/mipmap-anydpi-v26

          test -s "$GITHUB_WORKSPACE/puantaj_app_icon.png" || touch "$GITHUB_WORKSPACE/puantaj_app_icon.png"
          cp "$GITHUB_WORKSPACE/puantaj_app_icon.png" puantaj/app/src/main/res/drawable-nodpi/puantaj_icon.png || true

          cat > puantaj/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PuantajAndroid"
          include(":app")
          EOF

          cat > puantaj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > puantaj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > puantaj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.furkan.puantaj'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.furkan.puantaj'
                  minSdk 26
                  targetSdk 35
                  versionCode 35
                  versionName '0.6.1'
              }
          }
          dependencies {
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > puantaj/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/Theme.Puantaj"
                  android:label="4011 Model"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > puantaj/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/puantaj_icon_background" />
              <foreground android:drawable="@drawable/puantaj_icon_foreground" />
          </adaptive-icon>
          EOF

          cat > puantaj/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/puantaj_icon_background" />
              <foreground android:drawable="@drawable/puantaj_icon_foreground" />
          </adaptive-icon>
          EOF

          cat > puantaj/app/src/main/res/drawable/puantaj_icon_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/puantaj_icon"
              android:gravity="fill" />
          EOF

          cat > puantaj/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="puantaj_icon_background">#09070F</color>
          </resources>
          EOF

          cat > puantaj/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.Puantaj" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#09070F</item>
                  <item name="android:navigationBarColor">#09070F</item>
                  <item name="colorPrimary">#B026FF</item>
                  <item name="colorSecondary">#39FF14</item>
              </style>
          </resources>
          EOF

          cat > puantaj/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">4011 Model</string>
          </resources>
          EOF

          cat > puantaj/app/src/main/java/com/furkan/puantaj/MainActivity.java <<'EOF'
          package com.furkan.puantaj;
          
          import android.app.*;
          import android.os.Bundle;
          import android.content.*;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.text.InputType;
          import android.view.*;
          import android.widget.*;
          import com.google.android.material.textfield.TextInputEditText;
          import com.google.android.material.textfield.TextInputLayout;
          import java.text.SimpleDateFormat;
          import java.util.*;
          
          public class MainActivity extends Activity {
              LinearLayout root;
              SharedPreferences prefs;
              ArrayList<String> records = new ArrayList<>();
          
              String selectedStart = "";
              String selectedStartDate = "";
              String selectedFinish = "";
              String selectedFinishDate = "";
              String currentPage = "home";
              
              String tempTrain = "";
              String tempPerson = "";
              String tempOwner = "";

              static final String DEFAULT_PEOPLE = "Hazım|Ender|Yücel|Emirhan|Melike";
              
              // Renk Paleti (Uzay & Neon)
              int C_BG = Color.parseColor("#09070F");
              int C_CARD = Color.parseColor("#151221");
              int C_NEON_PURPLE = Color.parseColor("#B026FF");
              int C_NEON_GREEN = Color.parseColor("#39FF14");
              int C_TEXT_W = Color.parseColor("#FFFFFF");
              int C_TEXT_G = Color.parseColor("#A09DB0");

              ArrayList<String> ownerList() {
                  String raw = prefs.getString("owner_list", DEFAULT_PEOPLE);
                  ArrayList<String> list = new ArrayList<>();
                  for (String x : raw.split("\\|", -1)) {
                      x = x.trim();
                      if (!x.isEmpty() && !list.contains(x)) list.add(x);
                  }
                  if (list.isEmpty()) {
                      for (String x : DEFAULT_PEOPLE.split("\\|", -1)) list.add(x);
                  }
                  return list;
              }

              void saveOwnerList(ArrayList<String> list) {
                  StringBuilder b = new StringBuilder();
                  for (String x : list) {
                      if (b.length() > 0) b.append("|");
                      b.append(x.replace("|", ""));
                  }
                  prefs.edit().putString("owner_list", b.toString()).apply();
              }

              int getHotelNightsMax() { return prefs.getInt("hotel_nights_max", 4); }
              void setHotelNightsMax(int v) { prefs.edit().putInt("hotel_nights_max", v).apply(); }

              void rememberOwner(String owner) {
                  if (owner != null && !owner.trim().isEmpty()) {
                      prefs.edit().putString("last_owner", owner.trim()).apply();
                  }
              }
          
              int dp(float v) {
                  return (int)(v * getResources().getDisplayMetrics().density + 0.5f);
              }
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("puantaj", MODE_PRIVATE);
                  load();
                  if (android.os.Build.VERSION.SDK_INT >= 33) {
                      getOnBackInvokedDispatcher().registerOnBackInvokedCallback(
                              android.window.OnBackInvokedDispatcher.PRIORITY_DEFAULT,
                              this::navigateBack);
                  }
                  home();
              }

              @Override
              public void onBackPressed() { navigateBack(); }

              void navigateBack() {
                  if ("home".equals(currentPage)) { super.onBackPressed(); return; }
                  if ("complete".equals(currentPage) || "continue".equals(currentPage)) { ongoing(); } 
                  else { home(); }
              }

              String formatTrainName(String tName) {
                  if (tName == null) return "";
                  String upper = tName.toUpperCase(new Locale("tr", "TR"));
                  if (upper.startsWith("İPTAL") || upper.contains("TATİL") || upper.contains("GÜN") || upper.contains("İZİN") || upper.startsWith("DESTEK")) {
                      return upper;
                  }
                  return "TREN " + tName;
              }

              boolean isSpecialLabel(String v) {
                  if (v == null || v.isEmpty()) return false;
                  return v.equals("Hafta Tatili") || v.equals("Boş Gün") || v.equals("Yıllık İzin") ||
                          v.startsWith("İptal") || v.startsWith("Destek");
              }
          
              GradientDrawable neonCard(int solidColor, int strokeColor, float radius) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(solidColor);
                  g.setCornerRadius(dp(radius));
                  g.setStroke(dp(1.5f), strokeColor);
                  return g;
              }
          
              TextView text(String s, float size, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setTypeface(Typeface.DEFAULT, bold ? Typeface.BOLD : Typeface.NORMAL);
                  return t;
              }
          
              TextView title(String s) {
                  TextView t = text(s, 28, C_TEXT_W, true);
                  t.setPadding(0, 0, 0, dp(4));
                  return t;
              }
          
              TextView subtitle(String s) {
                  TextView t = text(s, 14, C_TEXT_G, false);
                  t.setPadding(0, 0, 0, dp(16));
                  return t;
              }
          
              Button actionButton(String label, int neonColor) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextSize(14);
                  b.setTextColor(C_TEXT_W);
                  b.setAllCaps(false);
                  b.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  b.setMinHeight(dp(56));
                  b.setBackground(neonCard(C_CARD, neonColor, 16));
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, -2);
                  p.setMargins(0, dp(6), 0, dp(6));
                  b.setLayoutParams(p);
                  return b;
              }
              
              Button gridButton(String label) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextSize(13);
                  b.setTextColor(C_TEXT_W);
                  b.setAllCaps(false);
                  b.setGravity(Gravity.CENTER);
                  b.setPadding(dp(8),dp(8),dp(8),dp(8));
                  b.setBackground(neonCard(C_CARD, Color.parseColor("#3A3554"), 12));
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(0, dp(70), 1f);
                  p.setMargins(dp(4), dp(4), dp(4), dp(4));
                  b.setLayoutParams(p);
                  return b;
              }

              void setupScreen(boolean scrollable) {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(16), dp(24), dp(16), dp(16));
                  root.setBackgroundColor(C_BG);
                  
                  if (scrollable) {
                      ScrollView scroll = new ScrollView(this);
                      scroll.setFillViewport(true);
                      scroll.addView(root);
                      setContentView(scroll);
                  } else {
                      setContentView(root);
                  }
              }
          
              void home() {
                  currentPage = "home";
                  setupScreen(false); // Tek ekran Dashboard

                  root.addView(title("4011 KONTROL PANELI"));
                  root.addView(subtitle("Uzay derinliğinde kayıt, yeryüzünde rahatlık."));
          
                  LinearLayout hero = new LinearLayout(this);
                  hero.setOrientation(LinearLayout.VERTICAL);
                  hero.setPadding(dp(20), dp(20), dp(20), dp(20));
                  hero.setBackground(neonCard(C_CARD, C_NEON_PURPLE, 20));
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, 0, 1f);
                  p.setMargins(0, dp(8), 0, dp(16));
                  hero.setLayoutParams(p);
                  
                  hero.addView(text("GÜNCEL DURUM", 12, C_NEON_PURPLE, true));
                  hero.addView(text(new SimpleDateFormat("dd MMMM yyyy", new Locale("tr","TR")).format(new Date()), 24, C_TEXT_W, true));
                  
                  int activeCount = 0;
                  for (String r : records) {
                      String[] a = r.split("\\|", -1);
                      if (a.length >= 7 && (a[6].equals("OPEN") || a[6].equals("HOTEL"))) activeCount++;
                  }
                  
                  View spacer = new View(this);
                  spacer.setLayoutParams(new LinearLayout.LayoutParams(-1, 0, 1f));
                  hero.addView(spacer);
                  
                  if (activeCount > 0) {
                      hero.addView(text("● " + activeCount + " Aktif Görev", 16, C_NEON_GREEN, true));
                  } else {
                      hero.addView(text("Aktif görev bulunmuyor.", 14, C_TEXT_G, false));
                  }
                  root.addView(hero);
          
                  Button n = actionButton("＋ Yeni Görev Başlat", C_NEON_PURPLE);
                  root.addView(n);
                  n.setOnClickListener(v -> newRecord());
          
                  Button o = actionButton("↻ Devam Eden Kayıtlar", activeCount > 0 ? C_NEON_GREEN : Color.parseColor("#3A3554"));
                  root.addView(o);
                  o.setOnClickListener(v -> ongoing());
          
                  LinearLayout bottomRow = new LinearLayout(this);
                  bottomRow.setOrientation(LinearLayout.HORIZONTAL);
                  Button m = actionButton("▦ Kayıtlar", Color.parseColor("#3A3554"));
                  Button s = actionButton("⚙ Ayarlar", Color.parseColor("#3A3554"));
                  
                  LinearLayout.LayoutParams bp = new LinearLayout.LayoutParams(0, -2, 1f);
                  bp.setMargins(0,0,dp(4),0);
                  m.setLayoutParams(bp);
                  
                  LinearLayout.LayoutParams bp2 = new LinearLayout.LayoutParams(0, -2, 1f);
                  bp2.setMargins(dp(4),0,0,0);
                  s.setLayoutParams(bp2);
                  
                  bottomRow.addView(m);
                  bottomRow.addView(s);
                  root.addView(bottomRow);
                  
                  m.setOnClickListener(v -> monthly());
                  s.setOnClickListener(v -> home()); // Ayarlar şimdilik hızlı geçiş için dashboard'da tutuldu.
              }
              
              void showInputDialog(String title, String currentVal, String[] quickOptions, android.core.Consumer<String> onSave) {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(20), dp(10), dp(20), dp(10));
                  
                  EditText input = new EditText(this);
                  input.setText(currentVal);
                  input.setTextColor(C_TEXT_W);
                  input.setBackgroundColor(Color.TRANSPARENT);
                  box.addView(input);
                  
                  if (quickOptions != null && quickOptions.length > 0) {
                      TextView lbl = text("Hızlı Seçim", 12, C_NEON_PURPLE, true);
                      lbl.setPadding(0, dp(10), 0, dp(5));
                      box.addView(lbl);
                      for (String opt : quickOptions) {
                          Button b = new Button(this);
                          b.setText(opt);
                          b.setBackgroundColor(Color.TRANSPARENT);
                          b.setTextColor(C_TEXT_W);
                          b.setGravity(Gravity.LEFT|Gravity.CENTER_VERTICAL);
                          b.setOnClickListener(v -> input.setText(opt));
                          box.addView(b);
                      }
                  }
                  
                  new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                          .setTitle(title)
                          .setView(box)
                          .setPositiveButton("Kaydet", (d, w) -> onSave.accept(input.getText().toString().trim()))
                          .setNegativeButton("İptal", null)
                          .show();
              }

              void showListDialog(String title, ArrayList<String> items, android.core.Consumer<String> onSelect) {
                  String[] arr = items.toArray(new String[0]);
                  new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                          .setTitle(title)
                          .setItems(arr, (d, w) -> onSelect.accept(arr[w]))
                          .show();
              }
          
              void newRecord() {
                  currentPage = "newRecord";
                  setupScreen(false); // Kaydırma yok, tek ekran
          
                  root.addView(title("YENİ GÖREV"));
                  root.addView(subtitle("Tüm parametreler tek ekranda."));
                  
                  selectedStartDate = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault()).format(new Date());
                  selectedStart = "";
                  tempTrain = "";
                  tempPerson = "";
                  tempOwner = "";
          
                  LinearLayout grid1 = new LinearLayout(this);
                  grid1.setOrientation(LinearLayout.HORIZONTAL);
                  Button btnDate = gridButton("Tarih\n" + selectedStartDate);
                  Button btnTime = gridButton("Saat\nSeçilmedi");
                  grid1.addView(btnDate);
                  grid1.addView(btnTime);
                  root.addView(grid1);
                  
                  LinearLayout grid2 = new LinearLayout(this);
                  grid2.setOrientation(LinearLayout.HORIZONTAL);
                  Button btnTrain = gridButton("Tren No\nSeçilmedi");
                  Button btnPerson = gridButton("Kiminle\nSeçilmedi");
                  grid2.addView(btnTrain);
                  grid2.addView(btnPerson);
                  root.addView(grid2);
                  
                  Button btnOwner = actionButton("Teslim / Tesellüm: Seçilmedi", Color.parseColor("#3A3554"));
                  root.addView(btnOwner);
                  
                  View spacer = new View(this);
                  spacer.setLayoutParams(new LinearLayout.LayoutParams(-1, 0, 1f));
                  root.addView(spacer);
                  
                  Button btnSpecial = actionButton("★ İzin / İptal Ekle", Color.parseColor("#E6C864"));
                  root.addView(btnSpecial);
                  
                  btnDate.setOnClickListener(v -> chooseDate(btnDate, true, "Tarih\n"));
                  btnTime.setOnClickListener(v -> chooseTime(btnTime, true, "Saat\n"));
                  
                  btnTrain.setOnClickListener(v -> showInputDialog("Tren No", tempTrain, 
                      new String[]{"23201", "23202", "13102", "13104", "53503"}, 
                      val -> { tempTrain = val; btnTrain.setText("Tren No\n" + val); btnTrain.setBackground(neonCard(C_CARD, C_NEON_PURPLE, 12)); }));
                      
                  btnPerson.setOnClickListener(v -> showInputDialog("Kiminle Gittin?", tempPerson, null, 
                      val -> { tempPerson = val; btnPerson.setText("Kiminle\n" + val); btnPerson.setBackground(neonCard(C_CARD, C_NEON_PURPLE, 12)); }));
                  
                  btnOwner.setOnClickListener(v -> showListDialog("Teslim / Tesellüm", ownerList(), 
                      val -> { tempOwner = val; btnOwner.setText("Teslim / Tesellüm: " + val); btnOwner.setBackground(neonCard(C_CARD, C_NEON_PURPLE, 16)); }));
                  
                  btnSpecial.setOnClickListener(v -> {
                      showListDialog("Özel Durum", new ArrayList<>(Arrays.asList("Hafta Tatili", "Boş Gün", "Yıllık İzin", "İptal", "İptal Destek 1")), val -> {
                          tempTrain = val; tempPerson = "-"; tempOwner = "-";
                          btnTrain.setText("Tren No\n" + val);
                          btnPerson.setText("Kiminle\n-");
                          btnOwner.setText("Teslim / Tesellüm: -");
                      });
                  });
          
                  LinearLayout actionRow = new LinearLayout(this);
                  actionRow.setOrientation(LinearLayout.HORIZONTAL);
                  Button cancel = actionButton("İptal", Color.parseColor("#3A3554"));
                  Button save = actionButton("Başlat", C_NEON_GREEN);
                  
                  LinearLayout.LayoutParams lp1 = new LinearLayout.LayoutParams(0, -2, 1f);
                  lp1.setMargins(0,0,dp(4),0);
                  cancel.setLayoutParams(lp1);
                  
                  LinearLayout.LayoutParams lp2 = new LinearLayout.LayoutParams(0, -2, 2f);
                  lp2.setMargins(dp(4),0,0,0);
                  save.setLayoutParams(lp2);
                  
                  actionRow.addView(cancel);
                  actionRow.addView(save);
                  root.addView(actionRow);
                  
                  cancel.setOnClickListener(v -> home());
                  save.setOnClickListener(v -> {
                      if (isSpecialLabel(tempTrain)) {
                          String record = UUID.randomUUID().toString() + "|" + selectedStartDate + "|-|" + tempTrain + "|00:00|-|DONE|" + selectedStartDate + "|00:00|-|" + selectedStartDate + " 00:00";
                          records.add(record);
                          persist();
                          home();
                          return;
                      }
                      if (tempPerson.isEmpty() || tempTrain.isEmpty() || tempOwner.isEmpty() || selectedStart.isEmpty()) {
                          Toast.makeText(this, "Eksik bilgi var.", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      String record = UUID.randomUUID().toString() + "|" + selectedStartDate + "|" + tempPerson + "|" + tempTrain + "|" + selectedStart + "|" + tempOwner + "|OPEN";
                      records.add(record);
                      rememberOwner(tempOwner);
                      persist();
                      home();
                  });
              }
          
              void chooseDate(Button target, boolean start, String prefix) {
                  Calendar c = Calendar.getInstance();
                  new DatePickerDialog(this, (view, year, month, day) -> {
                      String v = String.format(Locale.getDefault(), "%02d.%02d.%04d", day, month + 1, year);
                      if (start) selectedStartDate = v; else selectedFinishDate = v;
                      target.setText(prefix + v);
                      target.setBackground(neonCard(C_CARD, C_NEON_PURPLE, 12));
                  }, c.get(Calendar.YEAR), c.get(Calendar.MONTH), c.get(Calendar.DAY_OF_MONTH)).show();
              }
          
              void chooseTime(Button target, boolean start, String prefix) {
                  Calendar c = Calendar.getInstance();
                  new TimePickerDialog(this, (view, hour, minute) -> {
                      String v = String.format(Locale.getDefault(), "%02d:%02d", hour, minute);
                      if (start) selectedStart = v; else selectedFinish = v;
                      target.setText(prefix + v);
                      target.setBackground(neonCard(C_CARD, C_NEON_PURPLE, 12));
                  }, c.get(Calendar.HOUR_OF_DAY), c.get(Calendar.MINUTE), true).show();
              }

              void ongoing() {
                  currentPage = "ongoing";
                  setupScreen(true); // Kayıtlar çoğalabileceği için kaydırmalı
                  root.addView(title("AKTİF GÖREVLER"));
                  
                  boolean found = false;
                  for (String r : new ArrayList<>(records)) {
                      String[] a = r.split("\\|", -1);
                      if (a.length < 7) continue;
                      String status = a[6];
                      if (!status.equals("OPEN") && !status.equals("HOTEL")) continue;

                      found = true;
                      LinearLayout c = new LinearLayout(this);
                      c.setOrientation(LinearLayout.VERTICAL);
                      c.setPadding(dp(16), dp(16), dp(16), dp(16));
                      c.setBackground(neonCard(C_CARD, status.equals("HOTEL") ? C_NEON_PURPLE : C_NEON_GREEN, 16));
                      LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, -2);
                      p.setMargins(0, 0, 0, dp(12));
                      c.setLayoutParams(p);
                      
                      c.addView(text(formatTrainName(a[3]), 18, C_TEXT_W, true));
                      c.addView(text(a[1] + " • " + a[2], 14, C_TEXT_G, false));
                      c.addView(text("Başlangıç: " + a[4] + " • Tesellüm: " + a[5], 14, C_TEXT_W, false));

                      if (status.equals("HOTEL")) {
                          Button b = actionButton("Treni Devam Ettir", C_NEON_PURPLE);
                          c.addView(b);
                          b.setOnClickListener(v -> continueFromHotel(r));
                      } else {
                          Button b = actionButton("Sonlandır / Otele Geç", C_NEON_GREEN);
                          c.addView(b);
                          b.setOnClickListener(v -> complete(r));
                      }
                      root.addView(c);
                  }

                  if (!found) {
                      root.addView(subtitle("Aktif görev yok."));
                  }
                  
                  Button back = actionButton("Ana Sayfa", Color.parseColor("#3A3554"));
                  root.addView(back);
                  back.setOnClickListener(v -> home());
              }

              void complete(String r) {
                  currentPage = "complete";
                  String[] a = r.split("\\|", -1);
                  setupScreen(false); // Tek ekran
                  
                  root.addView(title("GÖREV SONU"));
                  root.addView(subtitle(formatTrainName(a[3]) + " • " + a[2]));

                  selectedFinish = "";
                  selectedFinishDate = a[1];
                  tempOwner = "";
                  final int[] hotelNights = {0};

                  LinearLayout grid = new LinearLayout(this);
                  grid.setOrientation(LinearLayout.HORIZONTAL);
                  Button btnDate = gridButton("Tarih\n" + selectedFinishDate);
                  Button btnTime = gridButton("Saat\nSeçilmedi");
                  grid.addView(btnDate);
                  grid.addView(btnTime);
                  root.addView(grid);
                  
                  Button btnOwner = actionButton("Teslim / Tesellüm: Seçilmedi", Color.parseColor("#3A3554"));
                  root.addView(btnOwner);
                  
                  Button btnHotel = actionButton("Otel Konaklaması: 0 Gece", Color.parseColor("#3A3554"));
                  root.addView(btnHotel);

                  View spacer = new View(this);
                  spacer.setLayoutParams(new LinearLayout.LayoutParams(-1, 0, 1f));
