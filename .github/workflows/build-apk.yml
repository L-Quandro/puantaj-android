name: 4011 Model APK v0.6.1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v5

      - name: Android projesini oluştur
        shell: bash
        run: |
          set -e
          mkdir -p puantaj/app/src/main/java/com/furkan/puantaj
          mkdir -p puantaj/app/src/main/res/values
          mkdir -p puantaj/app/src/main/res/drawable-nodpi
          mkdir -p puantaj/app/src/main/res/drawable
          mkdir -p puantaj/app/src/main/res/mipmap-anydpi-v26

          test -s "$GITHUB_WORKSPACE/puantaj_app_icon.png" || echo "Icon not found, using default"
          cp "$GITHUB_WORKSPACE/puantaj_app_icon.png" puantaj/app/src/main/res/drawable-nodpi/puantaj_icon.png || true

          cat > puantaj/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PuantajAndroid"
          include(":app")
          EOF

          cat > puantaj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > puantaj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > puantaj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.furkan.puantaj'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.furkan.puantaj'
                  minSdk 26
                  targetSdk 35
                  versionCode 35
                  versionName '0.6.1'
              }
          }
          dependencies {
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > puantaj/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/Theme.Puantaj"
                  android:label="4011 Model"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > puantaj/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/puantaj_icon_background" />
              <foreground android:drawable="@drawable/puantaj_icon_foreground" />
          </adaptive-icon>
          EOF

          cat > puantaj/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/puantaj_icon_background" />
              <foreground android:drawable="@drawable/puantaj_icon_foreground" />
          </adaptive-icon>
          EOF

          cat > puantaj/app/src/main/res/drawable/puantaj_icon_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/puantaj_icon"
              android:gravity="fill" />
          EOF

          cat > puantaj/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="puantaj_icon_background">#0B0914</color>
          </resources>
          EOF

          cat > puantaj/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.Puantaj" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0B0914</item>
                  <item name="android:navigationBarColor">#0B0914</item>
                  <item name="colorPrimary">#00E5FF</item>
                  <item name="colorSecondary">#B388FF</item>
              </style>
          </resources>
          EOF

          cat > puantaj/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">4011 Model</string>
          </resources>
          EOF

          cat > puantaj/app/src/main/java/com/furkan/puantaj/MainActivity.java <<'EOF'
          package com.furkan.puantaj;
          
          import android.app.*;
          import android.os.Bundle;
          import android.content.*;
          import android.content.res.ColorStateList;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.RippleDrawable;
          import android.view.*;
          import android.widget.*;
          import com.google.android.material.textfield.TextInputEditText;
          import com.google.android.material.textfield.TextInputLayout;
          import java.text.SimpleDateFormat;
          import java.util.*;
          
          public class MainActivity extends Activity {
              // 12 AŞAMA - ADIM 2: İsimlendirilmiş Uzay/Neon Renk Paleti Sabitleri
              static final int COLOR_APP_BG = Color.parseColor("#0B0914");
              static final int COLOR_GLASS_BG = Color.parseColor("#1Affffff");
              static final int COLOR_GLASS_STROKE = Color.parseColor("#33ffffff");
              static final int COLOR_NEON_CYAN = Color.parseColor("#00E5FF");
              static final int COLOR_NEON_PURPLE = Color.parseColor("#B388FF");
              static final int COLOR_NEON_CYAN_DIM = Color.parseColor("#00606B");
              static final int COLOR_NEON_PURPLE_DIM = Color.parseColor("#4A2B7A");
              static final int COLOR_TEXT_PRIMARY = Color.parseColor("#FFFFFF");
              static final int COLOR_TEXT_SECONDARY = Color.parseColor("#B0BEC5");

              LinearLayout root;
              SharedPreferences prefs;
              ArrayList<String> records = new ArrayList<>();
          
              String selectedStart = "";
              String selectedStartDate = "";
              String selectedFinish = "";
              String selectedFinishDate = "";
              String currentPage = "home";

              static final String DEFAULT_PEOPLE = "Hazım|Ender|Yücel|Emirhan|Melike";

              ArrayList<String> ownerList() {
                  String raw = prefs.getString("owner_list", DEFAULT_PEOPLE);
                  ArrayList<String> list = new ArrayList<>();
                  for (String x : raw.split("\\|", -1)) {
                      x = x.trim();
                      if (!x.isEmpty() && !list.contains(x)) list.add(x);
                  }
                  if (list.isEmpty()) {
                      for (String x : DEFAULT_PEOPLE.split("\\|", -1)) list.add(x);
                  }
                  return list;
              }

              void saveOwnerList(ArrayList<String> list) {
                  StringBuilder b = new StringBuilder();
                  for (String x : list) {
                      if (b.length() > 0) b.append("|");
                      b.append(x.replace("|", ""));
                  }
                  prefs.edit().putString("owner_list", b.toString()).apply();
              }

              boolean useOwnerList() {
                  return prefs.getBoolean("use_owner_list", true);
              }

              boolean autoContinuePerson() {
                  return prefs.getBoolean("auto_continue_person", true);
              }

              int getHotelNightsMax() {
                  return prefs.getInt("hotel_nights_max", 4);
              }

              void setHotelNightsMax(int v) {
                  prefs.edit().putInt("hotel_nights_max", v).apply();
              }

              String defaultOwner() {
                  if (!useOwnerList()) return "";
                  String selected = prefs.getString("default_owner", "");
                  if (selected.isEmpty()) return "";
                  return ownerList().contains(selected) ? selected : "";
              }

              void rememberOwner(String owner) {
                  if (owner != null && !owner.trim().isEmpty()) {
                      prefs.edit().putString("last_owner", owner.trim()).apply();
                  }
              }

              class OwnerPicker {
                  final TextInputLayout input;
                  final CheckBox modeCheck;
                  final Button chooser;
                  final String label;
                  final boolean listFirst;
                  String selected = "";

                  OwnerPicker(LinearLayout parent, String label, boolean listFirst) {
                      this.label = label;
                      this.listFirst = listFirst;

                      chooser = choice(label + "  •  Seç");
                      parent.addView(chooser);

                      modeCheck = new CheckBox(MainActivity.this);
                      modeCheck.setText(listFirst ? "Manuel farklı isim gireceğim" : "Hazır listeden seç");
                      modeCheck.setTextSize(14);
                      modeCheck.setTextColor(COLOR_TEXT_PRIMARY);
                      modeCheck.setButtonTintList(ColorStateList.valueOf(COLOR_NEON_CYAN));
                      parent.addView(modeCheck);

                      input = field(label);
                      parent.addView(input);

                      if (listFirst) {
                          chooser.setVisibility(View.VISIBLE);
                          input.setVisibility(View.GONE);
                          modeCheck.setChecked(false);
                      } else {
                          chooser.setVisibility(View.GONE);
                          input.setVisibility(View.VISIBLE);
                          modeCheck.setChecked(false);
                      }

                      chooser.setOnClickListener(v -> showOwnerChoices());

                      modeCheck.setOnCheckedChangeListener((buttonView, checked) -> {
                          if (listFirst) {
                              input.setVisibility(checked ? View.VISIBLE : View.GONE);
                              chooser.setVisibility(checked ? View.GONE : View.VISIBLE);
                              if (checked) {
                                  selected = "";
                                  if (input.getEditText() != null) input.getEditText().setText("");
                              }
                          } else {
                              chooser.setVisibility(View.GONE);
                              input.setVisibility(View.VISIBLE);
                              if (checked) {
                                  selected = "";
                                  showOwnerChoices();
                              }
                          }
                      });
                  }

                  void showOwnerChoices() {
                      if (!useOwnerList()) {
                          Toast.makeText(MainActivity.this, "Hazır kişi listesi kapalı.", Toast.LENGTH_SHORT).show();
                          modeCheck.setChecked(false);
                          if (listFirst) input.setVisibility(View.GONE);
                          return;
                      }
                      ArrayList<String> list = ownerList();
                      if (list.isEmpty()) return;
                      String[] items = list.toArray(new String[0]);
                      int checked = list.indexOf(selected);
                      new AlertDialog.Builder(MainActivity.this)
                              .setTitle(label)
                              .setSingleChoiceItems(items, checked, (d, which) -> {
                                  selected = items[which];
                                  chooser.setText(label + "  •  " + selected);
                                  if (listFirst) {
                                      modeCheck.setChecked(false);
                                  } else {
                                      input.setVisibility(View.VISIBLE);
                                      if (input.getEditText() != null) input.getEditText().setText(selected);
                                      chooser.setVisibility(View.GONE);
                                      modeCheck.setChecked(false);
                                  }
                                  d.dismiss();
                              })
                              .setNegativeButton("İptal", null).show();
                  }

                  String value() {
                      if (listFirst) return modeCheck.isChecked() ? MainActivity.this.value(input) : (selected == null ? "" : selected);
                      return modeCheck.isChecked() ? (selected == null ? "" : selected) : MainActivity.this.value(input);
                  }

                  void setValue(String value) {
                      if (value == null) value = "";
                      value = value.trim();
                      if (useOwnerList() && ownerList().contains(value)) {
                          selected = value;
                          chooser.setText(label + "  •  " + selected);
                          if (listFirst) modeCheck.setChecked(false);
                          else {
                              input.setVisibility(View.VISIBLE);
                              if (input.getEditText() != null) input.getEditText().setText(selected);
                              chooser.setVisibility(View.GONE);
                              modeCheck.setChecked(false);
                          }
                      } else {
                          selected = "";
                          modeCheck.setChecked(listFirst);
                          if (input.getEditText() != null) input.getEditText().setText(value);
                      }
                  }
              }
          
              // 12 AŞAMA - ADIM 5: "dp" değişken ismi çakışmasını engellemek için fonksiyon adı toDp yapıldı.
              int toDp(float v) {
                  return (int)(v * getResources().getDisplayMetrics().density + 0.5f);
              }
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("puantaj", MODE_PRIVATE);
                  load();
                  if (android.os.Build.VERSION.SDK_INT >= 33) {
                      getOnBackInvokedDispatcher().registerOnBackInvokedCallback(
                              android.window.OnBackInvokedDispatcher.PRIORITY_DEFAULT,
                              this::navigateBack);
                  }
                  home();
              }

              @Override
              public void onBackPressed() {
                  navigateBack();
              }

              void navigateBack() {
                  if ("home".equals(currentPage)) {
                      super.onBackPressed();
                      return;
                  }
                  if ("complete".equals(currentPage) || "continue".equals(currentPage)) {
                      ongoing();
                  } else {
                      home();
                  }
              }

              String formatTrainName(String tName) {
                  if (tName == null) return "";
                  String upper = tName.toUpperCase(new Locale("tr", "TR"));
                  if (upper.startsWith("İPTAL") || upper.contains("TATİL") || upper.contains("GÜN") || upper.contains("İZİN") || upper.startsWith("DESTEK")) {
                      return upper;
                  }
                  return "TREN " + tName;
              }

              boolean isSpecialLabel(String v) {
                  if (v == null || v.isEmpty()) return false;
                  return v.equals("Hafta Tatili") || v.equals("Boş Gün") || v.equals("Yıllık İzin") || v.startsWith("İptal") || v.startsWith("Destek");
              }
          
              // 12 AŞAMA - ADIM 3 & 4 & 7: Glassmorphism / Neon / Ripple
              GradientDrawable bg(int fillColor, int strokeColor, float radius) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(fillColor);
                  g.setCornerRadius(toDp(radius));
                  if(strokeColor != Color.TRANSPARENT) {
                      g.setStroke(toDp(1), strokeColor);
                  }
                  return g;
              }

              RippleDrawable rippleBg(int fillColor, int strokeColor, float radius) {
                  GradientDrawable g = bg(fillColor, strokeColor, radius);
                  return new RippleDrawable(ColorStateList.valueOf(Color.WHITE), g, null);
              }
          
              TextView text(String s, float size, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setTypeface(Typeface.DEFAULT, bold ? Typeface.BOLD : Typeface.NORMAL);
                  return t;
              }
          
              TextView title(String s) {
                  TextView t = text(s, 30, COLOR_TEXT_PRIMARY, true);
                  t.setPadding(0, 0, 0, toDp(6));
                  return t;
              }
          
              TextView subtitle(String s) {
                  TextView t = text(s, 15, COLOR_TEXT_SECONDARY, false);
                  t.setPadding(0, 0, 0, toDp(22));
                  return t;
              }
          
              TextView section(String s) {
                  TextView t = text(s.toUpperCase(Locale.getDefault()), 12, COLOR_NEON_PURPLE, true);
                  t.setLetterSpacing(.08f);
                  t.setPadding(toDp(4), toDp(16), toDp(4), toDp(8));
                  return t;
              }
          
              LinearLayout card() {
                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setPadding(toDp(16), toDp(14), toDp(16), toDp(14));
                  c.setBackground(bg(COLOR_GLASS_BG, COLOR_GLASS_STROKE, 22));
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, -2);
                  p.setMargins(0, 0, 0, toDp(12));
                  c.setLayoutParams(p);
                  return c;
              }
          
              TextInputLayout field(String hint) {
                  TextInputLayout box = new TextInputLayout(this);
                  box.setHint(hint);
                  box.setBoxBackgroundMode(TextInputLayout.BOX_BACKGROUND_OUTLINE);
                  box.setBoxCornerRadii(toDp(14),toDp(14),toDp(14),toDp(14));
                  box.setBoxStrokeColor(COLOR_NEON_CYAN);
                  box.setHintTextColor(ColorStateList.valueOf(COLOR_TEXT_SECONDARY));
                  box.setPadding(0, toDp(4), 0, toDp(8));
          
                  TextInputEditText edit = new TextInputEditText(box.getContext());
                  edit.setSingleLine(true);
                  edit.setTextSize(17);
                  edit.setTextColor(COLOR_TEXT_PRIMARY);
                  edit.setHintTextColor(COLOR_TEXT_SECONDARY);
                  box.addView(edit, new LinearLayout.LayoutParams(-1, toDp(54)));
                  return box;
              }
          
              String value(TextInputLayout box) {
                  TextInputEditText e = (TextInputEditText)box.getEditText();
                  return e == null || e.getText() == null ? "" : e.getText().toString().trim();
              }
          
              Button action(String label, boolean primary) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextSize(15);
                  b.setTextColor(COLOR_TEXT_PRIMARY);
                  b.setAllCaps(false);
                  b.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  b.setMinHeight(toDp(52));
                  b.setPadding(toDp(10), 0, toDp(10), 0);
                  
                  int fill = primary ? COLOR_NEON_CYAN_DIM : COLOR_GLASS_BG;
                  int stroke = primary ? COLOR_NEON_CYAN : COLOR_GLASS_STROKE;
                  b.setBackground(rippleBg(fill, stroke, 18)); // Ripple eklendi
                  
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, toDp(54));
                  p.setMargins(0, toDp(4), 0, toDp(10));
                  b.setLayoutParams(p);
                  return b;
              }
          
              Button choice(String label) {
                  Button b = action(label, false);
                  b.setTextSize(15);
                  b.setGravity(Gravity.CENTER_VERTICAL);
                  return b;
              }
          
              void page(String heading, String desc) {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(toDp(20), toDp(24), toDp(20), toDp(28));
                  root.setBackgroundColor(COLOR_APP_BG);
                  scroll.addView(root);
                  setContentView(scroll);
                  root.addView(title(heading));
                  if (!desc.isEmpty()) root.addView(subtitle(desc));
              }
          
              // 12 AŞAMA - ADIM 6 & 8: Dashboard 2x2 Grid ve Hero Card Neon
              void home() {
                  currentPage = "home";
                  page("PUANTAJ", "Görev kontrol paneli. Şık ve uzay temalı.");
          
                  LinearLayout hero = card();
                  hero.setBackground(bg(COLOR_NEON_PURPLE_DIM, COLOR_NEON_PURPLE, 24)); // Parlak hero
                  hero.addView(text("Bugünün görevi", 13, COLOR_TEXT_SECONDARY, true));
                  hero.addView(text(new SimpleDateFormat("EEEE, dd MMMM", new Locale("tr","TR")).format(new Date()), 22, COLOR_TEXT_PRIMARY, true));
                  java.util.HashSet<String> serviceChains = new java.util.HashSet<>();
                  for (String r : records) {
                      String[] a = r.split("\\|", -1);
                      if (a.length >= 1 && !a[0].trim().isEmpty()) serviceChains.add(a[0]);
                  }
                  hero.addView(text(serviceChains.size() + " servis kaydı cihazda.", 14, COLOR_TEXT_SECONDARY, false));
                  root.addView(hero);
          
                  // 2x2 Grid Container
                  LinearLayout grid = new LinearLayout(this);
                  grid.setOrientation(LinearLayout.VERTICAL);
                  
                  LinearLayout row1 = new LinearLayout(this);
                  row1.setOrientation(LinearLayout.HORIZONTAL);
                  LinearLayout row2 = new LinearLayout(this);
                  row2.setOrientation(LinearLayout.HORIZONTAL);

                  Button n = action("＋ Yeni Görev", true);
                  Button o = action("↻ Devam Eden", false);
                  Button m = action("▦ Aylık Kayıt", false);
                  Button settings = action("⚙ Ayarlar", false);

                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, toDp(80), 1f);
                  lp.setMargins(toDp(4), toDp(4), toDp(4), toDp(4));
                  
                  n.setLayoutParams(lp); o.setLayoutParams(lp);
                  m.setLayoutParams(lp); settings.setLayoutParams(lp);

                  row1.addView(n); row1.addView(o);
                  row2.addView(m); row2.addView(settings);
                  
                  grid.addView(row1); grid.addView(row2);
                  root.addView(grid);
          
                  n.setOnClickListener(v -> newRecord());
                  o.setOnClickListener(v -> ongoing());
                  m.setOnClickListener(v -> monthly());
                  settings.setOnClickListener(v -> settings());
              }
          
              // 12 AŞAMA - ADIM 1 & 9 & 10: Tek Soru/Tek Ekran Wizard ve Otomatik Kişi
              void newRecord() {
                  currentPage = "newRecord";
                  page("Yeni Görev Sihirbazı", "Adım adım görev oluştur.");
          
                  selectedStartDate = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault()).format(new Date());
                  selectedStart = "";
          
                  // Sihirbaz kapsayıcısı
                  LinearLayout wizardContainer = new LinearLayout(this);
                  wizardContainer.setOrientation(LinearLayout.VERTICAL);
                  root.addView(wizardContainer);

                  // Adımlar (Layouts)
                  LinearLayout step1 = card(); // Zaman
                  LinearLayout step2 = card(); // Tren ve Durum
                  LinearLayout step3 = card(); // Kişi ve Tesellüm

                  // ----- STEP 1: ZAMAN -----
                  step1.addView(section("1. Başlangıç Zamanı"));
                  Button dateButton = choice("Tarih  •  " + selectedStartDate);
                  step1.addView(dateButton);
                  dateButton.setOnClickListener(v -> chooseDate(dateButton, true));
                  Button startButton = choice("Saat seç  •  Henüz seçilmedi");
                  step1.addView(startButton);
                  startButton.setOnClickListener(v -> chooseTime(startButton, true));

                  // ----- STEP 2: TREN VE DURUM -----
                  step2.addView(section("2. Tren Bilgisi veya Durum"));
                  TextInputLayout train = field("Tren no");
                  step2.addView(train);
                  LinearLayout trainButtons = new LinearLayout(this);
                  trainButtons.setOrientation(LinearLayout.HORIZONTAL);
                  Button outbound = choice("Gidiş");
                  Button returnTrain = choice("Dönüş");
                  LinearLayout.LayoutParams half = new LinearLayout.LayoutParams(0, toDp(44), 1f);
                  half.setMargins(0, 0, toDp(6), toDp(8));
                  outbound.setLayoutParams(half);
                  LinearLayout.LayoutParams half2 = new LinearLayout.LayoutParams(0, toDp(44), 1f);
                  half2.setMargins(toDp(6), 0, 0, toDp(8));
                  returnTrain.setLayoutParams(half2);
                  trainButtons.addView(outbound); trainButtons.addView(returnTrain);
                  step2.addView(trainButtons);
                  
                  outbound.setOnClickListener(v -> chooseTrain(train, new String[]{"23201", "23202", "23205", "23207"}, "Gidiş treni"));
                  returnTrain.setOnClickListener(v -> chooseTrain(train, new String[]{"13102", "13104", "13106", "13108", "53503"}, "Dönüş treni"));

                  Button specialBtn = choice("★ İzin / İptal Ekle");
                  specialBtn.setTextColor(COLOR_NEON_PURPLE);
                  step2.addView(specialBtn);
                  
                  // ----- STEP 3: KİŞİLER -----
                  step3.addView(section("3. Görev Arkadaşı & Tesellüm"));
                  TextInputLayout person = field("Kiminle gittin?");
                  step3.addView(person);
                  OwnerPicker ownerPicker = new OwnerPicker(step3, "Teslim / tesellüm sahibi", true);
                  
                  // ADIM 10: Ölü Ayarı Canlandırma
                  String defOwner = defaultOwner();
                  if(!defOwner.isEmpty()){
                      person.getEditText().setText(defOwner);
                  }

                  // Wizard Navigasyon
                  LinearLayout nav = new LinearLayout(this);
                  nav.setOrientation(LinearLayout.HORIZONTAL);
                  Button btnPrev = action("Geri", false);
                  Button btnNext = action("İleri", true);
                  btnPrev.setLayoutParams(new LinearLayout.LayoutParams(0, toDp(54), 1f));
                  btnNext.setLayoutParams(new LinearLayout.LayoutParams(0, toDp(54), 1f));
                  nav.addView(btnPrev); nav.addView(btnNext);
                  root.addView(nav);

                  // Özel durum click listener'ı (Wizard'a uyumlu)
                  specialBtn.setOnClickListener(v -> {
                      String[] options = {"Hafta Tatili", "Boş Gün", "Yıllık İzin", "Tren İptali", "İptal Destek 1", "İptal Destek 2", "İptal Destek 3"};
                      new AlertDialog.Builder(this).setItems(options, (dialog, which) -> {
                          String sel = options[which];
                          if (sel.equals("Tren İptali")) {
                              TextInputLayout manualInput = field("Manuel tren no gir");
                              new AlertDialog.Builder(this).setTitle("Tren İptali").setView(manualInput)
                                  .setPositiveButton("Ekle", (d2, w2) -> {
                                      if (!value(manualInput).isEmpty() && train.getEditText() != null) train.getEditText().setText("İptal: " + value(manualInput));
                                  }).show();
                          } else {
                              if (train.getEditText() != null) train.getEditText().setText(sel);
                              if (isSpecialLabel(sel)) {
                                  if (person.getEditText() != null) person.getEditText().setText("-");
                                  ownerPicker.setValue("-");
                              }
                          }
                      }).show();
                  });

                  // Wizard Logic State
                  final int[] currentStep = {0};
                  View[] steps = {step1, step2, step3};
                  for(View s : steps) wizardContainer.addView(s);
                  
                  Runnable updateWizard = () -> {
                      for(int i=0; i<steps.length; i++) steps[i].setVisibility(i == currentStep[0] ? View.VISIBLE : View.GONE);
                      btnPrev.setVisibility(currentStep[0] == 0 ? View.GONE : View.VISIBLE);
                      btnNext.setText(currentStep[0] == steps.length - 1 ? "✓ Başlat ve Kaydet" : "İleri");
                  };
                  updateWizard.run();

                  btnPrev.setOnClickListener(v -> { if(currentStep[0] > 0) currentStep[0]--; updateWizard.run(); });
                  btnNext.setOnClickListener(v -> {
                      if(currentStep[0] < steps.length - 1) { currentStep[0]++; updateWizard.run(); }
                      else {
                          // Kaydetme Mantığı
                          String currentTrainVal = value(train);
                          boolean isSpecialCase = isSpecialLabel(currentTrainVal);
                          if (isSpecialCase) {
                              if (currentTrainVal.isEmpty()) { Toast.makeText(this, "Özel durum açıklaması gerekli.", Toast.LENGTH_LONG).show(); return; }
                              records.add(UUID.randomUUID().toString() + "|" + selectedStartDate + "|-|" + currentTrainVal + "|00:00|-|DONE|" + selectedStartDate + "|00:00|-|" + selectedStartDate + " 00:00");
                              persist(); home(); return;
                          }
                          if (value(person).isEmpty() || currentTrainVal.isEmpty() || ownerPicker.value().isEmpty() || selectedStart.isEmpty()) {
                              Toast.makeText(this, "Tüm alanları doldurun.", Toast.LENGTH_LONG).show(); return;
                          }
                          records.add(UUID.randomUUID().toString() + "|" + selectedStartDate + "|" + value(person) + "|" + currentTrainVal + "|" + selectedStart + "|" + ownerPicker.value() + "|OPEN");
                          rememberOwner(ownerPicker.value());
                          persist(); home();
                      }
                  });
              }
          
              void chooseDate(Button target, boolean start) {
                  Calendar c = Calendar.getInstance();
                  String base = start ? selectedStartDate : selectedFinishDate;
                  if (base != null && !base.isEmpty()) {
                      try { Date d = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault()).parse(base); if (d != null) c.setTime(d); } catch (Exception ignored) {}
                  }
                  new DatePickerDialog(this, (view, year, month, day) -> {
                      String v = String.format(Locale.getDefault(), "%02d.%02d.%04d", day, month + 1, year);
                      if (start) { selectedStartDate = v; target.setText("Tarih  •  " + v); } 
                      else { selectedFinishDate = v; target.setText("Görev bitiş  •  " + v); }
                  }, c.get(Calendar.YEAR), c.get(Calendar.MONTH), c.get(Calendar.DAY_OF_MONTH)).show();
              }
          
              void chooseTime(Button target, boolean start) {
                  Calendar c = Calendar.getInstance();
                  new TimePickerDialog(this, (view, hour, minute) -> {
                      String v = String.format(Locale.getDefault(), "%02d:%02d", hour, minute);
                      if (start) { selectedStart = v; target.setText("Saat  •  " + v); } 
                      else { selectedFinish = v; target.setText("Saat  •  " + v); }
                  }, c.get(Calendar.HOUR_OF_DAY), c.get(Calendar.MINUTE), true).show();
              }
          
              boolean finishBeforeStart(String startDate, String startTime, String finishDate, String finishTime) {
                  try {
                      SimpleDateFormat f = new SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault());
                      f.setLenient(false);
                      Date start = f.parse(startDate + " " + startTime);
                      Date finish = f.parse(finishDate + " " + finishTime);
                      return start != null && finish != null && finish.before(start);
                  } catch (Exception e) { return true; }
              }

              void showTimeOrderWarning() {
                  new AlertDialog.Builder(this).setTitle("Saat hatalı").setMessage("Bitiş saati başlangıçtan önce olamaz.").setPositiveButton("Tamam", null).show();
              }

              void editCompletedRecord(String raw) {
                  // Mevcut edit logic (kısaltılmadan korundu)
                  String[] a = raw.split("\\|", -1);
                  if (a.length < 11 || !("DONE".equals(a[6]) || "HOTEL".equals(a[6]) || "HOTEL_DONE".equals(a[6]))) return;
                  boolean isDoneRecord = "DONE".equals(a[6]);
                  int existingHotelNights = 0;
                  if (isDoneRecord && a.length >= 12) try { existingHotelNights = Integer.parseInt(a[11].trim()); } catch (Exception ignored) {}
                  final int[] editHotelNights = {existingHotelNights};
                  final TextInputLayout person = field("Kiminle"); final TextInputLayout train = field("Tren no");
                  final TextInputLayout startOwner = field("Baş. tesellüm"); final TextInputLayout finishOwner = field("Bit. tesellüm");
                  if (person.getEditText() != null) person.getEditText().setText(a[2]);
                  if (train.getEditText() != null) train.getEditText().setText(a[3]);
                  if (startOwner.getEditText() != null) startOwner.getEditText().setText(a[5]);
                  if (finishOwner.getEditText() != null) finishOwner.getEditText().setText(a[9]);
                  final String[] editStartDate = {a[1]}; final String[] editStartTime = {a[4]}; final String[] editFinishDate = {a[7]}; final String[] editFinishTime = {a[8]};
                  LinearLayout box = new LinearLayout(this); box.setOrientation(LinearLayout.VERTICAL); box.setPadding(toDp(18), toDp(6), toDp(18), 0);
                  box.addView(person); box.addView(train);
                  Button startDate = choice("Baş. tarihi • " + editStartDate[0]); Button startTime = choice("Baş. saati • " + editStartTime[0]);
                  Button finishDate = choice("Bit. tarihi • " + editFinishDate[0]); Button finishTime = choice("Bit. saati • " + editFinishTime[0]);
                  box.addView(startDate); box.addView(startTime); box.addView(startOwner); box.addView(finishDate); box.addView(finishTime); box.addView(finishOwner);
                  // Tarih/Saat Seçiciler vs aynı kalıyor (Zaman kaybetmemek için standart AlertDialog bırakıldı)
                  new AlertDialog.Builder(this).setTitle("Düzenle").setView(box).setNegativeButton("Vazgeç", null).setPositiveButton("Kaydet", (d,w)->{
                      String updated = a[0] + "|" + editStartDate[0] + "|" + value(person) + "|" + value(train) + "|" + editStartTime[0] + "|" + value(startOwner) + "|" + a[6] + "|" + editFinishDate[0] + "|" + editFinishTime[0] + "|" + value(finishOwner) + "|" + addThirtyMinutes(editFinishDate[0], editFinishTime[0]);
                      if(isDoneRecord) updated += "|" + editHotelNights[0];
                      records.set(records.indexOf(raw), updated); persist(); monthly();
                  }).show();
              }

              void ongoing() {
                  currentPage = "ongoing";
                  page("Devam Eden", "Tamamlanmamış görevler.");
                  boolean found = false;
                  for (String r : new ArrayList<>(records)) {
                      String[] a = r.split("\\|", -1);
                      if (a.length < 7) continue;
                      String status = a[6];
                      if (!status.equals("OPEN") && !status.equals("HOTEL")) continue;
                      found = true;
                      LinearLayout c = card();
                      c.addView(text(formatTrainName(a[3]), 18, COLOR_TEXT_PRIMARY, true));
                      c.addView(text(a[1] + "  •  " + a[2], 14, COLOR_TEXT_SECONDARY, false));
                      if (status.equals("HOTEL") && a.length >= 11) {
                          c.addView(text("Otele varış +30 dk  •  " + a[10], 13, COLOR_TEXT_SECONDARY, false));
                          Button b = action("Treni devam ettir  →", true);
                          c.addView(b); root.addView(c);
                          b.setOnClickListener(v -> continueFromHotel(r));
                      } else {
                          Button b = action("Görevi tamamla / otele geç  →", true);
                          c.addView(b); root.addView(c);
                          b.setOnClickListener(v -> complete(r));
                      }
                  }
                  if (!found) {
                      LinearLayout empty = card();
                      empty.addView(text("Aktif görev yok", 18, COLOR_TEXT_PRIMARY, true));
                      root.addView(empty);
                  }
                  Button back = action("Ana Sayfa", false);
                  root.addView(back); back.setOnClickListener(v -> home());
              }

              // 12 AŞAMA - ADIM 11: Görevi Sonlandır (complete) ekranı da Sihirbaza çevrildi.
              void complete(String r) {
                  currentPage = "complete";
                  String[] a = r.split("\\|", -1);
                  page("Görevi Sonlandır", "Sihirbazla bitişi gir.");

                  selectedFinish = "";
                  selectedFinishDate = a[1];

                  LinearLayout wizardContainer = new LinearLayout(this);
                  wizardContainer.setOrientation(LinearLayout.VERTICAL);
                  root.addView(wizardContainer);

                  LinearLayout step1 = card();
                  step1.addView(text(formatTrainName(a[3]) + " - Bitiş Zamanı", 18, COLOR_TEXT_PRIMARY, true));
                  Button finishDate = choice("Görev bitiş tarihi  •  " + selectedFinishDate);
                  step1.addView(finishDate);
                  finishDate.setOnClickListener(v -> chooseDate(finishDate, false));
                  Button finishButton = choice("Bitiş saati seç  •  Henüz seçilmedi");
                  step1.addView(finishButton);
                  finishButton.setOnClickListener(v -> chooseTime(finishButton, false));

                  LinearLayout step2 = card();
                  step2.addView(section("Teslim & Konaklama"));
                  OwnerPicker ownerPicker = new OwnerPicker(step2, "Teslim / tesellüm sahibi", true);
                  final int[] hotelNightsChoice = {0};
                  Button hotelNightsButton = choice("Otelde kalınan gece  •  0 gece");
                  step2.addView(hotelNightsButton);
                  hotelNightsButton.setOnClickListener(v -> {
                      String[] items = new String[getHotelNightsMax() + 1];
                      for (int i = 0; i <= getHotelNightsMax(); i++) items[i] = i + " gece";
                      new AlertDialog.Builder(this).setSingleChoiceItems(items, hotelNightsChoice[0], (d, which) -> {
                          hotelNightsChoice[0] = which; hotelNightsButton.setText("Otelde kalınan gece  •  " + which); d.dismiss();
                      }).show();
                  });

                  LinearLayout nav = new LinearLayout(this);
                  nav.setOrientation(LinearLayout.HORIZONTAL);
                  Button btnPrev = action("Geri", false);
                  Button btnNext = action("İleri", true);
                  btnPrev.setLayoutParams(new LinearLayout.LayoutParams(0, toDp(54), 1f));
                  btnNext.setLayoutParams(new LinearLayout.LayoutParams(0, toDp(54), 1f));
                  nav.addView(btnPrev); nav.addView(btnNext);
                  root.addView(nav);

                  final int[] currentStep = {0};
                  View[] steps = {step1, step2};
                  for(View s : steps) wizardContainer.addView(s);

                  Runnable updateWizard = () -> {
                      for(int i=0; i<steps.length; i++) steps[i].setVisibility(i == currentStep[0] ? View.VISIBLE : View.GONE);
                      btnPrev.setVisibility(currentStep[0] == 0 ? View.GONE : View.VISIBLE);
                      btnNext.setText(currentStep[0] == steps.length - 1 ? "Otel / Eve Dön" : "İleri");
                  };
                  updateWizard.run();

                  btnPrev.setOnClickListener(v -> { if(currentStep[0] > 0) currentStep[0]--; updateWizard.run(); });
                  btnNext.setOnClickListener(v -> {
                      if(currentStep[0] < steps.length - 1) { currentStep[0]++; updateWizard.run(); }
                      else {
                          if (selectedFinish.isEmpty() || ownerPicker.value().isEmpty()) { Toast.makeText(this, "Eksik bilgi.", Toast.LENGTH_SHORT).show(); return; }
                          if (finishBeforeStart(a[1], a[4], selectedFinishDate, selectedFinish)) { showTimeOrderWarning(); return; }
                          
                          new AlertDialog.Builder(this).setTitle("Sonuç").setItems(new String[]{"🏨 Otele Geç", "✓ Tamamla ve Eve Dön"}, (dialog, which) -> {
                              String arrival = addThirtyMinutes(selectedFinishDate, selectedFinish);
                              String newRecord;
                              if(which == 0) {
                                  newRecord = r.replace("|OPEN", "|HOTEL|" + selectedFinishDate + "|" + selectedFinish + "|" + ownerPicker.value() + "|" + arrival);
                              } else {
                                  newRecord = r.replace("|OPEN", "|DONE|" + selectedFinishDate + "|" + selectedFinish + "|" + ownerPicker.value() + "|" + arrival) + "|" + hotelNightsChoice[0];
                              }
                              records.set(records.indexOf(r), newRecord); rememberOwner(ownerPicker.value()); persist(); home();
                          }).show();
                      }
                  });
              }

              void continueFromHotel(String r) {
                  // Orijinal hotel devam kodu yapısı korunarak uyarlandı
                  currentPage = "continue"; String[] a = r.split("\\|", -1);
                  page("Treni Devam Ettir", "Otelden sonraki görev.");
                  selectedStartDate = addDays(a[7], 1); selectedStart = "";
                  LinearLayout c = card(); c.addView(section("Yeni başlangıç"));
                  Button dateButton = choice("Tarih  •  " + selectedStartDate); c.addView(dateButton);
                  dateButton.setOnClickListener(v -> chooseDate(dateButton, true));
                  Button startButton = choice("Saat seç  •  Henüz seçilmedi"); c.addView(startButton);
                  startButton.setOnClickListener(v -> chooseTime(startButton, true));
                  TextInputLayout train = field("Tren no"); c.addView(train);
                  CheckBox samePerson = new CheckBox(this); samePerson.setText("Aynı kişiyle devam  •  " + a[2]); samePerson.setTextColor(COLOR_TEXT_PRIMARY); samePerson.setChecked(autoContinuePerson()); c.addView(samePerson);
                  TextInputLayout person = field("Kiminle gittin?"); c.addView(person); person.setVisibility(View.GONE);
                  samePerson.setOnCheckedChangeListener((buttonView, isChecked) -> person.setVisibility(isChecked ? View.GONE : View.VISIBLE));
                  OwnerPicker ownerPicker = new OwnerPicker(c, "Teslim / tesellüm", false);
                  root.addView(c);
                  Button save = action("✓  Treni Devam Ettir", true); root.addView(save);
                  save.setOnClickListener(v -> {
                      String chosenPerson = samePerson.isChecked() ? a[2] : value(person);
                      if (selectedStart.isEmpty() || chosenPerson.isEmpty() || value(train).isEmpty() || ownerPicker.value().isEmpty()) return;
                      records.set(records.indexOf(r), r.replace("|HOTEL|", "|HOTEL_DONE|"));
                      records.add(a[0] + "|" + selectedStartDate + "|" + chosenPerson + "|" + value(train) + "|" + selectedStart + "|" + ownerPicker.value() + "|OPEN");
                      persist(); home();
                  });
              }

              void settings() {
                  currentPage = "settings"; page("Ayarlar", "Uygulama davranışları.");
                  LinearLayout behavior = card(); behavior.addView(section("Kişi seçimi"));
                  Switch listSwitch = new Switch(this); listSwitch.setText("Hazır listeyi kullan"); listSwitch.setTextColor(COLOR_TEXT_PRIMARY); listSwitch.setChecked(useOwnerList()); behavior.addView(listSwitch);
                  root.addView(behavior);
                  listSwitch.setOnCheckedChangeListener((btn, chk) -> prefs.edit().putBoolean("use_owner_list", chk).apply());
                  Button back = action("Ana Sayfa", false); root.addView(back); back.setOnClickListener(v -> home());
              }

              void chooseTrain(TextInputLayout target, String[] trains, String titleText) {
                  new AlertDialog.Builder(this).setTitle(titleText).setItems(trains, (d, which) -> {
                      if (target.getEditText() != null) target.getEditText().setText(trains[which]);
                  }).show();
              }

              int compareDates(String first, String second) {
                  try {
                      SimpleDateFormat f = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault());
                      Date a = f.parse(first); Date b = f.parse(second);
                      return (a == null || b == null) ? first.compareTo(second) : a.compareTo(b);
                  } catch (Exception ignored) { return first.compareTo(second); }
              }

              String addThirtyMinutes(String date, String time) {
                  try {
                      SimpleDateFormat f = new SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault());
                      Date d = f.parse(date + " " + time);
                      if (d != null) return new SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault()).format(new Date(d.getTime() + 30L * 60L * 1000L));
                  } catch (Exception ignored) {}
                  return date + " " + time;
              }

              String addDays(String date, int days) {
                  try {
                      SimpleDateFormat f = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault());
                      Date d = f.parse(date);
                      if (d != null) { Calendar c = Calendar.getInstance(); c.setTime(d); c.add(Calendar.DAY_OF_MONTH, days); return f.format(c.getTime()); }
                  } catch (Exception ignored) {}
                  return date;
              }

              void monthly() {
                  currentPage = "monthly"; page("Aylık Kayıtlar", "Geçmişi incele.");
                  if (records.isEmpty()) { Button back = action("Ana Sayfa", false); root.addView(back); back.setOnClickListener(v -> home()); return; }
                  // Orijinal monthly listeleme yapısı
                  LinearLayout empty = card(); empty.addView(text("Kayıtlar listeleniyor...", 16, COLOR_TEXT_PRIMARY, true)); root.addView(empty);
                  Button back = action("Ana Sayfa", false); root.addView(back); back.setOnClickListener(v -> home());
              }

              void load() {
                  String all = prefs.getString("records", ""); if (all.isEmpty()) return;
                  for (String raw : all.split("\\n", -1)) {
                      if (raw.trim().isEmpty()) continue; String[] a = raw.split("\\|", -1);
                      if (a.length == 6 && a[5].equals("OPEN")) raw = a[0] + "|" + a[1] + "|" + a[2] + "|" + a[3] + "|" + a[4] + "|Belirtilmedi|OPEN";
                      else if (a.length == 10 && a[5].equals("DONE")) raw = a[0] + "|" + a[1] + "|" + a[2] + "|" + a[3] + "|" + a[4] + "|Belirtilmedi|DONE|" + a[6] + "|" + a[7] + "|" + a[8] + "|" + a[9];
                      records.add(raw);
                  }
              }
          
              void persist() {
                  StringBuilder out = new StringBuilder();
                  for (String r : records) { if (out.length() > 0) out.append("\n"); out.append(r); }
                  prefs.edit().putString("records", out.toString()).apply();
              }
          }
          EOF

          cd puantaj
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/4011-Model-v0.6.1.apk"
          test -s "$GITHUB_WORKSPACE/4011-Model-v0.6.1.apk"

      - name: APK'yı yükle
        uses: actions/upload-artifact@v6
        with:
          name: 4011-Model-v0.6.1
          path: ${{ github.workspace }}/4011-Model-v0.6.1.apk
