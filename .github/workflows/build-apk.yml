                  LinearLayout row1 = new LinearLayout(this);
                  row1.setOrientation(LinearLayout.HORIZONTAL);
                  LinearLayout tileNew = homeTile("＋", "Yeni Görev", "Tren / görev başlat", NEON_PURPLE_BRIGHT);
                  LinearLayout tileOngoing = homeTile("↻", "Devam Eden", ongoingCount + " açık kayıt", ongoingCount > 0 ? AMBER_NEON : BORDER_MUTED);
