              void monthly() {
                  currentPage = "monthly";
                  setupScreen(true);
                  root.addView(title("KAYIT GEÇMİŞİ"));
                  
                  if (records.isEmpty()) {
                      root.addView(subtitle("Kayıt yok."));
                      Button back = actionButton("Ana Sayfa", Color.parseColor("#3A3554"));
                      root.addView(back);
                      back.setOnClickListener(v -> home());
                      return;
                  }
                  
                  // Zincirleme işlemleri ve saat/dakika hesaplamaları (Daha önceki sistem aynı kalarak sadece UI olarak neon giydirildi)
                  // Geçmiş kayıtların UI sunumu
                  LinearLayout historyContainer = new LinearLayout(this);
                  historyContainer.setOrientation(LinearLayout.VERTICAL);
                  
                  for (int i = records.size() - 1; i >= 0; i--) {
                      String r = records.get(i);
                      String[] a = r.split("\\|", -1);
                      if (a.length < 7) continue;
                      
                      LinearLayout card = new LinearLayout(this);
                      card.setOrientation(LinearLayout.VERTICAL);
                      card.setPadding(dp(16),dp(12),dp(16),dp(12));
                      card.setBackground(neonCard(C_CARD, a[6].equals("DONE") ? C_NEON_GREEN : Color.parseColor("#555555"), 12));
                      LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, -2);
                      p.setMargins(0,0,0,dp(12));
                      card.setLayoutParams(p);
                      
                      card.addView(text(a[1] + " • " + formatTrainName(a[3]), 16, C_TEXT_W, true));
                      
                      if (a[6].equals("DONE") && a.length >= 11) {
                          long dutyMins = calculateMinutes(a[1]+" "+a[4], a[10]);
                          long h = dutyMins / 60;
                          long m = dutyMins % 60;
                          // Kullanıcı düzeltme geçmişine göre (decimal yerine saat/dakika)
                          card.addView(text("Çalışma: " + h + " saat " + m + " dakika", 14, C_NEON_GREEN, true));
                      }
                      
                      historyContainer.addView(card);
                  }
                  root.addView(historyContainer);
                  
                  Button back = actionButton("Ana Sayfa", Color.parseColor("#3A3554"));
                  root.addView(back);
                  back.setOnClickListener(v -> home());
              }
              
              long calculateMinutes(String startDT, String endDT) {
                  try {
                      SimpleDateFormat f = new SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault());
                      Date d1 = f.parse(startDT);
                      Date d2 = f.parse(endDT);
                      if (d1!=null && d2!=null) return Math.max(0, (d2.getTime() - d1.getTime()) / 60000L);
                  } catch (Exception e) {}
                  return 0;
              }

              String addThirtyMinutes(String date, String time) {
                  try {
                      SimpleDateFormat f = new SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault());
                      Date d = f.parse(date + " " + time);
                      if (d != null) {
                          d = new Date(d.getTime() + 30L * 60L * 1000L);
                          return f.format(d);
                      }
                  } catch (Exception ignored) {}
                  return date + " " + time;
              }

              String addDays(String date, int days) {
                  try {
                      SimpleDateFormat f = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault());
                      Date d = f.parse(date);
                      if (d != null) {
                          Calendar c = Calendar.getInstance();
                          c.setTime(d);
                          c.add(Calendar.DAY_OF_MONTH, days);
                          return f.format(c.getTime());
                      }
                  } catch (Exception ignored) {}
                  return date;
              }
              
              void load() {
                  String all = prefs.getString("records", "");
                  if (all.isEmpty()) return;
                  for (String raw : all.split("\\n", -1)) {
                      if (!raw.trim().isEmpty()) records.add(raw);
                  }
              }
          
              void persist() {
                  StringBuilder out = new StringBuilder();
                  for (String r : records) {
                      if (out.length() > 0) out.append("\n");
                      out.append(r);
                  }
                  prefs.edit().putString("records", out.toString()).apply();
              }
          }
