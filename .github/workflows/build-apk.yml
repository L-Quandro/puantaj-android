name: 4011 Model APK v0.7.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v5

      - name: Android projesini oluştur
        shell: bash
        run: |
          set -e
          mkdir -p puantaj/app/src/main/java/com/furkan/puantaj
          mkdir -p puantaj/app/src/main/res/values
          mkdir -p puantaj/app/src/main/res/drawable-nodpi
          mkdir -p puantaj/app/src/main/res/drawable
          mkdir -p puantaj/app/src/main/res/mipmap-anydpi-v26

          test -s "$GITHUB_WORKSPACE/puantaj_app_icon.png"
          cp "$GITHUB_WORKSPACE/puantaj_app_icon.png" puantaj/app/src/main/res/drawable-nodpi/puantaj_icon.png
          test -s puantaj/app/src/main/res/drawable-nodpi/puantaj_icon.png

          cat > puantaj/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PuantajAndroid"
          include(":app")
          EOF

          cat > puantaj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > puantaj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > puantaj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.furkan.puantaj'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.furkan.puantaj'
                  minSdk 26
                  targetSdk 35
                  versionCode 36
                  versionName '0.7.0'
              }
          }
          dependencies {
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > puantaj/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/Theme.Puantaj"
                  android:label="4011 Model"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > puantaj/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/puantaj_icon_background" />
              <foreground android:drawable="@drawable/puantaj_icon_foreground" />
          </adaptive-icon>
          EOF

          cat > puantaj/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/puantaj_icon_background" />
              <foreground android:drawable="@drawable/puantaj_icon_foreground" />
          </adaptive-icon>
          EOF

          cat > puantaj/app/src/main/res/drawable/puantaj_icon_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/puantaj_icon"
              android:gravity="fill" />
          EOF

          cat > puantaj/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="puantaj_icon_background">#140A26</color>
          </resources>
          EOF

          cat > puantaj/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.Puantaj" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#06050E</item>
                  <item name="android:navigationBarColor">#06050E</item>
                  <item name="colorPrimary">#A82CFF</item>
                  <item name="colorSecondary">#39FFA0</item>
              </style>
          </resources>
          EOF

          cat > puantaj/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">4011 Model</string>
          </resources>
          EOF

          cat > puantaj/app/src/main/java/com/furkan/puantaj/MainActivity.java <<'EOF'
          package com.furkan.puantaj;
          
          import android.app.*;
          import android.os.Bundle;
          import android.content.*;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.*;
          import android.widget.*;
          import com.google.android.material.textfield.TextInputEditText;
          import com.google.android.material.textfield.TextInputLayout;
          import java.text.SimpleDateFormat;
          import java.util.*;
          
          public class MainActivity extends Activity {
              LinearLayout root;
              SharedPreferences prefs;
              ArrayList<String> records = new ArrayList<>();
          
              String selectedStart = "";
              String selectedStartDate = "";
              String selectedFinish = "";
              String selectedFinishDate = "";
              String currentPage = "home";

              static final String DEFAULT_PEOPLE = "Hazım|Ender|Yücel|Emirhan|Melike";

              // ---- Görsel kimlik: "Derin Uzay / Neon" paleti ----
              // Tüm renkler burada tek yerde tanımlı; ekranlardaki her çağrı
              // bu sabitleri kullanır. Yeni bir ton eklemek istersen sadece
              // burayı değiştirmen yeterli.
              static final int SPACE_BG_TOP = Color.rgb(10, 7, 22);
              static final int SPACE_BG_MID = Color.rgb(20, 10, 38);
              static final int SPACE_BG_BOTTOM = Color.rgb(6, 5, 14);

              static final int NEON_PURPLE = Color.rgb(168, 44, 255);
              static final int NEON_PURPLE_BRIGHT = Color.rgb(213, 120, 255);
              static final int NEON_PURPLE_SOFT = Color.rgb(199, 120, 255);
              static final int NEON_GREEN = Color.rgb(57, 255, 160);
              static final int NEON_GREEN_BRIGHT = Color.rgb(150, 255, 205);
              static final int AMBER_NEON = Color.rgb(255, 183, 3);
              static final int GOLD_NEON = Color.rgb(255, 204, 0);

              static final int TEXT_PRIMARY = Color.rgb(244, 241, 252);
              static final int TEXT_SECONDARY = Color.rgb(198, 190, 226);
              static final int TEXT_MUTED = Color.rgb(158, 148, 190);

              static final int CARD_BG = Color.rgb(20, 16, 34);
              static final int CARD_BG_ALT = Color.rgb(26, 20, 42);
              static final int CARD_BG_ALT2 = Color.rgb(26, 18, 44);
              static final int CARD_BG_HERO = Color.rgb(38, 18, 60);
              static final int CARD_BG_DIM = Color.rgb(16, 13, 28);
              static final int BTN_SECONDARY_BG = Color.rgb(26, 20, 40);
              static final int BORDER_MUTED = Color.rgb(80, 60, 120);
              static final int BORDER_PURPLE_GLOW = Color.argb(140, 168, 44, 255);
              static final int BORDER_GREEN_GLOW = Color.argb(120, 57, 255, 160);

              ArrayList<String> ownerList() {
                  String raw = prefs.getString("owner_list", DEFAULT_PEOPLE);
                  ArrayList<String> list = new ArrayList<>();
                  for (String x : raw.split("\\|", -1)) {
                      x = x.trim();
                      if (!x.isEmpty() && !list.contains(x)) list.add(x);
                  }
                  if (list.isEmpty()) {
                      for (String x : DEFAULT_PEOPLE.split("\\|", -1)) list.add(x);
                  }
                  return list;
              }

              void saveOwnerList(ArrayList<String> list) {
                  StringBuilder b = new StringBuilder();
                  for (String x : list) {
                      if (b.length() > 0) b.append("|");
                      b.append(x.replace("|", ""));
                  }
                  prefs.edit().putString("owner_list", b.toString()).apply();
              }

              boolean useOwnerList() {
                  return prefs.getBoolean("use_owner_list", true);
              }

              boolean autoContinuePerson() {
                  return prefs.getBoolean("auto_continue_person", true);
              }

              // Görev kapanışında sorulan "kaç gün otelde konaklandı" seçiminin
              // azami değeri. Ayarlar ekranından +/- ile değiştirilebilir.
              int getHotelNightsMax() {
                  return prefs.getInt("hotel_nights_max", 4);
              }

              void setHotelNightsMax(int v) {
                  prefs.edit().putInt("hotel_nights_max", v).apply();
              }

              String defaultOwner() {
                  if (!useOwnerList()) return "";
                  String selected = prefs.getString("default_owner", "");
                  if (selected.isEmpty()) return "";
                  return ownerList().contains(selected) ? selected : "";
              }

              void rememberOwner(String owner) {
                  if (owner != null && !owner.trim().isEmpty()) {
                      prefs.edit().putString("last_owner", owner.trim()).apply();
                  }
              }

              class OwnerPicker {
                  final TextInputLayout input;
                  final CheckBox modeCheck;
                  final Button chooser;
                  final String label;
                  final boolean listFirst;
                  String selected = "";

                  OwnerPicker(LinearLayout parent, String label) {
                      this(parent, label, true);
                  }

                  OwnerPicker(LinearLayout parent, String label, boolean listFirst) {
                      this.label = label;
                      this.listFirst = listFirst;

                      chooser = choice(label + "  •  Seç");
                      parent.addView(chooser);

                      modeCheck = new CheckBox(MainActivity.this);
                      modeCheck.setText(listFirst ? "Manuel farklı isim gireceğim" : "Hazır listeden seç");
                      modeCheck.setTextSize(14);
                      modeCheck.setTextColor(Color.rgb(198,190,226));
                      modeCheck.setButtonTintList(android.content.res.ColorStateList.valueOf(Color.rgb(199,120,255)));
                      parent.addView(modeCheck);

                      input = field(label);
                      parent.addView(input);

                      if (listFirst) {
                          chooser.setVisibility(View.VISIBLE);
                          input.setVisibility(View.GONE);
                          modeCheck.setChecked(false);
                      } else {
                          chooser.setVisibility(View.GONE);
                          input.setVisibility(View.VISIBLE);
                          modeCheck.setChecked(false);
                      }

                      chooser.setOnClickListener(v -> showOwnerChoices());

                      modeCheck.setOnCheckedChangeListener((buttonView, checked) -> {
                          if (listFirst) {
                              input.setVisibility(checked ? View.VISIBLE : View.GONE);
                              chooser.setVisibility(checked ? View.GONE : View.VISIBLE);
                              if (checked) {
                                  selected = "";
                                  if (input.getEditText() != null) input.getEditText().setText("");
                              }
                          } else {
                              chooser.setVisibility(View.GONE);
                              input.setVisibility(View.VISIBLE);
                              if (checked) {
                                  selected = "";
                                  showOwnerChoices();
                              }
                          }
                      });
                  }

                  void showOwnerChoices() {
                      if (!useOwnerList()) {
                          Toast.makeText(MainActivity.this, "Hazır kişi listesi Ayarlar'dan kapalı.", Toast.LENGTH_SHORT).show();
                          modeCheck.setChecked(false);
                          if (listFirst) input.setVisibility(View.GONE);
                          return;
                      }
                      ArrayList<String> list = ownerList();
                      if (list.isEmpty()) {
                          Toast.makeText(MainActivity.this, "Hazır kişi listesinde isim yok.", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      String[] items = list.toArray(new String[0]);
                      int checked = list.indexOf(selected);
                      new AlertDialog.Builder(MainActivity.this)
                              .setTitle(label)
                              .setSingleChoiceItems(items, checked, (d, which) -> {
                                  selected = items[which];
                                  chooser.setText(label + "  •  " + selected);
                                  if (listFirst) {
                                      modeCheck.setChecked(false);
                                  } else {
                                      input.setVisibility(View.VISIBLE);
                                      if (input.getEditText() != null) input.getEditText().setText(selected);
                                      chooser.setVisibility(View.GONE);
                                      modeCheck.setChecked(false);
                                  }
                                  d.dismiss();
                              })
                              .setNegativeButton("İptal", null)
                              .show();
                  }

                  String value() {
                      if (listFirst) {
                          return modeCheck.isChecked() ? MainActivity.this.value(input) :
                                  (selected == null ? "" : selected);
                      }
                      return modeCheck.isChecked() ? (selected == null ? "" : selected) :
                              MainActivity.this.value(input);
                  }

                  void setValue(String value) {
                      if (value == null) value = "";
                      value = value.trim();
                      if (useOwnerList() && ownerList().contains(value)) {
                          selected = value;
                          chooser.setText(label + "  •  " + selected);
                          if (listFirst) {
                              modeCheck.setChecked(false);
                          } else {
                              input.setVisibility(View.VISIBLE);
                              if (input.getEditText() != null) input.getEditText().setText(selected);
                              chooser.setVisibility(View.GONE);
                              modeCheck.setChecked(false);
                          }
                      } else {
                          selected = "";
                          modeCheck.setChecked(listFirst);
                          if (input.getEditText() != null) input.getEditText().setText(value);
                      }
                  }
              }
          
              int dp(float v) {
                  return (int)(v * getResources().getDisplayMetrics().density + 0.5f);
              }
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("puantaj", MODE_PRIVATE);
                  load();
                  if (android.os.Build.VERSION.SDK_INT >= 33) {
                      getOnBackInvokedDispatcher().registerOnBackInvokedCallback(
                              android.window.OnBackInvokedDispatcher.PRIORITY_DEFAULT,
                              this::navigateBack);
                  }
                  home();
              }

              @Override
              public void onBackPressed() {
                  navigateBack();
              }

              void navigateBack() {
                  if ("home".equals(currentPage)) {
                      super.onBackPressed();
                      return;
                  }
                  if ("complete".equals(currentPage) || "continue".equals(currentPage)) {
                      ongoing();
                  } else {
                      home();
                  }
              }

              String formatTrainName(String tName) {
                  if (tName == null) return "";
                  String upper = tName.toUpperCase(new Locale("tr", "TR"));
                  if (upper.startsWith("İPTAL") || upper.contains("TATİL") || upper.contains("GÜN") || upper.contains("İZİN") || upper.startsWith("DESTEK")) {
                      return upper;
                  }
                  return "TREN " + tName;
              }

              // Tek bir yerden yönetilen "özel durum" kontrolü: Hafta Tatili / Boş Gün /
              // Yıllık İzin / İptal / Tren İptali (İptal: ...) / Destek 1-2-3.
              // Yeni bir özel durum eklemek istersen sadece burayı güncellemen yeterli.
              boolean isSpecialLabel(String v) {
                  if (v == null || v.isEmpty()) return false;
                  return v.equals("Hafta Tatili") || v.equals("Boş Gün") || v.equals("Yıllık İzin") ||
                          v.startsWith("İptal") || v.startsWith("Destek");
              }
          
              GradientDrawable bg(int color, float radius) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(radius));
                  return g;
              }

              GradientDrawable bgBordered(int color, float radius, int borderColor) {
                  GradientDrawable g = bg(color, radius);
                  g.setStroke(dp(1), borderColor);
                  return g;
              }

              // Özel arkaplan atadığımız her View, Android'in yerleşik dokunma
              // (ripple) efektini kaybeder. Bunu geri kazandırıyoruz — böylece
              // her buton/kart gerçekten "dokunulmuş" hissi verir.
              void addRipple(View v) {
                  android.util.TypedValue outValue = new android.util.TypedValue();
                  getTheme().resolveAttribute(android.R.attr.selectableItemBackground, outValue, true);
                  v.setForeground(getResources().getDrawable(outValue.resourceId, getTheme()));
              }

              // Ana ekran arkaplanı: düz siyah yerine, üstten alta koyu mor→lacivert→
              // neredeyse siyah geçişli "derin uzay" gradyanı.
              GradientDrawable spaceBackground() {
                  GradientDrawable g = new GradientDrawable(
                          GradientDrawable.Orientation.TOP_BOTTOM,
                          new int[]{SPACE_BG_MID, SPACE_BG_TOP, SPACE_BG_BOTTOM});
                  g.setGradientType(GradientDrawable.LINEAR_GRADIENT);
                  return g;
              }
          
              TextView text(String s, float size, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setTypeface(Typeface.DEFAULT, bold ? Typeface.BOLD : Typeface.NORMAL);
                  return t;
              }
          
              TextView title(String s) {
                  TextView t = text(s, 30, TEXT_PRIMARY, true);
                  t.setLetterSpacing(.01f);
                  t.setPadding(0, 0, 0, dp(6));
                  return t;
              }
          
              TextView subtitle(String s) {
                  TextView t = text(s, 15, TEXT_MUTED, false);
                  t.setPadding(0, 0, 0, dp(22));
                  return t;
              }
          
              TextView section(String s) {
                  TextView t = text(s.toUpperCase(Locale.getDefault()), 12, NEON_PURPLE_SOFT, true);
                  t.setLetterSpacing(.10f);
                  t.setPadding(dp(4), dp(16), dp(4), dp(8));
                  return t;
              }
          
              LinearLayout card() {
                  return card(CARD_BG, BORDER_MUTED);
              }

              LinearLayout card(int bgColor, int borderColor) {
                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setPadding(dp(16), dp(14), dp(16), dp(14));
                  c.setBackground(bgBordered(bgColor, 22, borderColor));
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, -2);
                  p.setMargins(0, 0, 0, dp(12));
                  c.setLayoutParams(p);
                  addRipple(c);
                  return c;
              }
          
              TextInputLayout field(String hint) {
                  TextInputLayout box = new TextInputLayout(this);
                  box.setHint(hint);
                  box.setBoxBackgroundMode(TextInputLayout.BOX_BACKGROUND_OUTLINE);
                  box.setBoxCornerRadii(dp(14),dp(14),dp(14),dp(14));
                  box.setBoxStrokeColor(NEON_PURPLE_SOFT);
                  box.setHintTextColor(android.content.res.ColorStateList.valueOf(TEXT_MUTED));
                  box.setPadding(0, dp(4), 0, dp(8));
          
                  TextInputEditText edit = new TextInputEditText(box.getContext());
                  edit.setSingleLine(true);
                  edit.setTextSize(17);
                  edit.setTextColor(TEXT_PRIMARY);
                  edit.setHintTextColor(TEXT_MUTED);
                  box.addView(edit, new LinearLayout.LayoutParams(-1, dp(54)));
                  return box;
              }
          
              String value(TextInputLayout box) {
                  TextInputEditText e = (TextInputEditText)box.getEditText();
                  return e == null || e.getText() == null ? "" : e.getText().toString().trim();
              }
          
              // primary=true  → dolgun neon mor CTA (ileri/kaydet/gezinme).
              // primary=false → koyu cam zemin, ince mor-gri kenarlık (nötr seçim).
              Button action(String label, boolean primary) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextSize(15);
                  b.setTextColor(TEXT_PRIMARY);
                  b.setAllCaps(false);
                  b.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  b.setMinHeight(dp(52));
                  b.setPadding(dp(10), 0, dp(10), 0);
                  if (primary) {
                      GradientDrawable gd = new GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM,
                              new int[]{NEON_PURPLE_BRIGHT, NEON_PURPLE});
                      gd.setCornerRadius(dp(18));
                      b.setBackground(gd);
                  } else {
                      b.setBackground(bgBordered(BTN_SECONDARY_BG, 18, BORDER_MUTED));
                  }
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, dp(54));
                  p.setMargins(0, dp(4), 0, dp(10));
                  b.setLayoutParams(p);
                  addRipple(b);
                  return b;
              }

              // Sadece "işi bitiren, olumlu" eylemler için: neon yeşil dolgu.
              // Böylece "ileri git" (mor) ile "işi tamamla" (yeşil) görsel olarak
              // hep birbirinden ayrışır.
              Button actionSuccess(String label) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextSize(15);
                  b.setTextColor(Color.rgb(8, 22, 16));
                  b.setAllCaps(false);
                  b.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  b.setMinHeight(dp(52));
                  b.setPadding(dp(10), 0, dp(10), 0);
                  GradientDrawable gd = new GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM,
                          new int[]{NEON_GREEN_BRIGHT, NEON_GREEN});
                  gd.setCornerRadius(dp(18));
                  b.setBackground(gd);
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, dp(54));
                  p.setMargins(0, dp(4), 0, dp(10));
                  b.setLayoutParams(p);
                  addRipple(b);
                  return b;
              }

              // Tek dokunuşla seçilen küçük "hap" buton (hazır isim / tren no).
              // Seçiliyken neon yeşil dolar, değilken cam zemin + mor kenarlık.
              Button chip(String label, boolean selected) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextSize(14);
                  b.setAllCaps(false);
                  b.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  b.setMinHeight(dp(44));
                  b.setMinWidth(0);
                  b.setPadding(dp(20), 0, dp(20), 0);
                  if (selected) {
                      GradientDrawable gd = new GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM,
                              new int[]{NEON_GREEN_BRIGHT, NEON_GREEN});
                      gd.setCornerRadius(dp(22));
                      b.setBackground(gd);
                      b.setTextColor(Color.rgb(8, 22, 16));
                  } else {
                      b.setBackground(bgBordered(CARD_BG_ALT, 22, BORDER_MUTED));
                      b.setTextColor(TEXT_SECONDARY);
                  }
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-2, dp(44));
                  p.setMargins(0, 0, dp(10), 0);
                  b.setLayoutParams(p);
                  addRipple(b);
                  return b;
              }

              // Yatay kaydırmalı hap satırı: dikey kaydırmaya hiç dokunmadan
              // çok sayıda seçeneği tek satıra sığdırır.
              HorizontalScrollView chipRow(String[] labels, String selectedValue, ChipPick onPick) {
                  HorizontalScrollView scroll = new HorizontalScrollView(this);
                  scroll.setHorizontalScrollBarEnabled(false);
                  scroll.setClipToPadding(false);
                  scroll.setPadding(0, 0, dp(16), 0);
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  for (String label : labels) {
                      Button c = chip(label, label.equals(selectedValue));
                      c.setOnClickListener(v -> onPick.onPick(label));
                      row.addView(c);
                  }
                  scroll.addView(row);
                  return scroll;
              }

              interface ChipPick {
                  void onPick(String value);
              }
          
              Button choice(String label) {
                  Button b = action(label, false);
                  b.setTextSize(15);
                  b.setGravity(Gravity.CENTER_VERTICAL);
                  return b;
              }
          
              void page(String heading, String desc) {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(20), dp(24), dp(20), dp(28));
                  root.setBackground(spaceBackground());
                  scroll.addView(root);
                  setContentView(scroll);
                  root.addView(title(heading));
                  if (!desc.isEmpty()) root.addView(subtitle(desc));
              }

              // Veri girişi ekranları için: kaydırma YOK. İçerik üstte, gezinme
              // butonları her zaman ekranın altında sabit durur — kullanıcı asla
              // aşağı kaydırmak zorunda kalmaz. Her adım tek bir soruya odaklanır.
              LinearLayout wizardPage(String stepTitle, String stepHint, int stepIndex, int totalSteps, Runnable onBack) {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(20), dp(20), dp(20), dp(20));
                  root.setBackground(spaceBackground());
                  setContentView(root);

                  LinearLayout topBar = new LinearLayout(this);
                  topBar.setOrientation(LinearLayout.HORIZONTAL);
                  topBar.setGravity(Gravity.CENTER_VERTICAL);

                  TextView back = text("←", 22, TEXT_SECONDARY, true);
                  back.setPadding(dp(4), dp(12), dp(20), dp(12));
                  back.setMinWidth(dp(44));
                  back.setGravity(Gravity.CENTER_VERTICAL);
                  addRipple(back);
                  back.setOnClickListener(v -> onBack.run());
                  topBar.addView(back);

                  LinearLayout dots = new LinearLayout(this);
                  dots.setOrientation(LinearLayout.HORIZONTAL);
                  dots.setGravity(Gravity.CENTER_VERTICAL);
                  for (int i = 0; i < totalSteps; i++) {
                      View dot = new View(this);
                      int size = dp(i == stepIndex ? 10 : 8);
                      LinearLayout.LayoutParams dotParams = new LinearLayout.LayoutParams(size, size);
                      dotParams.setMargins(dp(3), 0, dp(3), 0);
                      GradientDrawable dotBg = new GradientDrawable();
                      dotBg.setShape(GradientDrawable.OVAL);
                      if (i < stepIndex) dotBg.setColor(NEON_GREEN);
                      else if (i == stepIndex) dotBg.setColor(NEON_PURPLE_BRIGHT);
                      else dotBg.setColor(CARD_BG_ALT);
                      dot.setBackground(dotBg);
                      dots.addView(dot, dotParams);
                  }
                  LinearLayout.LayoutParams dotsParams = new LinearLayout.LayoutParams(0, -2, 1f);
                  topBar.addView(dots, dotsParams);

                  TextView stepCount = text((stepIndex + 1) + "/" + totalSteps, 13, TEXT_MUTED, true);
                  topBar.addView(stepCount);

                  root.addView(topBar);

                  TextView heading = text(stepTitle, 26, TEXT_PRIMARY, true);
                  heading.setPadding(0, dp(22), 0, dp(4));
                  root.addView(heading);

                  if (stepHint != null && !stepHint.isEmpty()) {
                      root.addView(subtitle(stepHint));
                  } else {
                      View spacer = new View(this);
                      root.addView(spacer, new LinearLayout.LayoutParams(-1, dp(18)));
                  }

                  return root;
              }
          
              void home() {
