                  btnHotel.setOnClickListener(v -> {
                      String[] opts = {"0 Gece", "1 Gece", "2 Gece", "3 Gece", "4 Gece"};
                      new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                          .setTitle("Konaklama")
