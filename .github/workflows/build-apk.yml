              private void chooseDate(Button targetButton, boolean isStart) {
                  Calendar cal = Calendar.getInstance();
                  DatePickerDialog dialog = new DatePickerDialog(
                          this,
                          android.R.style.Theme_DeviceDefault_Dialog_Alert,
                          (view, year, month, dayOfMonth) -> {
                              String formatted = String.format(Locale.getDefault(), "%02d.%02d.%04d", dayOfMonth, month + 1, year);
                              if (isStart) {
                                  selectedStartDate = formatted;
                                  targetButton.setText("Tarih: " + formatted);
                              } else {
                                  selectedFinishDate = formatted;
                                  targetButton.setText("Bitiş Tarihi: " + formatted);
                              }
                          },
                          cal.get(Calendar.YEAR),
                          cal.get(Calendar.MONTH),
                          cal.get(Calendar.DAY_OF_MONTH)
                  );
                  dialog.show();
              }

              private void chooseTime(Button targetButton, boolean isStart) {
                  Calendar cal = Calendar.getInstance();
                  TimePickerDialog dialog = new TimePickerDialog(
                          this,
                          android.R.style.Theme_DeviceDefault_Dialog_Alert,
                          (view, hourOfDay, minute) -> {
                              String formatted = String.format(Locale.getDefault(), "%02d:%02d", hourOfDay, minute);
                              if (isStart) {
                                  selectedStart = formatted;
                                  targetButton.setText("Saat: " + formatted);
                              } else {
                                  selectedFinish = formatted;
                                  targetButton.setText("Bitiş Saati: " + formatted);
                              }
                          },
                          cal.get(Calendar.HOUR_OF_DAY),
                          cal.get(Calendar.MINUTE),
                          true
                  );
                  dialog.show();
              }

              private boolean isFinishBeforeStart(String startDate, String startTime, String finishDate, String finishTime) {
                  try {
                      SimpleDateFormat sdf = new SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault());
                      Date start = sdf.parse(startDate + " " + startTime);
                      Date finish = sdf.parse(finishDate + " " + finishTime);
                      if (start != null && finish != null) {
                          return finish.before(start);
                      }
                  } catch (Exception ignored) {
                  }
                  return true;
              }

              private void showTimeOrderWarning() {
                  Toast.makeText(this, "Bitiş zamanı başlangıçtan önce olamaz!", Toast.LENGTH_LONG).show();
              }

