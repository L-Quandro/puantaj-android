              ArrayList<String> ownerList() {
                  String raw = prefs.getString("owner_list", DEFAULT_PEOPLE);
                  ArrayList<String> list = new ArrayList<>();
                  for (String x : raw.split("\\|", -1)) {
                      x = x.trim();
                      if (!x.isEmpty() && !list.contains(x)) list.add(x);
                  }
                  if (list.isEmpty()) {
                      for (String x : DEFAULT_PEOPLE.split("\\|", -1)) list.add(x);
                  }
                  return list;
              }

              void saveOwnerList(ArrayList<String> list) {
                  StringBuilder b = new StringBuilder();
                  for (String x : list) {
                      if (b.length() > 0) b.append("|");
                      b.append(x.replace("|", ""));
                  }
                  prefs.edit().putString("owner_list", b.toString()).apply();
              }

              boolean useOwnerList() {
                  return prefs.getBoolean("use_owner_list", true);
              }

              boolean autoContinuePerson() {
                  return prefs.getBoolean("auto_continue_person", true);
              }

              // Görev kapanışında sorulan "kaç gün otelde konaklandı" seçiminin
              // azami değeri. Ayarlar ekranından +/- ile değiştirilebilir.
              int getHotelNightsMax() {
                  return prefs.getInt("hotel_nights_max", 4);
              }

              void setHotelNightsMax(int v) {
                  prefs.edit().putInt("hotel_nights_max", v).apply();
              }

              String defaultOwner() {
                  if (!useOwnerList()) return "";
                  String selected = prefs.getString("default_owner", "");
                  if (selected.isEmpty()) return "";
                  return ownerList().contains(selected) ? selected : "";
              }

              void rememberOwner(String owner) {
                  if (owner != null && !owner.trim().isEmpty()) {
                      prefs.edit().putString("last_owner", owner.trim()).apply();
                  }
              }

              class OwnerPicker {
                  final TextInputLayout input;
                  final CheckBox modeCheck;
                  final Button chooser;
                  final String label;
                  final boolean listFirst;
                  String selected = "";

                  OwnerPicker(LinearLayout parent, String label) {
                      this(parent, label, true);
                  }

                  OwnerPicker(LinearLayout parent, String label, boolean listFirst) {
                      this.label = label;
                      this.listFirst = listFirst;

                      chooser = choice(label + "  •  Seç");
                      parent.addView(chooser);

                      modeCheck = new CheckBox(MainActivity.this);
                      modeCheck.setText(listFirst ? "Manuel farklı isim gireceğim" : "Hazır listeden seç");
                      modeCheck.setTextSize(14);
                      modeCheck.setTextColor(Color.rgb(198,190,226));
                      modeCheck.setButtonTintList(android.content.res.ColorStateList.valueOf(Color.rgb(199,120,255)));
                      parent.addView(modeCheck);

                      input = field(label);
                      parent.addView(input);

                      if (listFirst) {
                          chooser.setVisibility(View.VISIBLE);
                          input.setVisibility(View.GONE);
                          modeCheck.setChecked(false);
                      } else {
                          chooser.setVisibility(View.GONE);
                          input.setVisibility(View.VISIBLE);
                          modeCheck.setChecked(false);
                      }

                      chooser.setOnClickListener(v -> showOwnerChoices());

                      modeCheck.setOnCheckedChangeListener((buttonView, checked) -> {
                          if (listFirst) {
                              input.setVisibility(checked ? View.VISIBLE : View.GONE);
                              chooser.setVisibility(checked ? View.GONE : View.VISIBLE);
                              if (checked) {
                                  selected = "";
                                  if (input.getEditText() != null) input.getEditText().setText("");
                              }
                          } else {
                              chooser.setVisibility(View.GONE);
                              input.setVisibility(View.VISIBLE);
                              if (checked) {
                                  selected = "";
                                  showOwnerChoices();
                              }
                          }
                      });
                  }

                  void showOwnerChoices() {
                      if (!useOwnerList()) {
                          Toast.makeText(MainActivity.this, "Hazır kişi listesi Ayarlar'dan kapalı.", Toast.LENGTH_SHORT).show();
                          modeCheck.setChecked(false);
                          if (listFirst) input.setVisibility(View.GONE);
                          return;
                      }
                      ArrayList<String> list = ownerList();
                      if (list.isEmpty()) {
                          Toast.makeText(MainActivity.this, "Hazır kişi listesinde isim yok.", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      String[] items = list.toArray(new String[0]);
                      int checked = list.indexOf(selected);
                      new AlertDialog.Builder(MainActivity.this)
                              .setTitle(label)
                              .setSingleChoiceItems(items, checked, (d, which) -> {
                                  selected = items[which];
                                  chooser.setText(label + "  •  " + selected);
                                  if (listFirst) {
                                      modeCheck.setChecked(false);
                                  } else {
                                      input.setVisibility(View.VISIBLE);
                                      if (input.getEditText() != null) input.getEditText().setText(selected);
                                      chooser.setVisibility(View.GONE);
                                      modeCheck.setChecked(false);
                                  }
                                  d.dismiss();
                              })
                              .setNegativeButton("İptal", null)
                              .show();
                  }

                  String value() {
                      if (listFirst) {
                          return modeCheck.isChecked() ? MainActivity.this.value(input) :
                                  (selected == null ? "" : selected);
                      }
                      return modeCheck.isChecked() ? (selected == null ? "" : selected) :
                              MainActivity.this.value(input);
                  }

                  void setValue(String value) {
                      if (value == null) value = "";
                      value = value.trim();
                      if (value.isEmpty()) {
                          return; // gösterilecek bir şey yok — kurulumdaki varsayılan görünüm korunur
                      }
                      if (useOwnerList() && ownerList().contains(value)) {
                          selected = value;
                          chooser.setText(label + "  •  " + selected);
                          if (listFirst) {
                              modeCheck.setChecked(false);
                          } else {
                              input.setVisibility(View.VISIBLE);
                              if (input.getEditText() != null) input.getEditText().setText(selected);
                              chooser.setVisibility(View.GONE);
                              modeCheck.setChecked(false);
                          }
                      } else {
                          selected = "";
                          modeCheck.setChecked(listFirst);
                          if (input.getEditText() != null) input.getEditText().setText(value);
                      }
                  }
              }
          
              int dp(float v) {
                  return (int)(v * getResources().getDisplayMetrics().density + 0.5f);
              }
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("puantaj", MODE_PRIVATE);
                  load();
                  if (android.os.Build.VERSION.SDK_INT >= 33) {
                      getOnBackInvokedDispatcher().registerOnBackInvokedCallback(
                              android.window.OnBackInvokedDispatcher.PRIORITY_DEFAULT,
                              this::navigateBack);
                  }
                  home();
              }

