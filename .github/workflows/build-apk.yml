              void ongoing() {
                  currentPage = "ongoing";
                  page("Devam Eden Görevler", "Kapatılmamış veya otelde olan görevler.");

                  boolean found = false;
                  for (String r : new ArrayList<>(records)) {
                      String[] a = r.split("\\|", -1);
                      if (a.length < 7) continue;
                      String status = a[6];
                      if (!status.equals("OPEN") && !status.equals("HOTEL")) continue;

                      found = true;
                      LinearLayout c = card();
                      c.addView(text(formatTrainName(a[3]), 16, NEON_GREEN, true));
                      c.addView(text("Tarih: " + a[1] + " • Kiminle: " + a[2], 13, TEXT_PRIMARY, false));
                      c.addView(text("Saat: " + a[4] + " • Tesellüm: " + a[5], 12, TEXT_MUTED, false));

                      if (status.equals("HOTEL")) {
                          c.addView(text("Durum: Otel Konaklamasında (Varış: " + (a.length > 10 ? a[10] : "-") + ")", 12, Color.parseColor("#FFD700"), true));
                          Button b = action("Treni Devam Ettir (Otelden Çık)", true);
                          c.addView(b); root.addView(c);
                          b.setOnClickListener(v -> continueFromHotel(r));
                      } else {
                          c.addView(text("Durum: Görev Devam Ediyor", 12, NEON_PURPLE, true));
                          Button b = action("Görevi Sonlandır / Otele Geç", true);
                          c.addView(b); root.addView(c);
                          b.setOnClickListener(v -> complete(r));
                      }
                  }

                  if (!found) root.addView(text("Devam eden açık bir görev bulunmamaktadır.", 14, TEXT_MUTED, false));
                  Button back = choice("Ana Menüye Dön"); root.addView(back); back.setOnClickListener(v -> home());
              }

              void complete(String r) {
                  currentPage = "complete";
                  String[] a = r.split("\\|", -1);
                  page("Görevi Sonlandır", formatTrainName(a[3]) + " görevini kapat.");

                  selectedFinish = ""; selectedFinishDate = a[1];
                  LinearLayout c = card();

                  c.addView(section("Bitiş Zamanı"));
                  LinearLayout timeRow = hRow();
                  Button finishDate = choice("Tarih: " + selectedFinishDate);
                  Button finishButton = choice("Saat: Seçilmedi");

                  LinearLayout.LayoutParams tp1 = new LinearLayout.LayoutParams(0, dp(42), 1f); tp1.setMargins(0,0,dp(4),0); finishDate.setLayoutParams(tp1);
                  LinearLayout.LayoutParams tp2 = new LinearLayout.LayoutParams(0, dp(42), 1f); tp2.setMargins(dp(4),0,0,0); finishButton.setLayoutParams(tp2);
                  timeRow.addView(finishDate); timeRow.addView(finishButton); c.addView(timeRow);

