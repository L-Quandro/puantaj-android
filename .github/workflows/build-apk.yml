              }

              byte[] excelReadAllBytes(File f) throws IOException {
                  try (FileInputStream in = new FileInputStream(f)) {
                      ByteArrayOutputStream bos = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int len;
                      while ((len = in.read(buf)) > 0) bos.write(buf, 0, len);
                      return bos.toByteArray();
                  }
              }

              // Bir Excel oluşturma işlemi boyunca eklenen tüm imza görsellerini
              // (çapa + ilişki + görsel dosyası) biriktirir.
              // ÖNEMLİ: şablonda SADECE sheet2 (DIŞ) var olan drawing1.xml'e sahip;
              // sheet1'in (İÇ) hiçbir drawing ilişkisi YOK. Bu yüzden imzalar
              // sheetIdx'e göre AYRI listelerde tutulur: sheet2 imzaları mevcut
              // drawing1.xml'e (hiç dokunulmadan sona) eklenir, sheet1 imzaları ise
              // kendi bağımsız yeni drawing2.xml'ine yazılır. Böylece bir imza asla
              // yanlış sayfaya/satıra taşınmaz.
              class ExcelDrawingPatcher {
                  ArrayList<String> sheet1Anchors = new ArrayList<>();
                  ArrayList<String> sheet1Rels = new ArrayList<>();
                  ArrayList<String> sheet2Anchors = new ArrayList<>();
                  ArrayList<String> sheet2Rels = new ArrayList<>();
                  HashMap<String, byte[]> newMedia = new HashMap<>();
                  int nextShapeIdSheet1 = 1;   // sheet1 için bağımsız yeni drawing — logoyla ilgisi yok
                  int nextRelIdSheet1 = 1;
                  int nextShapeIdSheet2 = 3;   // sheet2/drawing1.xml içinde logo id=2 kullanıyor
                  int nextRelIdSheet2 = 2;     // logo rId1 kullanıyor
                  int nextImageNum = 2;        // xl/media içinde image1.png logoya ait, global sayaç

                  // sheetIdx: 0 = sheet1 (İÇ), 1 = sheet2 (DIŞ).
                  void addSignature(int sheetIdx, String ownerName, String targetCellRef, int rowNum) throws Exception {
                      if (ownerName == null || ownerName.trim().isEmpty() || !hasSignature(ownerName)) return;
                      File sigFile = signatureFile(ownerName);
                      int[] dims = excelPngDimensions(sigFile);
                      if (dims[0] <= 0 || dims[1] <= 0) return;

                      String colLetter = targetCellRef.replaceAll("[0-9]", "");
                      int col0 = excelColToNum(colLetter) - 1;
                      int row0 = rowNum - 1;

                      int colW = excelColWidthToEmu(8.140625);
                      int rowH = excelRowHeightToEmu(27.6);
                      int[] fit = excelFitBox(dims[0], dims[1], colW - 19050, rowH - 19050);

                      String imgName = "image" + nextImageNum + ".png";
                      newMedia.put("xl/media/" + imgName, excelReadAllBytes(sigFile));
                      nextImageNum++;

                      if (sheetIdx == 0) {
                          int shapeId = nextShapeIdSheet1++;
                          String relId = "rId" + nextRelIdSheet1++;
                          sheet1Anchors.add(excelSignatureAnchor(shapeId, "Imza_" + ownerName, relId, col0, row0, fit[0], fit[1]));
                          sheet1Rels.add("<Relationship Id=\"" + relId + "\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/image\" Target=\"../media/" + imgName + "\"/>");
                      } else {
                          int shapeId = nextShapeIdSheet2++;
                          String relId = "rId" + nextRelIdSheet2++;
                          sheet2Anchors.add(excelSignatureAnchor(shapeId, "Imza_" + ownerName, relId, col0, row0, fit[0], fit[1]));
                          sheet2Rels.add("<Relationship Id=\"" + relId + "\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/image\" Target=\"../media/" + imgName + "\"/>");
                      }
                  }

                  // Personel imza sistemine (addSignature) DOKUNMADAN, birden fazla
                  // hücreyi kaplayan (örn. T23:V25) bir alan için imzayı en boy oranını
                  // koruyarak mümkün olan en büyük boyutta sığdırır. Kutu boyutu EMU
                  // cinsinden dışarıdan verilir (çağıran taraf ilgili sütun/satırların
                  // gerçek genişlik/yüksekliklerini toplar).
                  void addSignatureFit(int sheetIdx, String ownerName, String colLetter, int rowNum, int boxWEmu, int boxHEmu) throws Exception {
                      if (ownerName == null || ownerName.trim().isEmpty() || !hasSignature(ownerName)) return;
                      File sigFile = signatureFile(ownerName);
                      int[] dims = excelPngDimensions(sigFile);
                      if (dims[0] <= 0 || dims[1] <= 0) return;

                      int col0 = excelColToNum(colLetter) - 1;
                      int row0 = rowNum - 1;

                      int[] fit = excelFitBox(dims[0], dims[1], boxWEmu - 19050, boxHEmu - 19050);

                      String imgName = "image" + nextImageNum + ".png";
                      newMedia.put("xl/media/" + imgName, excelReadAllBytes(sigFile));
                      nextImageNum++;

                      if (sheetIdx == 0) {
                          int shapeId = nextShapeIdSheet1++;
                          String relId = "rId" + nextRelIdSheet1++;
                          sheet1Anchors.add(excelSignatureAnchor(shapeId, "Imza_" + ownerName, relId, col0, row0, fit[0], fit[1]));
                          sheet1Rels.add("<Relationship Id=\"" + relId + "\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/image\" Target=\"../media/" + imgName + "\"/>");
                      } else {
                          int shapeId = nextShapeIdSheet2++;
                          String relId = "rId" + nextRelIdSheet2++;
                          sheet2Anchors.add(excelSignatureAnchor(shapeId, "Imza_" + ownerName, relId, col0, row0, fit[0], fit[1]));
                          sheet2Rels.add("<Relationship Id=\"" + relId + "\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/image\" Target=\"../media/" + imgName + "\"/>");
                      }
                  }
              }

              // O ay içinde BAŞLAYAN ve son segmenti DONE olan ilk servis zincirini
              // bulur (özel gün kayıtları — person="-" — hariç). Bu, "tek bir gerçek
              // görev kaydı" testi için kullanılan zincirdir; zincirde 1 (otelsiz) veya
              // 2+ (otelli devam) segment olabilir.
              // O ay içinde başlayan ve son durumu DONE olan TÜM gerçek servis
              // zincirlerini (özel gün kayıtları hariç) bulur — sadece ilkini değil,
              // hepsini döndürür. Her biri writeChainToExcelSheets()'e ayrı ayrı
              // gönderilir; bir zincir diğerinin üzerine yazmaz çünkü her segment
              // kendi gerçek takvim gününün satırına yazılır.
              ArrayList<ArrayList<String>> findAllCompletedChainsForMonth(int year, int monthIndex0) {
                  ArrayList<ArrayList<String>> result = new ArrayList<>();
                  LinkedHashMap<String, ArrayList<String>> chains = new LinkedHashMap<>();
                  for (String r : records) {
                      String[] a = r.split("\\|", -1);
                      if (a.length < 7) continue;
                      ArrayList<String> list = chains.get(a[0]);
                      if (list == null) { list = new ArrayList<>(); chains.put(a[0], list); }
                      list.add(r);
                  }
                  SimpleDateFormat df = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault());
                  df.setLenient(false);
                  for (ArrayList<String> chain : chains.values()) {
                      if (chain.isEmpty()) continue;
                      String[] first = chain.get(0).split("\\|", -1);
                      if (first.length < 7 || ("-".equals(first[2]) && isSpecialLabel(first[3]))) continue;
                      try {
                          Date d = df.parse(first[1]);
                          Calendar c = Calendar.getInstance();
                          c.setTime(d);
                          if (c.get(Calendar.YEAR) != year || c.get(Calendar.MONTH) != monthIndex0) continue;
                      } catch (Exception e) { continue; }
                      String lastStatus = chain.get(chain.size() - 1).split("\\|", -1)[6];
                      if ("DONE".equals(lastStatus)) result.add(chain);
                  }
                  return result;
              }

              // Bulunan zincirin her segmentini kendi gününün doğru satırına, doğru
              // sütunlarına yazar: TARİH+Kiminle, Tren No, başlangıç/bitiş saat+isim+imza,
              // Fiili Çalışma (segmentin kendi süresi), ve HOTEL/HOTEL_DONE ise Otel
              // Giriş (mevcut "arrival") + Otel Çıkış (zincirdeki BİR SONRAKİ segmentin
              // başlangıç saati — Kural A). Yemek (M sütunu) ve aylık toplamlar bu
              // aşamada BİLİNÇLİ OLARAK yazılmıyor (ayrı aşamalar).
              void writeChainToExcelSheets(ArrayList<String> chain, int year, int monthIndex0,
                                           String[] sheets, ExcelStylePatcher patcher,
                                           ExcelDrawingPatcher drawingPatcher) throws Exception {
                  SimpleDateFormat df = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault());
                  df.setLenient(false);

                  // Tarih hücresi artık döngü içinde ANINDA yazılmıyor — aynı takvim
                  // gününe denk gelen birden fazla segment (ör. aynı gün kısa otel
                  // molası sonrası devam) olursa, ikinci segmentin yazımı birincinin
                  // Kiminle bilgisini SİLMESİN diye önce biriktirilip döngü bittikten
                  // sonra TEK seferde (1 veya 2 Kiminle ile) yazılır.
                  LinkedHashMap<String, ArrayList<String>> kiminleByDateCell = new LinkedHashMap<>();
                  LinkedHashMap<String, String> dateOnlyByDateCell = new LinkedHashMap<>();
                  LinkedHashMap<String, Integer> sheetIdxByDateCell = new LinkedHashMap<>();

                  for (int i = 0; i < chain.size(); i++) {
                      String[] a = chain.get(i).split("\\|", -1);
                      if (a.length < 7) continue;
                      String status = a[6];

                      Date startD;
                      try { startD = df.parse(a[1]); } catch (Exception e) { continue; }
                      Calendar cal = Calendar.getInstance();
                      cal.setTime(startD);
                      if (cal.get(Calendar.YEAR) != year || cal.get(Calendar.MONTH) != monthIndex0) continue;
                      int day = cal.get(Calendar.DAY_OF_MONTH);

                      String[] loc = excelDayLocation(day);
                      int sheetIdx = "sheet1".equals(loc[0]) ? 0 : 1;
                      int rowNum = Integer.parseInt(loc[1].replaceAll("[^0-9]", ""));
                      String base = loc[1].replaceAll("[0-9]", "");

                      String dateRef = base + rowNum;
                      String trainRef = excelColByOffset(base, 2) + rowNum;
                      String startTimeRef = excelColByOffset(base, 3) + rowNum;
                      String startOwnerRef = excelColByOffset(base, 4) + rowNum;
                      String startSigRef = excelColByOffset(base, 5) + rowNum;
                      String finishTimeRef = excelColByOffset(base, 6) + rowNum;
                      String finishOwnerRef = excelColByOffset(base, 7) + rowNum;
                      String finishSigRef = excelColByOffset(base, 8) + rowNum;
                      String dutyRef = excelColByOffset(base, 9) + rowNum;
                      String hotelInRef = excelColByOffset(base, 10) + rowNum;
                      String hotelOutRef = excelColByOffset(base, 11) + rowNum;

                      String dateCellKey = sheetIdx + "|" + dateRef;
                      String kiminle = (a[2] == null || a[2].trim().isEmpty() || "-".equals(a[2])) ? "" : a[2].trim();
                      if (!kiminle.isEmpty()) {
                          ArrayList<String> names = kiminleByDateCell.get(dateCellKey);
                          if (names == null) { names = new ArrayList<>(); kiminleByDateCell.put(dateCellKey, names); }
                          if (!names.contains(kiminle)) names.add(kiminle);
                      }
                      if (!dateOnlyByDateCell.containsKey(dateCellKey)) {
                          dateOnlyByDateCell.put(dateCellKey, a[1]);
                          sheetIdxByDateCell.put(dateCellKey, sheetIdx);
                      }

                      // Tren no / saat alanları: 14 punto (kenarlık/hizalama aynı kalır).
                      int trainStyle = patcher.getOrCreateFontSizeVariant(excelCellStyleIndex(sheets[sheetIdx], rowNum, trainRef), 14);
                      sheets[sheetIdx] = excelSetCell(sheets[sheetIdx], trainRef, a[3], trainStyle);
                      int startTimeStyle = patcher.getOrCreateFontSizeVariant(excelCellStyleIndex(sheets[sheetIdx], rowNum, startTimeRef), 14);
                      sheets[sheetIdx] = excelSetCell(sheets[sheetIdx], startTimeRef, a[4], startTimeStyle);
                      // Teslim/tesellüm sahibi İSİM: sağdaki İMZA hücresine taşmasın diye
                      // wrapText açık bir varyantla yazılır — genişlik/merge/satır yüksekliği
                      // DEĞİŞMEZ, uzun isim sadece hücre içinde alt alta gösterilir.
                      int startOwnerStyle = patcher.getOrCreateWrapVariant(excelCellStyleIndex(sheets[sheetIdx], rowNum, startOwnerRef));
                      sheets[sheetIdx] = excelSetCell(sheets[sheetIdx], startOwnerRef, a[5], startOwnerStyle);
                      if (drawingPatcher != null) drawingPatcher.addSignature(sheetIdx, a[5], startSigRef, rowNum);

                      if (a.length >= 10 && !"OPEN".equals(status)) {
                          // Excel çıktısında otelli görev için GÖREVİN BİTTİĞİ = OTEL GİRİŞ (arrival)
                          // olacak şekilde gösterilir. Uygulamadaki gerçek bitiş değeri (a[8]) ve
                          // duty/arrival hesabı DEĞİŞMEZ; sadece bu hücreye yazılan metin değişir.
                          boolean isHotelRow = "HOTEL".equals(status) || "HOTEL_DONE".equals(status);
                          String excelFinishTime = (isHotelRow && a.length >= 11) ? excelTimeOnly(a[10]) : a[8];
                          int finishTimeStyle = patcher.getOrCreateFontSizeVariant(excelCellStyleIndex(sheets[sheetIdx], rowNum, finishTimeRef), 14);
                          sheets[sheetIdx] = excelSetCell(sheets[sheetIdx], finishTimeRef, excelFinishTime, finishTimeStyle);
                          int finishOwnerStyle = patcher.getOrCreateWrapVariant(excelCellStyleIndex(sheets[sheetIdx], rowNum, finishOwnerRef));
                          sheets[sheetIdx] = excelSetCell(sheets[sheetIdx], finishOwnerRef, a[9], finishOwnerStyle);
                          if (drawingPatcher != null) drawingPatcher.addSignature(sheetIdx, a[9], finishSigRef, rowNum);
                          int dutyStyle = patcher.getOrCreateFontSizeVariant(excelCellStyleIndex(sheets[sheetIdx], rowNum, dutyRef), 14);
                          sheets[sheetIdx] = excelSetCell(sheets[sheetIdx], dutyRef, excelDuration(a[1], a[4], a[7], a[8]), dutyStyle);

                          // İcap: otel kullanılmaz — normal (otelsiz) DONE ise OTEL GİRİŞ ve
                          // OTEL ÇIKIŞ hücrelerine mevcut "x" gösterim mantığıyla (22pt,
                          // ortalanmış) işaret konur. Fiili çalışma hesabı yukarıdaki
                          // dutyRef satırıyla, değiştirilmeden, gerçek saatlerden hesaplanır.
                          if (!isHotelRow && "İcap".equals(a[3])) {
                              int icapInStyle = patcher.getOrCreateXMarkVariant(excelCellStyleIndex(sheets[sheetIdx], rowNum, hotelInRef));
                              sheets[sheetIdx] = excelSetCell(sheets[sheetIdx], hotelInRef, "x", icapInStyle);
                              int icapOutStyle = patcher.getOrCreateXMarkVariant(excelCellStyleIndex(sheets[sheetIdx], rowNum, hotelOutRef));
                              sheets[sheetIdx] = excelSetCell(sheets[sheetIdx], hotelOutRef, "x", icapOutStyle);
                          }
                      }

                      // OTEL GİRİŞ: uygulamada zaten hesaplanmış "arrival / Otele varış"
                      // değeri (a[10]) — teslim saati DEĞİL, yeniden hesaplanmıyor.
                      // OTEL ÇIKIŞ: mevcut satıra DEĞİL, zincirin bir sonraki segmentinin
                      // GERÇEKTEN başladığı günün KENDİ satırına yazılır (Kural A).
                      // Örn. 04.09 otele varış → 04.09 OTEL GİRİŞ; 05.09 03:30'da otelden
                      // çıkış → OTEL ÇIKIŞ 05.09 satırına yazılır, 04.09'a değil.
                      // Otel girişi/çıkışı FARKLI takvim günlerine denk geldiğinde, gerçek
                      // değerin YAZILMADIĞI karşı hücreye küçük harf "x" (boşluksuz, 22
                      // punto, yatay+dikey ortalanmış) yazılır — gerçek zamanlı değer ile
                      // "x" işareti her zaman 14pt / 22pt kendi ayrı stilleriyle yazılır.
                      if (("HOTEL".equals(status) || "HOTEL_DONE".equals(status)) && a.length >= 11) {
                          int hotelInStyle = patcher.getOrCreateFontSizeVariant(excelCellStyleIndex(sheets[sheetIdx], rowNum, hotelInRef), 14);
                          sheets[sheetIdx] = excelSetCell(sheets[sheetIdx], hotelInRef, excelTimeOnly(a[10]), hotelInStyle);
                          if (i + 1 < chain.size()) {
                              String[] next = chain.get(i + 1).split("\\|", -1);
                              if (next.length >= 5) {
                                  try {
                                      Date nextD = df.parse(next[1]);
                                      Calendar nextCal = Calendar.getInstance();
                                      nextCal.setTime(nextD);
                                      if (nextCal.get(Calendar.YEAR) == year && nextCal.get(Calendar.MONTH) == monthIndex0) {
                                          int nextDay = nextCal.get(Calendar.DAY_OF_MONTH);
                                          if (nextDay == day) {
                                              // Aynı takvim günü içinde otele giriş ve devam — çıkış
                                              // saati de AYNI satıra, gerçek değeriyle yazılır.
                                              int hotelOutStyle = patcher.getOrCreateFontSizeVariant(excelCellStyleIndex(sheets[sheetIdx], rowNum, hotelOutRef), 14);
                                              sheets[sheetIdx] = excelSetCell(sheets[sheetIdx], hotelOutRef, next[4], hotelOutStyle);
                                          } else {
                                              String[] nextLoc = excelDayLocation(nextDay);
                                              int nextSheetIdx = "sheet1".equals(nextLoc[0]) ? 0 : 1;
                                              int nextRowNum = Integer.parseInt(nextLoc[1].replaceAll("[^0-9]", ""));
                                              String nextBase = nextLoc[1].replaceAll("[0-9]", "");
                                              String nextHotelInRef = excelColByOffset(nextBase, 10) + nextRowNum;
                                              String nextHotelOutRef = excelColByOffset(nextBase, 11) + nextRowNum;

                                              // Otele varış günü ile trene devam günü ARASINDA (ikisi
                                              // hariç) kalan her takvim günü, gerçek bir kayıt taşımaz
                                              // ama Excel'de boş kalmamalı — mevcut "GÖREVİN BAŞLADIĞI
                                              // SA/DK" hücresine, özel gün yazılarıyla AYNI alan/stil
                                              // mantığıyla (16pt) "OTEL / BEKLEME" yazılır.
                                              for (int gapDay = day + 1; gapDay < nextDay; gapDay++) {
                                                  String[] gapLoc = excelDayLocation(gapDay);
                                                  int gapSheetIdx = "sheet1".equals(gapLoc[0]) ? 0 : 1;
                                                  int gapRowNum = Integer.parseInt(gapLoc[1].replaceAll("[^0-9]", ""));
                                                  String gapBase = gapLoc[1].replaceAll("[0-9]", "");
                                                  String gapStartTimeRef = excelColByOffset(gapBase, 3) + gapRowNum;
                                                  int gapStyle = patcher.getOrCreateFontSizeVariant(
                                                          excelCellStyleIndex(sheets[gapSheetIdx], gapRowNum, gapStartTimeRef), 16);
                                                  sheets[gapSheetIdx] = excelSetCell(sheets[gapSheetIdx], gapStartTimeRef, "OTEL / BEKLEME", gapStyle);
                                              }

                                              int xStyleHere = patcher.getOrCreateXMarkVariant(excelCellStyleIndex(sheets[sheetIdx], rowNum, hotelOutRef));
                                              sheets[sheetIdx] = excelSetCell(sheets[sheetIdx], hotelOutRef, "x", xStyleHere);

                                              int xStyleNext = patcher.getOrCreateXMarkVariant(excelCellStyleIndex(sheets[nextSheetIdx], nextRowNum, nextHotelInRef));
                                              sheets[nextSheetIdx] = excelSetCell(sheets[nextSheetIdx], nextHotelInRef, "x", xStyleNext);

                                              int nextHotelOutStyle = patcher.getOrCreateFontSizeVariant(excelCellStyleIndex(sheets[nextSheetIdx], nextRowNum, nextHotelOutRef), 14);
                                              sheets[nextSheetIdx] = excelSetCell(sheets[nextSheetIdx], nextHotelOutRef, next[4], nextHotelOutStyle);
                                          }
                                      }
                                  } catch (Exception ignored) {}
                              }
                          }
                      }
                  }

                  // Biriktirilen tarih hücrelerini TEK seferde yaz: Kiminle yoksa
                  // sadece tarih; 1 Kiminle varsa tarihin ÜSTÜNE; 2 Kiminle varsa
                  // birincisi tarihin ÜSTÜNE, ikincisi tarihin ALTINA. Tarihin mevcut
                  // dikey konumu, satır yüksekliği ve birleşim yapısı DEĞİŞMEZ —
                  // sadece aynı hücrenin metni (wrap ile) güncellenir.
                  for (Map.Entry<String, String> entry : dateOnlyByDateCell.entrySet()) {
                      String dateCellKey = entry.getKey();
                      String dateOnly = entry.getValue();
                      int dSheetIdx = sheetIdxByDateCell.get(dateCellKey);
                      String dateRefOnly = dateCellKey.substring(dateCellKey.indexOf('|') + 1);
                      int dRowNum = Integer.parseInt(dateRefOnly.replaceAll("[^0-9]", ""));
                      ArrayList<String> names = kiminleByDateCell.get(dateCellKey);

                      Matcher rowM = Pattern.compile("<row r=\"" + dRowNum + "\"[^>]*>.*?</row>", Pattern.DOTALL).matcher(sheets[dSheetIdx]);
                      rowM.find();
                      Matcher dateCellM = Pattern.compile("<c r=\"" + dateRefOnly + "\"(?:[^>]*?/>|[^>]*>.*?</c>)", Pattern.DOTALL).matcher(rowM.group());
                      dateCellM.find();
                      Matcher styleM = Pattern.compile("s=\"(\\d+)\"").matcher(dateCellM.group());
                      styleM.find();
                      int wrapStyle = patcher.getOrCreateTopLeftWrapVariant(Integer.parseInt(styleM.group(1)));

                      String dateText;
                      if (names == null || names.isEmpty()) {
                          dateText = dateOnly;
                      } else if (names.size() == 1) {
                          dateText = names.get(0) + "\n" + dateOnly;
                      } else {
                          dateText = names.get(0) + "\n" + dateOnly + "\n" + names.get(1);
                      }
                      sheets[dSheetIdx] = excelSetCell(sheets[dSheetIdx], dateRefOnly, dateText, wrapStyle);
                  }

                  // YEMEK SAYISI (M sütunu): uygulamadaki MEVCUT hesaplama (her 8 saat
                  // için 1 yemek hakkı, otelde konaklanan gece sayısı düşülür) birebir
                  // aynı şekilde, tek bir yerden (computeNetMealText) kullanılır — burada
                  // YENİDEN HESAPLANMAZ. Sonuç, zincirin SON (DONE) segmentinin
                  // bulunduğu satırın M hücresine yazılır.
                  if (!chain.isEmpty()) {
                      String lastRecord = chain.get(chain.size() - 1);
                      String[] lastArr = lastRecord.split("\\|", -1);
                      if (lastArr.length >= 7 && "DONE".equals(lastArr[6])) {
                          String mealText = computeNetMealText(chain.get(0), lastRecord);
                          if (!mealText.isEmpty()) {
                              try {
                                  Date lastD = df.parse(lastArr[1]);
                                  Calendar lastCal = Calendar.getInstance();
                                  lastCal.setTime(lastD);
                                  if (lastCal.get(Calendar.YEAR) == year && lastCal.get(Calendar.MONTH) == monthIndex0) {
                                      int lastDay = lastCal.get(Calendar.DAY_OF_MONTH);
                                      String[] lastLoc = excelDayLocation(lastDay);
                                      int lastSheetIdx = "sheet1".equals(lastLoc[0]) ? 0 : 1;
                                      int lastRowNum = Integer.parseInt(lastLoc[1].replaceAll("[^0-9]", ""));
                                      String lastBase = lastLoc[1].replaceAll("[0-9]", "");
                                      String mealRef = excelColByOffset(lastBase, 12) + lastRowNum;
                                      int mealStyle = patcher.getOrCreateFontSizeVariant(excelCellStyleIndex(sheets[lastSheetIdx], lastRowNum, mealRef), 14);
                                      sheets[lastSheetIdx] = excelSetCell(sheets[lastSheetIdx], mealRef, mealText, mealStyle);
                                  }
                              } catch (Exception ignored) {}
                          }
                      }
                  }
              }

              // Bir zincirin ilk kaydı ile son DONE kaydına göre net yemek hesabını
              // üretir. Uygulamanın aylık dökümde (chain kartında) gösterdiği hesapla
              // BİREBİR AYNI mantık — kod tekrarını önlemek için oraya da buradan
              // çağrılır (bkz. computeNetMealText çağrıları). Hesaplama DEĞİŞTİRİLMEDİ,
              // sadece tek bir yerden kullanılabilir hale getirildi.
              String computeNetMealText(String firstRecord, String lastDoneRecord) {
                  try {
                      SimpleDateFormat dutyFormat = new SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault());
                      dutyFormat.setLenient(false);
                      String[] firstArr = firstRecord.split("\\|", -1);
                      String[] lastArr = lastDoneRecord.split("\\|", -1);
                      Date dutyStart = dutyFormat.parse(firstArr[1] + " " + firstArr[4]);
                      Date dutyArrival = dutyFormat.parse(lastArr[10]);
                      if (dutyStart == null || dutyArrival == null) return "";

                      long diffMinutes = (dutyArrival.getTime() - dutyStart.getTime()) / 60000L;
                      if (diffMinutes < 0) diffMinutes = 0;

                      // Her 8 saat (480 dk) için 1 yemek hakkı.
                      int mealCount = (int) Math.ceil(diffMinutes / 480.0);
                      if (mealCount < 1) mealCount = 1;

                      int hotelNights = 0;
                      if (lastArr.length >= 12) {
                          try { hotelNights = Integer.parseInt(lastArr[11].trim()); } catch (Exception ignored) {}
                      }

                      if (hotelNights > 0) {
                          int netMeals = mealCount - hotelNights;
                          if (netMeals < 0) netMeals = 0;
                          return mealCount + "-" + hotelNights + "=" + netMeals;
                      }
                      return String.valueOf(mealCount);
                  } catch (Exception e) {
                      return "";
                  }
              }
              // O ay içinde tamamlanmış (status=DONE) ÖZEL GÜN kayıtlarını (Boş Gün /
              // Hafta Tatili / Yıllık İzin / İptal / Destek — person="-") bulur.
              // O tarihe (dd.MM.yyyy, a[1]) ait KAÇ kayıt (records) olduğunu sayar.
              // "Aynı takvim gününe en fazla 2 kayıt" kuralı için, yeni kayıt
              // EKLENMEDEN ÖNCE kontrol amaçlı kullanılır. records yapısı değişmez.
              int countRecordsForDate(String date) {
                  int count = 0;
                  for (String r : records) {
                      String[] a = r.split("\\|", -1);
                      if (a.length >= 2 && date.equals(a[1])) count++;
                  }
                  return count;
              }

              ArrayList<String> findSpecialDayRecordsForMonth(int year, int monthIndex0) {
                  ArrayList<String> result = new ArrayList<>();
                  SimpleDateFormat df = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault());
                  df.setLenient(false);
                  for (String r : records) {
                      String[] a = r.split("\\|", -1);
                      if (a.length < 7) continue;
                      if (a.length < 4 || !"-".equals(a[2]) || !"DONE".equals(a[6]) || !isSpecialLabel(a[3])) continue;
                      try {
                          Date d = df.parse(a[1]);
                          Calendar c = Calendar.getInstance();
                          c.setTime(d);
                          if (c.get(Calendar.YEAR) != year || c.get(Calendar.MONTH) != monthIndex0) continue;
                      } catch (Exception e) { continue; }
                      result.add(r);
                  }
                  return result;
              }

              // Özel gün kaydını (ör. "Boş Gün") ilgili günün "GÖREVİN BAŞLADIĞI SA/DK"
              // hücresinin (diyagonal çizgili, gerçek kayıtlarda da kullanılan aynı
              // hücre) ÜZERİNE yazar. Yeni satır/hücre/birleşim oluşturulmaz, mevcut
              // kenarlık ve stil (excelSetCell style<0 davranışı) korunur. Tren no,
              // isim, imza gibi görev alanlarına HİÇ dokunulmaz.
              void writeSpecialDayToExcelSheets(String record, int year, int monthIndex0, String[] sheets, ExcelStylePatcher patcher) throws Exception {
                  String[] a = record.split("\\|", -1);
                  if (a.length < 4) return;
                  SimpleDateFormat df = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault());
                  df.setLenient(false);
                  Date d;
                  try { d = df.parse(a[1]); } catch (Exception e) { return; }
                  Calendar cal = Calendar.getInstance();
                  cal.setTime(d);
                  if (cal.get(Calendar.YEAR) != year || cal.get(Calendar.MONTH) != monthIndex0) return;
                  int day = cal.get(Calendar.DAY_OF_MONTH);

                  String[] loc = excelDayLocation(day);
                  int sheetIdx = "sheet1".equals(loc[0]) ? 0 : 1;
                  int rowNum = Integer.parseInt(loc[1].replaceAll("[^0-9]", ""));
                  String base = loc[1].replaceAll("[0-9]", "");
                  String startTimeRef = excelColByOffset(base, 3) + rowNum;
                  int specialStyle = patcher.getOrCreateFontSizeVariant(excelCellStyleIndex(sheets[sheetIdx], rowNum, startTimeRef), 16);
                  sheets[sheetIdx] = excelSetCell(sheets[sheetIdx], startTimeRef, a[3], specialStyle);
              }

              // Ay/yıl ve puantaj sahibi bilgilerine göre şablonun bir kopyasını üretir.
              // Personel bilgileri + ay/yıl başlığı + Pazar kırmızısı + (varsa) o ay
              // içinde tamamlanmış İLK servis zincirinin tüm alanları yazılır. Yemek
              // sütunu ve aylık toplamlar bilinçli olarak bu aşamada yazılmıyor.
              File generateTestExcel(int year, int monthIndex0) throws Exception {
                  File tempTemplate = new File(getCacheDir(), "puantaj_template_tmp.xlsx");
                  try (InputStream in = getAssets().open("puantaj_template.xlsx");
                       FileOutputStream out = new FileOutputStream(tempTemplate)) {
                      byte[] buf = new byte[8192];
                      int len;
                      while ((len = in.read(buf)) > 0) out.write(buf, 0, len);
                  }

                  ArrayList<String> names = new ArrayList<>();
                  HashMap<String, byte[]> contents = new HashMap<>();
                  try (ZipFile zf = new ZipFile(tempTemplate)) {
                      Enumeration<? extends ZipEntry> entries = zf.entries();
                      while (entries.hasMoreElements()) {
                          ZipEntry e = entries.nextElement();
                          names.add(e.getName());
                          try (InputStream es = zf.getInputStream(e)) {
                              ByteArrayOutputStream bos = new ByteArrayOutputStream();
                              byte[] buf = new byte[8192];
                              int len;
                              while ((len = es.read(buf)) > 0) bos.write(buf, 0, len);
                              contents.put(e.getName(), bos.toByteArray());
                          }
                      }
                  }

                  String sheet1 = new String(contents.get("xl/worksheets/sheet1.xml"), "UTF-8");
                  String sheet2 = new String(contents.get("xl/worksheets/sheet2.xml"), "UTF-8");
                  String styles = new String(contents.get("xl/styles.xml"), "UTF-8");

                  ExcelStylePatcher patcher = new ExcelStylePatcher(styles);
                  int daysInMonth = excelDaysInMonth(year, monthIndex0);

                  for (int day = 1; day <= 31; day++) {
                      if (day > daysInMonth) continue; // ay bu günü içermiyor: dokunma
                      String[] loc = excelDayLocation(day);
                      String targetXml = "sheet1".equals(loc[0]) ? sheet1 : sheet2;
                      String dateText = String.format(Locale.getDefault(), "%02d.%02d.%d", day, monthIndex0 + 1, year);

                      int styleOverride = -1;
                      if (excelIsSunday(year, monthIndex0, day)) {
                          int rowNum = Integer.parseInt(loc[1].replaceAll("[^0-9]", ""));
                          Matcher rowM = Pattern.compile("<row r=\"" + rowNum + "\"[^>]*>.*?</row>", Pattern.DOTALL).matcher(targetXml);
                          rowM.find();
                          Matcher cellM = Pattern.compile("<c r=\"" + loc[1] + "\"(?:[^>]*?/>|[^>]*>.*?</c>)", Pattern.DOTALL).matcher(rowM.group());
                          cellM.find();
                          Matcher sM = Pattern.compile("s=\"(\\d+)\"").matcher(cellM.group());
                          sM.find();
                          styleOverride = patcher.getOrCreateRedVariant(Integer.parseInt(sM.group(1)));
                      }

                      String patched = excelSetCell(targetXml, loc[1], dateText, styleOverride);
                      if ("sheet1".equals(loc[0])) sheet1 = patched; else sheet2 = patched;
                  }

                  sheet2 = excelSetCell(sheet2, "R7", EXCEL_AY_ADLARI[monthIndex0] + " " + year + " Ayına Ait", -1);

                  int bigValueStyle = patcher.getOrCreateBigValueStyle();
                  sheet2 = excelSetPersonnelValue(sheet2, "T12", "X13", prefs.getString("owner_sicil_no", ""), bigValueStyle);
                  sheet2 = excelSetPersonnelValue(sheet2, "T15", "X16", prefs.getString("owner_ad_soyad", ""), bigValueStyle);
                  sheet2 = excelSetPersonnelValue(sheet2, "T18", "X19", prefs.getString("owner_gorevi", ""), bigValueStyle);
                  sheet2 = excelSetPersonnelValue(sheet2, "T21", "X22", prefs.getString("owner_merkezi", ""), bigValueStyle);

                  ExcelDrawingPatcher drawingPatcher = new ExcelDrawingPatcher();

                  // Puantaj sahibinin kendi imzası: DIŞ sayfasında hazır bulunan
                  // "PERSONEL İMZASI" alanına (P24:S25 etiketinin karşılığı olan
                  // T23:V25 3x3 hücrelik alan) eklenir. Kayıtlı imza yoksa hiçbir şey
                  // yazılmaz, alan boş kalır (addSignatureFit zaten bunu kendi içinde
                  // kontrol ediyor). Alan T,U,V sütunlarının ve 23,24,25 satırlarının
                  // GERÇEK genişlik/yükseklikleri toplanarak hesaplanır; imza bu alana
                  // en boy oranı korunarak, mümkün olan en büyük boyutta sığdırılır.
                  int puantajBoxW = 3 * excelColWidthToEmu(8.140625); // T + U + V
                  int puantajBoxH = excelRowHeightToEmu(27.6 * 3);    // satır 23 + 24 + 25
                  drawingPatcher.addSignatureFit(1, "_puantaj_sahibi", "T", 23, puantajBoxW, puantajBoxH);

                  // O ay içinde başlayıp tamamlanmış TÜM gerçek görev zincirleri —
                  // hiçbiri atlanmaz, her biri kendi gerçek günlerine yazılır.
                  ArrayList<ArrayList<String>> allChains = findAllCompletedChainsForMonth(year, monthIndex0);
                  for (ArrayList<String> chain : allChains) {
                      String[] sheetsHolder = new String[]{sheet1, sheet2};
                      writeChainToExcelSheets(chain, year, monthIndex0, sheetsHolder, patcher, drawingPatcher);
                      sheet1 = sheetsHolder[0];
                      sheet2 = sheetsHolder[1];
                  }

                  // O ay içindeki TÜM özel gün kayıtları (Boş Gün / Hafta Tatili /
                  // Yıllık İzin / İptal / Destek) — hepsi yazılır, tek bir tanesi değil.
                  ArrayList<String> specialDays = findSpecialDayRecordsForMonth(year, monthIndex0);
                  for (String specialRecord : specialDays) {
                      String[] sheetsHolder = new String[]{sheet1, sheet2};
                      writeSpecialDayToExcelSheets(specialRecord, year, monthIndex0, sheetsHolder, patcher);
                      sheet1 = sheetsHolder[0];
                      sheet2 = sheetsHolder[1];
                  }

                  // SAYFA TOPLAMLARI: İÇ sayfasının sol (1-11: J/M) ve sağ (12-22: X/AA)
                  // yarıları ile DIŞ sayfasının kendi bölümü (23-31: J/M) — bu motorun
                  // KENDİ yazdığı hücreler geri okunarak toplanır (yeniden hesap değil,
                  // zaten yazılmış değerlerin toplamı). Sonuç mevcut TOPLAM birleşim
                  // çapa hücrelerine (J25/M25/X25/AA25, DIŞ'ta J21/M21) yazılır.
                  int leftDutyMin = 0, leftMeal = 0;
                  for (int day = 1; day <= 11 && day <= daysInMonth; day++) {
                      String[] loc = excelDayLocation(day);
                      int rowNum = Integer.parseInt(loc[1].replaceAll("[^0-9]", ""));
                      leftDutyMin += excelParseDurationToMinutes(excelReadCellText(sheet1, "J" + rowNum));
                      leftMeal += excelParseNetMeal(excelReadCellText(sheet1, "M" + rowNum));
                  }
                  int rightDutyMin = 0, rightMeal = 0;
                  for (int day = 12; day <= 22 && day <= daysInMonth; day++) {
                      String[] loc = excelDayLocation(day);
                      int rowNum = Integer.parseInt(loc[1].replaceAll("[^0-9]", ""));
                      rightDutyMin += excelParseDurationToMinutes(excelReadCellText(sheet1, "X" + rowNum));
                      rightMeal += excelParseNetMeal(excelReadCellText(sheet1, "AA" + rowNum));
                  }
                  int outDutyMin = 0, outMeal = 0;
                  for (int day = 23; day <= 31 && day <= daysInMonth; day++) {
                      String[] loc = excelDayLocation(day);
                      int rowNum = Integer.parseInt(loc[1].replaceAll("[^0-9]", ""));
                      outDutyMin += excelParseDurationToMinutes(excelReadCellText(sheet2, "J" + rowNum));
                      outMeal += excelParseNetMeal(excelReadCellText(sheet2, "M" + rowNum));
                  }

                  int leftDutyStyle = patcher.getOrCreateFontSizeCenteredVariant(excelCellStyleIndex(sheet1, 25, "J25"), 14);
                  sheet1 = excelSetCell(sheet1, "J25", excelMinutesToDuration(leftDutyMin), leftDutyStyle);
                  int leftMealStyle = patcher.getOrCreateFontSizeCenteredVariant(excelCellStyleIndex(sheet1, 25, "M25"), 16);
                  sheet1 = excelSetCell(sheet1, "M25", String.valueOf(leftMeal), leftMealStyle);
                  int rightDutyStyle = patcher.getOrCreateFontSizeCenteredVariant(excelCellStyleIndex(sheet1, 25, "X25"), 14);
                  sheet1 = excelSetCell(sheet1, "X25", excelMinutesToDuration(rightDutyMin), rightDutyStyle);
                  int rightMealStyle = patcher.getOrCreateFontSizeCenteredVariant(excelCellStyleIndex(sheet1, 25, "AA25"), 16);
                  sheet1 = excelSetCell(sheet1, "AA25", String.valueOf(rightMeal), rightMealStyle);
                  int outDutyStyle = patcher.getOrCreateFontSizeCenteredVariant(excelCellStyleIndex(sheet2, 21, "J21"), 14);
                  sheet2 = excelSetCell(sheet2, "J21", excelMinutesToDuration(outDutyMin), outDutyStyle);
                  int outMealStyle = patcher.getOrCreateFontSizeCenteredVariant(excelCellStyleIndex(sheet2, 21, "M21"), 16);
                  sheet2 = excelSetCell(sheet2, "M21", String.valueOf(outMeal), outMealStyle);

                  // DIŞ sayfası GENEL toplamlar: İÇ sol + İÇ sağ + DIŞ kendi toplamı.
                  // "AYLIK ÇALIŞMA SAATİ" ve "FAZLA MESAİ SAATİ" alanları bu aşamada
                  // BİLİNÇLİ OLARAK boş bırakılıyor — sadece bu iki alan dolduruluyor.
                  //
                  // ÇOK ÖNEMLİ: şablondaki "FİİLİ ÇALIŞMA SAATİ TOPLAMI=......" ve
                  // "HAK EDİLEN YEMEK SAYISI=......" ETİKETLERİ (metin+stil+11pt) HİÇ
                  // DEĞİŞMİYOR — gerçek rich-text run olarak, kendi puntosuyla aynen
                  // yazılıyor. Sadece sonuç değeri AYRI bir run olarak 14pt yazılıyor.
                  // FİİLİ ÇALIŞMA: etiketten sonra TAM 18 nokta, ardından "H Saat M
                  // Dakika" (14pt), ardından KALAN noktalar — toplam uzunluk şablonun
                  // ORİJİNAL nokta bütçesini (133) aşmayacak şekilde hesaplanır, böylece
                  // "AYLIK ÇALIŞMA SAATİ=..." satırının sağ hizasını geçmez.
                  // HAK EDİLEN YEMEK SAYISI: değer, orijinal nokta biriminin (54 karakter)
                  // TAM ORTASINA denk gelecek şekilde yerleştirilir.
                  int totalDutyMin = leftDutyMin + rightDutyMin + outDutyMin;
                  int totalMeal = leftMeal + rightMeal + outMeal;

                  String dutyLabelPrefix = "FİİLİ ÇALIŞMA SAATİ TOPLAMI=";
                  String dutyLabelDots = ".....................................................................................................................................";
                  int dutyGapLen = Math.min(18, dutyLabelDots.length());
                  String dutyGapDots = dutyLabelDots.substring(0, dutyGapLen);
                  String dutyValueText = excelMinutesToSaatDakika(totalDutyMin);
                  int dutyRemainingLen = Math.max(0, dutyLabelDots.length() - dutyGapLen - dutyValueText.length());
                  String dutyTrailingDots = dutyLabelDots.substring(dutyLabelDots.length() - dutyRemainingLen);
                  sheet2 = excelSetCellRichText(sheet2, "A22", patcher.original,
                          new String[]{dutyLabelPrefix, dutyGapDots, dutyValueText, dutyTrailingDots},
                          new int[]{0, 0, 14, 0});

                  String mealLabelPrefix = "HAK EDİLEN YEMEK SAYISI=";
                  String mealLabelDots = " …....................................................";
                  int mealGapLen = Math.min(mealLabelDots.length() / 2, mealLabelDots.length());
                  String mealGapDots = mealLabelDots.substring(0, mealGapLen);
                  String mealValueText = String.valueOf(totalMeal);
                  int mealRemainingLen = Math.max(0, mealLabelDots.length() - mealGapLen - mealValueText.length());
                  String mealTrailingDots = mealLabelDots.substring(mealLabelDots.length() - mealRemainingLen);
                  sheet2 = excelSetCellRichText(sheet2, "A25", patcher.original,
                          new String[]{mealLabelPrefix, mealGapDots, mealValueText, mealTrailingDots},
                          new int[]{0, 0, 14, 0});

                  styles = patcher.build();
                  contents.put("xl/worksheets/sheet1.xml", sheet1.getBytes("UTF-8"));
                  contents.put("xl/worksheets/sheet2.xml", sheet2.getBytes("UTF-8"));
                  contents.put("xl/styles.xml", styles.getBytes("UTF-8"));

                  // sheet2 (DIŞ) imzaları: şablonda zaten var olan drawing1.xml/rels'e,
                  // mevcut logoya hiç dokunmadan, yalnızca sona ekleme yapılır.
                  if (!drawingPatcher.sheet2Anchors.isEmpty()) {
                      String drawingXml = new String(contents.get("xl/drawings/drawing1.xml"), "UTF-8");
                      String drawingRelsXml = new String(contents.get("xl/drawings/_rels/drawing1.xml.rels"), "UTF-8");
                      StringBuilder anchorsSb = new StringBuilder();
                      for (String anchor : drawingPatcher.sheet2Anchors) anchorsSb.append(anchor);
                      drawingXml = drawingXml.replace("</xdr:wsDr>", anchorsSb + "</xdr:wsDr>");
                      StringBuilder relsSb = new StringBuilder();
                      for (String rel : drawingPatcher.sheet2Rels) relsSb.append(rel);
                      drawingRelsXml = drawingRelsXml.replace("</Relationships>", relsSb + "</Relationships>");
                      contents.put("xl/drawings/drawing1.xml", drawingXml.getBytes("UTF-8"));
                      contents.put("xl/drawings/_rels/drawing1.xml.rels", drawingRelsXml.getBytes("UTF-8"));
                  }

                  // sheet1 (İÇ) imzaları: şablonda sheet1'in HİÇBİR drawing ilişkisi
                  // yok — bu yüzden kendi bağımsız drawing2.xml'i, kendi rels'i,
                  // sheet1.xml.rels'e yeni bir ilişki ve sheet1.xml'e <drawing/> etiketi
                  // ve [Content_Types].xml'e yeni Override eklenerek oluşturulur.
                  // sheet2/drawing1.xml ve logoya kesinlikle dokunulmaz.
                  if (!drawingPatcher.sheet1Anchors.isEmpty()) {
                      StringBuilder anchorsSb = new StringBuilder();
                      for (String anchor : drawingPatcher.sheet1Anchors) anchorsSb.append(anchor);
                      String drawing2Xml = "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n"
                              + "<xdr:wsDr xmlns:xdr=\"http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing\" xmlns:a=\"http://schemas.openxmlformats.org/drawingml/2006/main\">"
                              + anchorsSb + "</xdr:wsDr>";
                      StringBuilder relsSb = new StringBuilder();
                      for (String rel : drawingPatcher.sheet1Rels) relsSb.append(rel);
                      String drawing2RelsXml = "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n"
                              + "<Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\">"
                              + relsSb + "</Relationships>";
                      contents.put("xl/drawings/drawing2.xml", drawing2Xml.getBytes("UTF-8"));
                      contents.put("xl/drawings/_rels/drawing2.xml.rels", drawing2RelsXml.getBytes("UTF-8"));
                      names.add("xl/drawings/drawing2.xml");
                      names.add("xl/drawings/_rels/drawing2.xml.rels");

                      String sheet1RelsXml = new String(contents.get("xl/worksheets/_rels/sheet1.xml.rels"), "UTF-8");
                      Matcher ridM = Pattern.compile("Id=\"rId(\\d+)\"").matcher(sheet1RelsXml);
                      int maxRid = 0;
                      while (ridM.find()) maxRid = Math.max(maxRid, Integer.parseInt(ridM.group(1)));
                      String newRid = "rId" + (maxRid + 1);
                      sheet1RelsXml = sheet1RelsXml.replace("</Relationships>",
                              "<Relationship Id=\"" + newRid + "\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing\" Target=\"../drawings/drawing2.xml\"/></Relationships>");
                      contents.put("xl/worksheets/_rels/sheet1.xml.rels", sheet1RelsXml.getBytes("UTF-8"));

                      String sheet1WithDrawing = sheet1.replace("</worksheet>", "<drawing r:id=\"" + newRid + "\"/></worksheet>");
                      contents.put("xl/worksheets/sheet1.xml", sheet1WithDrawing.getBytes("UTF-8"));

                      String contentTypesXml = new String(contents.get("[Content_Types].xml"), "UTF-8");
                      contentTypesXml = contentTypesXml.replace("</Types>",
                              "<Override PartName=\"/xl/drawings/drawing2.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.drawing+xml\"/></Types>");
                      contents.put("[Content_Types].xml", contentTypesXml.getBytes("UTF-8"));
                  }

                  for (Map.Entry<String, byte[]> mediaEntry : drawingPatcher.newMedia.entrySet()) {
                      contents.put(mediaEntry.getKey(), mediaEntry.getValue());
                      names.add(mediaEntry.getKey());
                  }

                  File outDir = new File(getExternalFilesDir(null), "Puantaj");
                  if (!outDir.exists()) outDir.mkdirs();
                  File outFile = new File(outDir, "test_" + EXCEL_AY_ADLARI[monthIndex0] + "_" + year + ".xlsx");

                  try (ZipOutputStream zos = new ZipOutputStream(new FileOutputStream(outFile))) {
                      for (String name : names) {
                          zos.putNextEntry(new ZipEntry(name));
                          zos.write(contents.get(name));
                          zos.closeEntry();
                      }
                  }

                  tempTemplate.delete();
                  return outFile;
              }

              // GEÇİCİ test tetikleyicisi — sadece bu motorun gerçekten çalışan bir
              // .xlsx ürettiğini doğrulamak için. "4011 Excel Çıktıları" ekranı ayrı
              // bir aşamada bunun üzerine kurulacak.
              void testGenerateExcel() {
                  try {
                      Calendar now = Calendar.getInstance();
                      File result = generateTestExcel(now.get(Calendar.YEAR), now.get(Calendar.MONTH));
                      Uri uri = androidx.core.content.FileProvider.getUriForFile(
                              this, getPackageName() + ".fileprovider", result);
                      Intent shareIntent = new Intent(Intent.ACTION_SEND);
                      shareIntent.setType("application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
                      shareIntent.putExtra(Intent.EXTRA_STREAM, uri);
                      shareIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivity(Intent.createChooser(shareIntent, "Test Excel dosyasını aç / paylaş"));
                  } catch (Exception e) {
                      Toast.makeText(this, "Excel oluşturulamadı: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }

