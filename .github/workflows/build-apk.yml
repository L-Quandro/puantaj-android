              // aşağı kaydırmak zorunda kalmaz. Her adım tek bir soruya odaklanır.
              LinearLayout wizardPage(String stepTitle, String stepHint, int stepIndex, int totalSteps, Runnable onBack) {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(20), dp(20), dp(20), dp(20));
                  root.setBackground(spaceBackground());
                  setContentView(root);

                  LinearLayout topBar = new LinearLayout(this);
                  topBar.setOrientation(LinearLayout.HORIZONTAL);
                  topBar.setGravity(Gravity.CENTER_VERTICAL);

                  TextView back = text("←", 22, TEXT_SECONDARY, true);
                  back.setPadding(dp(4), dp(12), dp(20), dp(12));
                  back.setMinWidth(dp(44));
                  back.setGravity(Gravity.CENTER_VERTICAL);
                  addRipple(back);
                  back.setOnClickListener(v -> onBack.run());
                  topBar.addView(back);

                  LinearLayout dots = new LinearLayout(this);
                  dots.setOrientation(LinearLayout.HORIZONTAL);
                  dots.setGravity(Gravity.CENTER_VERTICAL);
                  for (int i = 0; i < totalSteps; i++) {
                      View dot = new View(this);
                      int size = dp(i == stepIndex ? 10 : 8);
                      LinearLayout.LayoutParams dotParams = new LinearLayout.LayoutParams(size, size);
                      dotParams.setMargins(dp(3), 0, dp(3), 0);
                      GradientDrawable dotBg = new GradientDrawable();
                      dotBg.setShape(GradientDrawable.OVAL);
                      if (i < stepIndex) dotBg.setColor(NEON_GREEN);
                      else if (i == stepIndex) dotBg.setColor(NEON_PURPLE_BRIGHT);
                      else dotBg.setColor(CARD_BG_ALT);
                      dot.setBackground(dotBg);
                      dots.addView(dot, dotParams);
                  }
                  LinearLayout.LayoutParams dotsParams = new LinearLayout.LayoutParams(0, -2, 1f);
                  topBar.addView(dots, dotsParams);

                  TextView stepCount = text((stepIndex + 1) + "/" + totalSteps, 13, TEXT_MUTED, true);
                  topBar.addView(stepCount);

                  root.addView(topBar);

                  TextView heading = text(stepTitle, 26, TEXT_PRIMARY, true);
                  heading.setPadding(0, dp(22), 0, dp(4));
                  root.addView(heading);

                  if (stepHint != null && !stepHint.isEmpty()) {
                      root.addView(subtitle(stepHint));
                  } else {
                      View spacer = new View(this);
                      root.addView(spacer, new LinearLayout.LayoutParams(-1, dp(18)));
                  }

                  return root;
              }
          
              // Gün numarasından (1-31) hangi sayfa + hangi hücrede olduğunu döner.
              // Bu eşleme şablonun sabit yapısından geliyor: ay/yıl ne olursa olsun
              // gün 1 her zaman İÇ!A3, gün 23 her zaman DIŞ!A3'tür.
              String[] excelDayLocation(int day) {
                  if (day >= 1 && day <= 11) return new String[]{"sheet1", "A" + (2 * day + 1)};
                  if (day >= 12 && day <= 22) return new String[]{"sheet1", "O" + (2 * (day - 11) + 1)};
                  if (day >= 23 && day <= 31) return new String[]{"sheet2", "A" + (2 * (day - 22) + 1)};
                  throw new IllegalArgumentException("Geçersiz gün: " + day);
              }

              int excelDaysInMonth(int year, int monthIndex0) {
                  Calendar c = Calendar.getInstance();
                  c.clear();
                  c.set(year, monthIndex0, 1);
                  return c.getActualMaximum(Calendar.DAY_OF_MONTH);
              }

              boolean excelIsSunday(int year, int monthIndex0, int day) {
                  Calendar c = Calendar.getInstance();
                  c.clear();
                  c.set(year, monthIndex0, day);
                  return c.get(Calendar.DAY_OF_WEEK) == Calendar.SUNDAY;
              }

              // "A" + kaç sütun sağa gidileceği -> hedef sütun harfi. TARİH sütununu (A
              // veya İÇ'in sağ yarısında O) temel alıp diğer tüm sütunları buradan türetir
              // — böylece İÇ'in iki yarım tablosu (A.. ve O..) ve DIŞ (A..) için AYNI kod
              // çalışır, ayrı ayrı yazılmaz.
              String excelNumToCol(int num) {
                  StringBuilder sb = new StringBuilder();
                  while (num > 0) {
                      int rem = (num - 1) % 26;
                      sb.insert(0, (char) ('A' + rem));
                      num = (num - 1) / 26;
                  }
                  return sb.toString();
              }

              String excelColByOffset(String baseLetter, int offset) {
                  return excelNumToCol(excelColToNum(baseLetter) + offset);
              }

              // Segmentin kendi süresi (J sütunu): ham bitiş−başlangıç, zincir toplamı
              // DEĞİL (analiz raporunda kesinleşen kural). "H:MM" biçiminde METİN olarak
              // üretilir — Excel'in gerçek bir saat/tarih değeri olarak değil, aynı diğer
              // tüm hücrelerde olduğu gibi düz metin yazılır; bu yüzden 24 saati aşan
              // toplamlarda (Madde B, sayfa toplamı için) [h]:mm gibi özel bir sayı
              // biçimine hiç gerek kalmıyor.
              String excelDuration(String startDate, String startTime, String finishDate, String finishTime) {
                  try {
                      SimpleDateFormat f = new SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault());
                      f.setLenient(false);
                      Date start = f.parse(startDate + " " + startTime);
                      Date finish = f.parse(finishDate + " " + finishTime);
                      long diffMinutes = (finish.getTime() - start.getTime()) / 60000L;
                      if (diffMinutes < 0) diffMinutes = 0;
                      return (diffMinutes / 60) + ":" + String.format(Locale.getDefault(), "%02d", diffMinutes % 60);
                  } catch (Exception e) {
                      return "";
                  }
              }

              // "dd.MM.yyyy HH:mm" alanından yalnızca "HH:mm" kısmını ayıklar (OTEL GİRİŞ
              // için — uygulamanın mevcut "arrival" hesabı aynen kullanılıyor, yeniden
              // hesaplanmıyor).
              String excelTimeOnly(String dateTimeStr) {
                  if (dateTimeStr == null) return "";
                  int sp = dateTimeStr.indexOf(' ');
                  return sp >= 0 ? dateTimeStr.substring(sp + 1) : dateTimeStr;
              }

              // ---- İmza görseli gömme ----
              int[] excelPngDimensions(File pngFile) {
                  BitmapFactory.Options opts = new BitmapFactory.Options();
                  opts.inJustDecodeBounds = true;
                  BitmapFactory.decodeFile(pngFile.getAbsolutePath(), opts);
                  return new int[]{opts.outWidth, opts.outHeight};
              }

              int excelColWidthToEmu(double widthUnits) {
                  return (int) Math.round((widthUnits * 7 + 5) * 9525);
              }

              int excelRowHeightToEmu(double heightPt) {
                  return (int) Math.round(heightPt * 12700);
              }

              int[] excelFitBox(int imgW, int imgH, int boxW, int boxH) {
                  double scale = Math.min((double) boxW / imgW, (double) boxH / imgH);
                  return new int[]{(int) (imgW * scale), (int) (imgH * scale)};
              }

