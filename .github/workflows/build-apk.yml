                      String arrival = addThirtyMinutes(selectedFinishDate, selectedFinish);
                      int index = records.indexOf(recordData);
                      if (index != -1) {
                          String newStatusStr = "|DONE|" + selectedFinishDate + "|" + selectedFinish + "|" + ownerPicker.getValue() + "|" + arrival + "|" + hotelNightsChoice[0];
                          records.set(index, recordData.replace("|OPEN", newStatusStr));
                          saveDataToStorage();
                          showHomeScreen();
