                      int index = records.indexOf(recordData);
                      if (index != -1) {
                          String newStatusStr = "|HOTEL|" + selectedFinishDate + "|" + selectedFinish + "|" + ownerPicker.getValue() + "|" + hotelArrival;
                          records.set(index, recordData.replace("|OPEN", newStatusStr));
